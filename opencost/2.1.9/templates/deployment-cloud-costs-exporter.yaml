{{- if .Values.opencost.cloudCost.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-costs-exporter
  namespace: tf-atx-opencost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-costs-exporter
  template:
    metadata:
      labels:
        app: cloud-costs-exporter
    spec:
      containers:
      - name: exporter
        image: python:3.9-alpine
        command: ["/bin/sh"]
        args:
          - -c
          - |
            pip install requests prometheus_client && python /app/app.py
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: cloud-costs-exporter-script
{{- end }}
  