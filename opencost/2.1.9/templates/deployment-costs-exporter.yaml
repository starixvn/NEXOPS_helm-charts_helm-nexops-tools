apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-costs-exporter
  namespace: tf-atx-opencost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-costs-exporter
  template:
    metadata:
      labels:
        app: cloud-costs-exporter
    spec:
      containers:
      - name: exporter
        image: alpine:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            # Install dependencies
            apk add --no-cache curl jq netcat-openbsd
            echo "Cloud Costs Exporter started on port 8080"
            
            # Function để test các endpoints
            generate_metrics() {
              echo "HTTP/1.1 200 OK"
              echo "Content-Type: text/plain; version=0.0.4"
              echo "Connection: close"
              echo ""
              
              echo "# DEBUG: Testing different OpenCost endpoints"
              
              # Thử các endpoints khác nhau
              ENDPOINTS=(
                "/allocation/compute"
                "/allocation"
                "/assets"
                "/metrics"
                "/model"
                "/healthz"
              )
              
              for endpoint in "${ENDPOINTS[@]}"; do
                echo "# DEBUG: Testing $endpoint"
                RESPONSE=$(curl -s "http://opencost-atx-sgprod.tf-atx-opencost.svc:9003${endpoint}?window=2d")
                CODE=$(echo "$RESPONSE" | jq -r '.code // "N/A"' 2>/dev/null || echo "Invalid JSON")
                echo "# DEBUG: $endpoint -> code: $CODE"
              done
              
              # Thử endpoint cloud costs đúng
              echo "# DEBUG: Testing cloud costs endpoints..."
              
              # Endpoint 1: /cloudCost
              RESPONSE1=$(curl -s "http://opencost-atx-sgprod.tf-atx-opencost.svc:9003/cloudCost?window=2d")
              echo "# DEBUG: /cloudCost -> $(echo "$RESPONSE1" | jq -r '.code // "N/A"' 2>/dev/null || echo "Invalid JSON")"
              
              # Endpoint 2: /cloudCosts (có 's')
              RESPONSE2=$(curl -s "http://opencost-atx-sgprod.tf-atx-opencost.svc:9003/cloudCosts?window=2d")
              echo "# DEBUG: /cloudCosts -> $(echo "$RESPONSE2" | jq -r '.code // "N/A"' 2>/dev/null || echo "Invalid JSON")"
              
              # Endpoint 3: /cloudCosts (không có window)
              RESPONSE3=$(curl -s "http://opencost-atx-sgprod.tf-atx-opencost.svc:9003/cloudCosts")
              echo "# DEBUG: /cloudCosts (no window) -> $(echo "$RESPONSE3" | jq -r '.code // "N/A"' 2>/dev/null || echo "Invalid JSON")"
            }
            
            # Start HTTP server
            while true; do
              generate_metrics | nc -l -p 8080 -q 1
            done
        ports:
        - containerPort: 8080