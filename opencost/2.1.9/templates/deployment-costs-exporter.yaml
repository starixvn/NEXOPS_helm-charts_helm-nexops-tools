apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-costs-exporter
  namespace: tf-atx-opencost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-costs-exporter
  template:
    metadata:
      labels:
        app: cloud-costs-exporter
    spec:
      containers:
      - name: exporter
        image: alpine:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            # Install dependencies
            apk add --no-cache curl jq netcat-openbsd
            echo "Cloud Costs Exporter started on port 8080"
            
            # Function to generate metrics
            generate_metrics() {
              echo "HTTP/1.1 200 OK"
              echo "Content-Type: text/plain; version=0.0.4"
              echo "Connection: close"
              echo ""
              
              echo "# HELP cloud_cost_total Total cloud cost from OpenCost"
              echo "# TYPE cloud_cost_total gauge"
              echo "# HELP cloud_cost_net_cost Net cloud cost from OpenCost"
              echo "# TYPE cloud_cost_net_cost gauge"
              
              # Get OpenCost data
              DATA=$(curl -s "http://opencost-atx-sgprod.tf-atx-opencost.svc:9003/cloudCosts?window=2d")
              
              # Process each cloud cost item
              echo "$DATA" | jq -r '.data.sets[0].cloudCosts | to_entries[] | 
                "\(.value.properties.service) \(.value.properties.accountID) \(.value.properties.category) \(.value.properties.regionID // "unknown") \(.value.listCost.cost) \(.value.netCost.cost)"' | \
              while read service account category region list_cost net_cost; do
                echo "cloud_cost_total{service=\"$service\",account=\"$account\",category=\"$category\",region=\"$region\"} $list_cost"
                echo "cloud_cost_net_cost{service=\"$service\",account=\"$account\",category=\"$category\",region=\"$region\"} $net_cost"
              done
            }
            
            # Start HTTP server
            while true; do
              generate_metrics | nc -l -p 8080 -q 1
            done
        ports:
        - containerPort: 8080