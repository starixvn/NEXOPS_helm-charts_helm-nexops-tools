apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-costs-exporter
  namespace: tf-atx-opencost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-costs-exporter
  template:
    metadata:
      labels:
        app: cloud-costs-exporter
    spec:
      containers:
      - name: exporter
        image: python:3.9-alpine
        command: ["/bin/sh"]
        args:
          - -c
          - |
            pip install requests prometheus_client
            cat > /app.py << 'EOF'
import time
import requests
from prometheus_client import start_http_server, Gauge

URL = "http://opencost-atx-sgprod.tf-atx-opencost.svc:9003/cloudCost?window=2d"
cost_gauge = Gauge('opencost_cloud_cost_total_usd', 'Total Cloud Cost in USD')

def fetch_cost():
    try:
        r = requests.get(URL, timeout=10)
        r.raise_for_status()
        data = r.json()
        total = data.get('totalCost', 0)
        cost_gauge.set(total)
    except Exception as e:
        print(f"Error: {e}")

if __name__ == "__main__":
    start_http_server(8080)  # expose /metrics
    while True:
        fetch_cost()
        time.sleep(300)
EOF
            python /app.py
        ports:
        - containerPort: 8080
