apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-costs-exporter
  namespace: tf-atx-opencost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-costs-exporter
  template:
    metadata:
      labels:
        app: cloud-costs-exporter
    spec:
      containers:
      - name: exporter
        image: alpine:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            # Install dependencies
            apk add --no-cache curl jq netcat-openbsd
            echo "Cloud Costs Exporter started on port 8080"
            
            # Function để debug API response
            generate_metrics() {
              echo "HTTP/1.1 200 OK"
              echo "Content-Type: text/plain; version=0.0.4"
              echo "Connection: close"
              echo ""
              
              echo "# DEBUG: Testing OpenCost API response"
              
              # Test API response
              RESPONSE=$(curl -s "http://opencost-atx-sgprod.tf-atx-opencost.svc:9003/cloudCosts?window=2d")
              echo "# DEBUG: Response code: $(echo "$RESPONSE" | jq -r '.code // "unknown"')"
              echo "# DEBUG: Response keys: $(echo "$RESPONSE" | jq 'keys')"
              
              # Kiểm tra cấu trúc data
              if echo "$RESPONSE" | jq -e '.data' > /dev/null 2>&1; then
                echo "# DEBUG: Data exists, checking structure..."
                echo "$RESPONSE" | jq -e '.data.sets' > /dev/null 2>&1 && echo "# DEBUG: Has .data.sets" || echo "# DEBUG: No .data.sets"
                echo "$RESPONSE" | jq -e '.data.sets[0]' > /dev/null 2>&1 && echo "# DEBUG: Has .data.sets[0]" || echo "# DEBUG: No .data.sets[0]"
                echo "$RESPONSE" | jq -e '.data.sets[0].cloudCosts' > /dev/null 2>&1 && echo "# DEBUG: Has .data.sets[0].cloudCosts" || echo "# DEBUG: No .data.sets[0].cloudCosts"
                
                # Thử extract một vài metrics nếu có data
                if echo "$RESPONSE" | jq -e '.data.sets[0].cloudCosts' > /dev/null 2>&1; then
                  echo "# HELP cloud_cost_test Test metric"
                  echo "# TYPE cloud_cost_test gauge"
                  echo "$RESPONSE" | jq -r '.data.sets[0].cloudCosts | to_entries[0] | .value | "cloud_cost_test{service=\"\(.properties.service)\"} \(.listCost.cost)"'
                else
                  echo "# DEBUG: No cloudCosts found"
                fi
              else
                echo "# DEBUG: No data field in response"
                echo "# DEBUG: Full response:"
                echo "$RESPONSE" | head -5
              fi
            }
            
            # Start HTTP server
            while true; do
              generate_metrics | nc -l -p 8080 -q 1
            done
        ports:
        - containerPort: 8080