apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-costs-exporter-script
  namespace: tf-atx-opencost
data:
  app.py: |
    import time
    import requests
    from prometheus_client import start_http_server, Gauge

    URL = "http://opencost-atx-sgprod.tf-atx-opencost.svc:9003/cloudCost?window=3d"

    cost_gauge = Gauge(
        'kubecost_cloud_cost_aws',
        'Cloud cost by resource',
        ['provider', 'service', 'environment', 'dept', 'region', 'team']
    )

    def fetch_cost():
        try:
            r = requests.get(URL, timeout=15)
            r.raise_for_status()
            data = r.json()
            cost_gauge.clear()  # reset trước mỗi lần scrape

            sets = data.get('data', {}).get('sets', [])
            for s in sets:
                cloud_costs = s.get('cloudCosts', {})
                for _, item in cloud_costs.items():
                    props = item.get('properties', {})
                    labels = props.get('labels', {}) or {}

                    provider = props.get('provider', 'unknown')
                    service = props.get('service', 'unknown')
                    environment = labels.get('environment', 'unknown')
                    dept = labels.get('dept', 'unknown')
                    region = labels.get('region', props.get('regionID', 'unknown'))
                    team = labels.get('team', 'unknown')

                    cost_val = (
                        item.get('netCost', {}).get('cost')
                        or item.get('netCost', 0.0)
                    )
                    try:
                        cost_val = float(cost_val)
                    except:
                        cost_val = 0.0

                    cost_gauge.labels(
                        provider=provider,
                        service=service,
                        environment=environment,
                        dept=dept,
                        region=region,
                        team=team
                    ).set(cost_val)

            print(f"Fetched {len(sets)} sets of costs.")
        except Exception as e:
            print(f"Error fetching cost: {e}")

    if __name__ == "__main__":
        start_http_server(8080)  # expose endpoint /metrics
        print("Exporter started on :8080/metrics")
        while True:
            fetch_cost()
            time.sleep(300)
