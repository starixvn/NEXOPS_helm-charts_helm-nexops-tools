apiVersion: v1
kind: Namespace
metadata:
  name: trivy-stack
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: trivy-stack
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-server
  namespace: trivy-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-server
  template:
    metadata:
      labels:
        app: redis-server
        name: redis-server
    spec:
      nodeSelector:
        nexops-tools: "yes"
      containers:
      - name: redis-server
        image: redis
        args: ["--appendonly", "yes"]
        ports:
        - name: redis-server
          containerPort: 6379
        volumeMounts:
        - name: lv-storage
          mountPath: /data
        env:
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
      volumes:
      - name: lv-storage
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-server
  namespace: trivy-stack
spec:
  selector:
    app: redis-server
  type: NodePort
  ports:
  - name: redis-port
    protocol: TCP
    port: 6379
    targetPort: 6379
