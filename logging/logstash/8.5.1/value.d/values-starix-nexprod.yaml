logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      http {
        port => 8080
        add_field => { "[@metadata][input-http]" => "" }
      }
      tcp {
        port => 5044
      }
      syslog {
        port => 5045
        type => "syslog"
        tags => ["local"]
      }
      tcp {
        port => 5064
        type => "vault"
        tags => ["local", "starix"]
      }
      tcp {
        port => 5065
        type => "vault"
        tags => ["dev", "starix"]
      }
    }

  vault_filter.conf: |
    filter {
      if [type] == "vault" {
        json {
          source => "message"
        }
        mutate {
          remove_field => ["[event][original]"]
          remove_field => ["[response][data]"]
          rename => {"type" => "vault.type"}
          add_field => {"type" => "vault"}
        }
      }
    }

  dev_filter.conf: |
    filter {
      if "LoginTransaction" in [Tags] {
        useragent {
          source => '[Message][UserAgent]'
        }
      }

      if [Properties][Team] == "Legion" {
        mutate {
          remove_field => ["[Renderings][HttpLog]", "[Properties][HttpLog]" ]
          add_tag => ["legion"]
        }

        if [Properties][RequestPath] == "/" {
          drop {}
        }

        if [Properties][Application] == "DepositAPI" {
          mutate {
            add_tag => ["deposit"]
          }
        }
        if [Properties][Application] == "DepositAPIGateway" {
          mutate {
            add_tag => ["deposit-apigateway"]
          }
        }        
      }
    }


  main_output.conf: |
    output {
      if [type] == "vault" {
        if "local" in [tags] and "starix" in [tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-audit-local-%{+YYYY.MM.dd}"
          }
        }
        else if "dev" in [tags] and "starix" in [tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-audit-dev-%{+YYYY.MM.dd}"
          }
        }
      }

      else if "legion" in [tags] {
        if [Properties][Environment] == "LOCAL" {
          if "deposit" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-deposit-local-%{+YYYY.MM.dd}"
            }
          }
          else if "deposit-apigateway" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-deposit-apigateway-local-%{+YYYY.MM.dd}"
            }            
          }
          else {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-unknown-local-%{+YYYY.MM.dd}"
            }           
          }
        }
      }

      else if "LoginTransaction" in [Tags] {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-wabisabi-login-trans-local-%{+YYYY.MM.dd}"
        }      
      }

      else {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown-%{+YYYY.MM.dd}"
        }        
      }

    }
    


logstashJavaOpts: "-Xmx3g -Xms3g"

resources:
  requests:
    cpu: "100m"
    memory: "4096Mi"
  limits:
    cpu: "1000m"
    memory: "4096Mi"

httpPort: 9600
extraPorts:
  - name: httplog
    containerPort: 8080
  - name: tcp
    containerPort: 5044
  - name: syslog
    containerPort: 5045
  - name: vault-st-local
    containerPort: 5064
  - name: vault-st-dev
    containerPort: 5064

service:
  type: NodePort
  ports:
  - name: httplog
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: tcp
    nodePort: 30504
    port: 5044
    protocol: TCP
    targetPort: 5044
  - name: syslog
    nodePort: 30505
    port: 5045
    protocol: TCP
    targetPort: 5045
  - name: vault-st-local
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: 5064
  - name: vault-st-dev
    nodePort: 30065
    port: 5065
    protocol: TCP
    targetPort: 5065

nodeSelector: 
  nexops-tools: "yes"