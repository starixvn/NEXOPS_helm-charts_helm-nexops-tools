logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {

      http {
        port => 8080
        add_field => { "[@metadata][input-http]" => "" }
      }
      beats {
        port => 5000
      }
      tcp {
        port => 5044
      }

    }

  global_filter.conf: |
    filter {
      if ([host]) {
        mutate {
          rename => {
            "host" => "host.addr"
          }
        }
      }
    }

  vault_filter.conf: |
    filter {
      # if [@metadata][input][tcp][source] and ![host] {
      #   mutate {
      #     copy => {
      #       "[@metadata][input][tcp][source][name]" => "[host][name]"
      #       "[@metadata][input][tcp][source][ip]"   => "[host][ip]"
      #     }
      #   }
      # }

      if [host][addr] =~ /vault/ {
        json {
          source => "message"
        }
        mutate {
          add_tag => ["vault-server"]
          remove_field => ["[event][original]"]
        }
      }

      if "LoginTransaction" in [Tags] {
        useragent {
          source => '[Message][UserAgent]'
        }
      }

      if [Properties][Team] == "Legion" {
        mutate {
          remove_field => ["[Renderings][HttpLog]", "[Properties][HttpLog]" ]
          add_tag => ["legion"]
        }

        if [Properties][RequestPath] == "/" {
          drop {}
        }

        if [Properties][Application] == "DepositAPI" {
          mutate {
            add_tag => ["deposit"]
          }
        }
        if [Properties][Application] == "DepositAPIGateway" {
          mutate {
            add_tag => ["deposit-apigateway"]
          }
        }        
      }
    }


  main_output.conf: |
    output {

      if "vault-server" in [tags] {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-vault-audit-local-%{+YYYY.MM.dd}"
        }         
      }

      else if "legion" in [tags] {
        if [Properties][Enviroment] == "LOCAL" {
          if "deposit" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-deposit-local-%{+YYYY.MM.dd}"
            }
          }
          else if "deposit-apigateway" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-deposit-apigateway-local-%{+YYYY.MM.dd}"
            }            
          }
          else {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-unknown-local-%{+YYYY.MM.dd}"
            }           
          }
        }
      }

      else if "LoginTransaction" in [Tags] {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-wabisabi-login-trans-local-%{+YYYY.MM.dd}"
        }      
      }

      else {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown-%{+YYYY.MM.dd}"
        }        
      }

    }
    


logstashJavaOpts: "-Xmx3g -Xms3g"

resources:
  requests:
    cpu: "100m"
    memory: "4096Mi"
  limits:
    cpu: "1000m"
    memory: "4096Mi"

service:
  type: NodePort