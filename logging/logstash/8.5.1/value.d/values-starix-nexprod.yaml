logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {

      http {
        port => 8080
        add_field => { "[@metadata][input-http]" => "" }
      }
      tcp {
        port => 5044
      }

    }

  vault_filter.conf: |
    filter {

      if [host] =~ /vault-starix-nexprod/ {
        json {
          source => "message"
        }
        mutate {
          add_tag => ["vault-server","nexprod","starix"]
          remove_field => ["[event][original]"]
          remove_field => ["[response][data]"]
        }
      }

      else if [host] =~ /haproxy-ingress-nexprod-kubernetes-ingress.haproxy-ingress.svc.starix.nexprod/ {
        json {
          source => "message"
        }
        mutate {
          add_tag => ["vault-server","dev","starix"]
          remove_field => ["[event][original]"]
          remove_field => ["[response][data]"]
        }
      }

      else if [host] =~ /10.42.0.0/ {
        json {
          source => "message"
        }
        mutate {
          remove_field => ["[event][original]"]
          remove_field => ["[response][data]"]
        }
      }
    }

  dev_filter.conf: |
    filter {
      if "LoginTransaction" in [Tags] {
        useragent {
          source => '[Message][UserAgent]'
        }
      }

      if [Properties][Team] == "Legion" {
        mutate {
          remove_field => ["[Renderings][HttpLog]", "[Properties][HttpLog]" ]
          add_tag => ["legion"]
        }

        if [Properties][RequestPath] == "/" {
          drop {}
        }

        if [Properties][Application] == "DepositAPI" {
          mutate {
            add_tag => ["deposit"]
          }
        }
        if [Properties][Application] == "DepositAPIGateway" {
          mutate {
            add_tag => ["deposit-apigateway"]
          }
        }        
      }
    }


  main_output.conf: |
    output {

      if "vault-server" in [tags] and "nexprod" in [tags] and "starix" in [tags] {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-vault-audit-local-%{+YYYY.MM.dd}"
        }         
      }

      else if "vault-server" in [tags] and "dev" in [tags] and "starix" in [tags] {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-vault-audit-dev-%{+YYYY.MM.dd}"
        }         
      }

      else if "legion" in [tags] {
        if [Properties][Environment] == "LOCAL" {
          if "deposit" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-deposit-local-%{+YYYY.MM.dd}"
            }
          }
          else if "deposit-apigateway" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-deposit-apigateway-local-%{+YYYY.MM.dd}"
            }            
          }
          else {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-legion-unknown-local-%{+YYYY.MM.dd}"
            }           
          }
        }
      }

      else if "LoginTransaction" in [Tags] {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-wabisabi-login-trans-local-%{+YYYY.MM.dd}"
        }      
      }

      else {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown-%{+YYYY.MM.dd}"
        }        
      }

    }
    


logstashJavaOpts: "-Xmx3g -Xms3g"

resources:
  requests:
    cpu: "100m"
    memory: "4096Mi"
  limits:
    cpu: "1000m"
    memory: "4096Mi"

httpPort: 9600
extraPorts:
  - name: httplog
    containerPort: 8080
  - name: tcp
    containerPort: 5044
  - name: syslog
    containerPort: 5045
  - name: vault-st-local
    containerPort: 5064

service:
  type: NodePort
  ports:
  - name: httplog
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: tcp
    nodePort: 30504
    port: 5044
    protocol: TCP
    targetPort: 5044
  - name: syslog
    nodePort: 30505
    port: 5045
    protocol: TCP
    targetPort: 5045
  - name: vault-st-local
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: 5064

nodeSelector: 
  nexops-tools: "yes"