logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {

      http {
        port => 8080
        add_field => { "[@metadata][input-http]" => "" }
      }
      beats {
        port => 5000
      }
      tcp {
        port => 5044
        tags => ["logstash-testlab"]
      }

    }

  # global_filter.conf: |
  #   filter {
  #     if ([host]) {
  #       mutate {
  #         rename => {"host" => "[host]"}
  #       }
  #     }
  #   }

  vault_filter.conf: |
    filter {
      # if [@metadata][input][tcp][source] and ![host] {
      #   mutate {
      #     copy => {
      #       "[@metadata][input][tcp][source][name]" => "[host][name]"
      #       "[@metadata][input][tcp][source][ip]"   => "[host][ip]"
      #     }
      #   }
      # }

      if [host] =~ /vault-nexprod/ {
        json {
          source => "message"
        }
        mutate {
          add_tag => ["vault-server","nexprod","starix"]
          remove_field => ["[event][original]"]
          remove_field => ["[response][data]"]
        }
      }
    }

  main_output.conf: |
    output {
      if "vault-server" in [tags] and "nexprod" in [tags] and "starix" in [tags] {
        opensearch {
          hosts => ["https://10.18.200.192:30200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-vault-audit-local-%{+YYYY.MM.dd}"
        }         
      }

      else if "vault-server" in [tags] and "dev" in [tags] and "starix" in [tags] {
        opensearch {
          hosts => ["https://10.18.200.192:30200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-vault-audit-dev-%{+YYYY.MM.dd}"
        }         
      }

      else {
        opensearch {
          hosts => ["https://10.18.200.192:30200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown-%{+YYYY.MM.dd}"
        }        
      }

    }
    


logstashJavaOpts: "-Xmx3g -Xms3g"

resources:
  requests:
    cpu: "100m"
    memory: "2Gi"
  limits:
    cpu: "1000m"
    memory: "3Gi"

service:
  type: NodePort