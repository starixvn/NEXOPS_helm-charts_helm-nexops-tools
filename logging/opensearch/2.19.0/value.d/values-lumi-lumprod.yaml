---
singleNode: true

# clusterName: "opensearch-cluster"
# nodeGroup: "lumi"
# masterService: "opensearch-cluster-lumi"

extraEnvs:
- name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  value: Y8cY3sn7hCwSmJLff2U7fkNG

opensearchJavaOpts: "-Xmx6G -Xms6G"

persistence:
  size: 70Gi

service:
  type: NodePort
  nodePort: "30920"

resources:
  requests:
    cpu: "2"
    memory: "5Gi"

extraObjects:
- apiVersion: "ingress.v1.haproxy.org/v1"
  kind: TCP
  metadata:
    name: {{ printf "%s-tcp" (template "opensearch.serviceName" .) }}
    labels: {{- include "opensearch.labels" . | nindent 4 }}
      app.kubernetes.io/component: node
    annotations:
      ingress.class: {{ .Values.sentinel.service.tcpIngressMaster.ingressClass }}
  spec:
    - name: {{ template "opensearch.serviceName" . }}
      frontend:
        name: {{ printf "%s-tcp" (template "opensearch.serviceName" .) }}
        tcplog: true
        binds:
        - name: {{ template "opensearch.serviceName" . }}
          port: {{ .Values.transportPort }}
      service:
        name: {{ template "opensearch.serviceName" . }}
        port: {{ .Values.transportPort }}