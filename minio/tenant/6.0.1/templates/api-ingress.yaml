{{- $pathType := .Values.ingress.api.pathType -}}
{{- $requestAutoCert := .Values.tenant.certificate.requestAutoCert -}}
{{- $externalCertSecret := .Values.tenant.certificate.externalCertSecret -}}
{{- if .Values.ingress.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.tenant.name }}
  {{- with .Values.ingress.api.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.ingress.api.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.api.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.api.tls }}
  tls:
    {{- range .Values.ingress.api.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.api.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range (.paths | default (list "/")) }}
          - path: {{ . }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: minio
                port:
                  {{- if or $requestAutoCert (not (empty $externalCertSecret)) }}
                  name: https-minio
                  {{- else }}
                  name: http-minio
                  {{- end }}
        {{- end }}
  {{- end }}
    {{- if .Values.tenant.features.bucketDNS }}
    - host: "*.{{ .Values.ingress.api.host }}"
      http:
        paths:
          - path: {{ .Values.ingress.api.path }}
            pathType: {{ .Values.ingress.api.pathType }}
            backend:
              service:
                name: minio
                port:
                  {{- if or .Values.tenant.certificate.requestAutoCert (not (empty .Values.tenant.certificate.externalCertSecret)) }}
                  name: https-minio
                  {{- else }}
                  name: http-minio
                  {{- end }}
    {{- end }}
{{- end }}
