---
secrets:
  name: nexops-env-configuration
  accessKey: nexops
  secretKey: Ilu@n3xc3l12

tenant:
  name: nexops

  configuration:
    name: nexops-env-configuration

  buckets:
  - name: backups
  - name: lumi-backup
  - name: starix-backup
  - name: longhorn-lumprod
  - name: vault-backup


  ###
  # Array of Kubernetes secrets from which the Operator generates MinIO users during tenant provisioning.
  #
  # Each secret should specify the ``CONSOLE_ACCESS_KEY`` and ``CONSOLE_SECRET_KEY`` as the access key and secret key for that user.
  users: [ ]

  features:
    bucketDNS: false
    domains: { }
    enableSFTP: false

  pools:
  - name: pool-0
    servers: 3
    volumesPerServer: 2
    size: 98Gi
    storageClassName: directpv-min-io
    storageAnnotations: { }
    annotations: { }
    tolerations:
    - key: cattle.io/os
      operator: "Equal"
      value: minio
      effect: "NoSchedule"
    nodeSelector:
      node-role.kubernetes.io/minio: "yes"
    affinity: { }

  mountPath: /minio

  metrics:
    enabled: true
    port: 9000
    protocol: http
  prometheusOperator: true

  certificate:
    requestAutoCert: false

  env:
  - name: MINIO_PROMETHEUS_URL
    value: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc:9090"
  
  ###
  # PriorityClassName indicates the Pod priority and hence importance of a Pod relative to other Pods.
  # This is applied to MinIO pods only.
  # Refer Kubernetes documentation for details https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass/
  priorityClassName: ""

ingress:
  api:
    enabled: false
    ingressClassName: "haproxy"
    annotations:
      haproxy.org/ssl-redirect: "false"
      # haproxy.org/server-ssl: "true"
      # cert-manager.io/cluster-issuer: letsencrypt-lumprod
    # tls:
    # - secretName: certmanager.minio-api.starixsoft.com 
    #   hosts:
    #   - minio-api.starixsoft.com
    hosts:
    - host: "minio-lumprod-api.lumigame.com"
      paths: []
    - host: "minio-api.starixsoft.com"
      paths: []
    - host: "minio-api.lumiplus.vn"
      paths: []
    tls:
    - hosts:
      - minio-api.starixsoft.com
    pathType: Prefix
  console:
    enabled: false
    ingressClassName: "haproxy"
    annotations:
      haproxy.org/ssl-redirect: "true"
      # haproxy.org/server-ssl: "true"
    #   haproxy.org/backend-config-snippet: |
    #     compression type text/html text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon image/bmp
    #     compression algo gzip
    hosts:
    - host: "minio-lumprod.lumigame.com"
      paths: []
    pathType: Prefix

