apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-backup-env
data:
  backup.sh: |
    #!/bin/sh
    set -e

    BACKUP_DIR="/tmp/etcd-backup/$(date +etcd-backup-%FT%T%:z)"
    mkdir -p "${BACKUP_DIR}"

    echo "==> Starting etcd backup..."
    echo "==> Using endpoints: ${ETCDCTL_ENDPOINTS}"

    ETCDCTL_API="${ETCDCTL_API:-3}" etcdctl snapshot save "${BACKUP_DIR}/snapshot.db"
    echo "==> Backup completed successfully at ${BACKUP_DIR}"