{{- if .Values.pgadmin.persistentVolume.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-pgadmin-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pgadmin.persistentVolume.size }}
  {{- if .Values.pgadmin.persistentVolume.storageClass }}
  storageClassName: {{ .Values.pgadmin.persistentVolume.storageClass }}
  {{- end }}
{{- end }}
