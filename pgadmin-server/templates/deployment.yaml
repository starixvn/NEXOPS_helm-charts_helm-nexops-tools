apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pgadmin
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-pgadmin
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 5050:5050 /var/lib/pgadmin
        image: hub.nexdev.net/base/busybox:1.37.0
        imagePullPolicy: Always
        name: volume-permission
        volumeMounts:
        - mountPath: /var/lib/pgadmin
          name: pgadmin-data
      containers:
        - name: pgadmin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: {{ .Values.pgadmin.email | quote }}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-pgadmin-secret
                  key: password
            - name: PGADMIN_LISTEN_ADDRESS
              value: "0.0.0.0"
            {{- if .Values.pgadmin.ldap.enabled }}
            - name: PGADMIN_CONFIG_AUTHENTICATION_SOURCES
              value: '["ldap", "internal"]' 
            - name: PGADMIN_CONFIG_LDAP_SERVER_URI
              value: {{ .Values.pgadmin.ldap.serverUri | quote }}
            - name: PGADMIN_CONFIG_LDAP_BIND_USER
              value: {{ .Values.pgadmin.ldap.bindDn | quote }}
            - name: PGADMIN_CONFIG_LDAP_BIND_PASSWORD
              value: {{ .Values.pgadmin.ldap.bindPassword | quote }}
            - name: PGADMIN_CONFIG_LDAP_BASE_DN
              value: {{ .Values.pgadmin.ldap.baseDn | quote }}
            - name: PGADMIN_CONFIG_LDAP_USERNAME_ATTRIBUTE
              value: {{ .Values.pgadmin.ldap.usernameAttribute | quote }}
            - name: PGADMIN_CONFIG_LDAP_SEARCH_FILTER
              value: {{ .Values.pgadmin.ldap.searchFilter | quote }}
            - name: PGADMIN_CONFIG_LDAP_SEARCH_DOMAIN
              value: {{ .Values.pgadmin.ldap.searchDomain | quote }}
            {{- end }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: pgadmin-data
          {{- if .Values.pgadmin.persistentVolume.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pgadmin-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
