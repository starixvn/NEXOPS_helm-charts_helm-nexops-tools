    enabled: false

image:
  registry: "hub.lumigame.com"
  repository: "base/openproject/openproject"
  tag: "15.2.0-slim"
  imagePullPolicy: "Always"


nodeSelector:
  openproject: "yes"

memcached:
  clusterDomain: lumi.lumprod
  image:
    registry: hub.lumigame.com
    repository: base/memcached
    tag: 1.6.24-debian-12-r0
