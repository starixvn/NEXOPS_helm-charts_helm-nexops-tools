

imageDocker: hub.nexdev.net/base/docker:24.0.4-bash-jq-jinja

prune:
  nodeSelector: {}
  cronSchedule: "0 3 * * *"
  image:
    until: "168h"
  builder:
    until: "72h"
  volumes:
    enabled: true


manualPruneJob:
  enabled: false
  name: "on-node-1"
  parallelism: 1
  nodeSelector:
    prune: "true"