{{- if .Values.manualPruneJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "docker-prune.fullname" . }}-manual-prune
spec:
  schedule: "{{ .Values.manualPruneJob.schedule }}"
  jobTemplate:
    spec:
      parallelism: {{ .Values.manualPruneJob.parallelism }}
      completions: {{ .Values.manualPruneJob.parallelism }}
      template:
        metadata:
          labels:
            app: {{ include "docker-prune.name" . }}-manual-prune
        spec:
          restartPolicy: Never
          nodeSelector:
            {{- range $key, $val := .Values.manualPruneJob.nodeSelector }}
            {{ $key }}: {{ $val | quote }}
            {{- end }}
          tolerations:
            {{- toYaml .Values.manualPruneJob.tolerations | nindent 12 }}
          containers:
            - name: docker-pruner
              image: {{ .Values.imageDocker }}
              command:
                - /bin/sh
                - -c
                - |
                  echo "[*] Docker cleanup on $(hostname) at $(date)"
                  docker image prune -a --filter "until={{ .Values.prune.image.until }}" -f
                  docker builder prune --all --filter "until={{ .Values.prune.builder.until }}" -f
                  docker system prune -af --volumes
                  echo "[✓] Finished at $(date)"
              volumeMounts:
                - name: docker-sock
                  mountPath: /var/run/docker.sock
                - name: localtime
                  mountPath: /etc/localtime
                  readOnly: true
                - name: timezone
                  mountPath: /etc/timezone
                  readOnly: true
          volumes:
            - name: docker-sock
              hostPath:
                path: /var/run/docker.sock
            - name: localtime
              hostPath:
                path: /etc/localtime
            - name: timezone
              hostPath:
                path: /etc/timezone
{{- end }}
