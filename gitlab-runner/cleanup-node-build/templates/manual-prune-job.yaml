{{- if .Values.manualPruneJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "docker-prune.fullname" . }}-manual-prune-{{ .Values.manualPruneJob.name }}
spec:
  template:
    metadata:
      labels:
        app: {{ include "docker-prune.name" . }}-docker-prune
    spec:
      restartPolicy: Never
      nodeSelector:
        {{- range $key, $val := .Values.manualPruneJob.nodeSelector }}
        {{ $key }}: {{ $val | quote }}
        {{- end }}
      tolerations:
        {{- toYaml .Values.prune.tolerations | nindent 8 }}
      containers:
        - name: docker-pruner
          image: {{ .Values.imageDocker }}
          command: ["/bin/sh", "-c", "/usr/local/bin/prune.sh"]
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: prune-script
              mountPath: /usr/local/bin/prune.sh
              subPath: prune.sh
              readOnly: true
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: timezone
              mountPath: /etc/timezone
              readOnly: true
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: prune-script
          configMap:
            name: {{ include "docker-prune.fullname" . }}-prune-script
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: timezone
          hostPath:
            path: /etc/timezone
{{- end }}