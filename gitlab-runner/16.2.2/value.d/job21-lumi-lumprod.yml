image:
  registry: hub.lumigame.com
  image: base/gitlab-runner
  tag: ubuntu-v16.2.2

replicas: 1

gitlabUrl: https://git21.lumigame.com
runnerRegistrationToken: "glrt-7MzvoopUQeH2ZAeTxjKE"
concurrent: 30

runners:
  config: |
    [[runners]]
      environment = [
        # "FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY=false",
        "DOCKER_HOST=tcp://localhost:2376",
        "DOCKER_TLS_VERIFY=1",
        "DOCKER_TLS_CERTDIR=/certs",
        "DOCKER_CERT_PATH=$DOCKER_TLS_CERTDIR/client",
        "DOCKER_BUILDKIT=1",
        "DOCKER_CLI_EXPERIMENTAL=enabled",
      ]
      pre_build_script = """
      if ! command -v docker &> /dev/null; then
        echo "Docker command could not be found."
      else
        while true; do
            if docker info >/dev/null 2>&1; then
                echo "Docker has started!"
                break
            else
                echo "Waiting for Docker to start..."
                sleep 1
            fi
        done
      fi
      """
      [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "hub.lumigame.com/base/docker:24.0.4-bash-jq-jinja"
        privileged = true
        # cpu_limit = "0.5"
        # memory_limit = "500Mi"
        poll_timeout = 3600
        poll_interval = 5
        # service_cpu_limit = "1"
        # service_memory_limit = "1Gi"
        # helper_cpu_limit = "500m"
        # helper_memory_limit = "100Mi"
      [runners.cache]
        Type = "s3"
        Shared = true
        [runners.cache.s3]
          ServerAddress = "s3-api.lumigame.com"
          BucketName = "gitlab-sc"
          AuthenticationType = "access-key"
      [[runners.kubernetes.services]]
        environment = ["HEALTHCHECK_TCP_PORT=2376"]
        name = "hub.lumigame.com/base/docker:24-dind-alpine"
        command = ["--experimental", "--mtu=1450"]
        alias = "docker"
    [runners.kubernetes.node_selector]
      "node-role.kubernetes.io/runner" = "yes"
    [runners.kubernetes.node_tolerations]
      "cattle.io/os=runner" = "NoSchedule"
      [[runners.kubernetes.volumes.empty_dir]]
        name = "docker-certs"
        mount_path = "/certs/client"
        medium = "Memory"
  cache:
    secretName: s3access

podSecurityContext:
  runAsUser: 999
  fsGroup: 999