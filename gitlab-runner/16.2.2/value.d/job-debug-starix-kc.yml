runners:
  config: |
    [[runners]]
      # environment = [
      #   # "FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY=false",
      #   "DOCKER_HOST=tcp://localhost:2376",
      #   "DOCKER_TLS_VERIFY=1",
      #   "DOCKER_TLS_CERTDIR=/certs",
      #   "DOCKER_CERT_PATH=$DOCKER_TLS_CERTDIR/client",
      #   "DOCKER_BUILDKIT=1",
      #   "DOCKER_CLI_EXPERIMENTAL=enabled",
      # ]
      # pre_build_script = """
      # if ! command -v docker &> /dev/null; then
      #   echo "Docker command could not be found."
      # else
      #   while true; do
      #       if docker info >/dev/null 2>&1; then
      #           echo "Docker has started!"
      #           break
      #       else
      #           echo "Waiting for Docker to start..."
      #           sleep 1
      #       fi
      #   done
      # fi
      # """
      [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "hub.nexdev.net/base/docker:24.0.4-bash-jq-jinja"
        privileged = true
        # memory_request = "1Gi"
        # cpu_limit = "0.5"
        # memory_limit = "500Mi"
        poll_timeout = 3600
        poll_interval = 5
        # service_cpu_limit = "1"
        # service_memory_limit = "1Gi"
        # helper_cpu_limit = "500m"
        # helper_memory_limit = "100Mi"
      [runners.cache]
        Type = "s3"
        Shared = true
        [runners.cache.s3]
          ServerAddress = "s3-api.nexdev.net"
          BucketName = "gitlab-st"
          AuthenticationType = "access-key"
      # [[runners.kubernetes.services]]
      #   environment = ["HEALTHCHECK_TCP_PORT=2376"]
      #   name = "hub.nexdev.net/base/docker:24.0.4"
      #   command = ["--experimental", "--mtu=1450"]
      #   alias = "docker"
    [runners.kubernetes.node_selector]
      "node-role.kubernetes.io/runner-build" = "yes"
    [runners.kubernetes.node_tolerations]
      "cattle.io/os=runner-build" = "NoSchedule"
      # [[runners.kubernetes.volumes.empty_dir]]
      #   name = "docker-certs"
      #   mount_path = "/certs/client"
      #   medium = "Memory"
      # [[runners.kubernetes.volumes.host_path]]
      #   name = "docker-data"
      #   mount_path = "/var/lib/docker"
      #   host_path = "/tmp/cache"
      #   read_only = false
      [[runners.kubernetes.volumes.host_path]]
        name = "docker-socket"
        mount_path = "/var/run/docker.sock"
  # tags: "docker,k8s,ci"
  image: "ubuntu:22.04"
  name: "k8s-runner"
  cache:
    secretName: s3access

podSecurityContext:
  runAsUser: 999
  fsGroup: 999