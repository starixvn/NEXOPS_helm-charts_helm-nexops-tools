# values.yaml

# General configuration
jitsi:
  host: "jitsi.nexdev.net"  # Replace with your domain
  publicURL: "https://jitsi.nexdev.net" 
  enableHTTP: false          # Disable HTTP (use HTTPS)
  #tls:
  #  secretName: "jitsi-tls"  # Name of the TLS secret for HTTPS

# Prosody (XMPP server)
prosody:
  enabled: true
  xmpp:
    password: "1234aaAA"  # Set a secure password for XMPP

# Jicofo (Jitsi Conference Focus)
jicofo:
  enabled: true

# JVB (Jitsi Videobridge)
jvb:
  service:
    type: NodePort
  publicIPs:
    - 10.18.200.193
  enabled: true
  useNodeIP: true  # Use the node's IP address for JVB
  # publicIPs:      # Alternatively, specify external IPs manually
  #   - "203.0.113.1"

# Web UI
web:
  enabled: true
  replicaCount: 1

# PostgreSQL (for persistent storage)
#postgresql:
#  enabled: true
#  postgresqlPassword: "your-secure-password"  # Set a secure password for PostgreSQL

# Nginx (for ingress)
#nginx:
#  enabled: true
#  service:
#    type: LoadBalancer  # Use LoadBalancer for external access

ingress:
  enabled: true
  className: "haproxy"
  hosts:
    - host: jitsi.nexdev.net
      paths:
        - path: /
          pathType: ImplementationSpecific