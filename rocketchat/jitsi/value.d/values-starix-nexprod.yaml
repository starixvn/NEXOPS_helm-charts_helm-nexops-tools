# values.yaml

# General configuration
jitsi:
  host: "jitsi.nexdev.net"  # Replace with your domain
  publicURL: "https://jitsi.nexdev.net"  # Replace with your domain
  enableHTTP: false          # Disable HTTP (use HTTPS)
  tls:
    secretName: "jitsi-tls"  # Name of the TLS secret for HTTPS

# Prosody (XMPP server)
prosody:
  enabled: true
  xmpp:
    password: "1234aa"  # Set a secure password for XMPP

# Jicofo (Jitsi Conference Focus)
jicofo:
  enabled: true

# JVB (Jitsi Videobridge)
jvb:
  enabled: true
  useNodeIP: true  # Use the node's IP address for JVB
  # publicIPs:      # Alternatively, specify external IPs manually
  #   - "203.0.113.1"

# Web UI
web:
  enabled: true
  replicaCount: 1
  service:
    type: NodePort  # Use NodePort for web service
    nodePort: 30000  # Optional: Specify a NodePort for web

# Nginx (for HTTPS termination)
# nginx:
#   enabled: true
#   service:
#     type: NodePort  # Use NodePort for nginx service
#     nodePort: 30001  # Optional: Specify a NodePort for nginx

