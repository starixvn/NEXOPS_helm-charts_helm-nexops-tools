# values.yaml

global:
  clusterDomain: starix.nexprod
  nodeSelector:
    chatting-system: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: chatting-system


jitsi:
  host: "jitsi.nexdev.net"  
  publicURL: "https://jitsi.nexdev.net"  
  enableHTTP: false       

tz: Asia/Ho_Chi_Minh


jvb:
  enabled: true
  useNodeIP: true  

# Web UI
web:
  enabled: true
  replicaCount: 1
  image: 
    repository: hub.nexdev.net/base/jitsi/web
  ingress:
    enabled: true
    ingressClassName: "haproxy"
    hosts:
    - host: jitsi.nexdev.net

  nodeSelector:
    chatting-system: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: chatting-system 

prosody:
  image:
    repository: hub.nexdev.net/base/jitsi/prosody
    tag: stable-9909
  nodeSelector:
    chatting-system: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: chatting-system 