global:
  clusterDomain: "lumi.lumprod"

image:
  repository: hub.lumigame.com/base/rocketchat

persistence:
  enabled: true

mongodb:
  image:
    registry: hub.lumigame.com
    repository: base/mongodb
    tag: 6.0.10-debian-11-r8
  clusterDomain: "lumi.lumprod"
  auth:
    rootPassword: "rocketchat"
    passwords:
    - rocketchat
  persistence:
    enabled: true

host: rocketchat.nexentgame.com
ingress:
  enabled: true
  ingressClassName: "haproxy"
  tls:
    - secretName: "nexent-cert"
      hosts:
        - rocketchat.nexentgame.com    
  hosts:
    - host: rocketchat.nexentgame.com
      paths:
        - path: "/"
          pathType: Prefix

nats:
  clusterDomain: "lumi.lumprod"

postgresql:
  clusterDomain: "lumi.lumprod"
  



