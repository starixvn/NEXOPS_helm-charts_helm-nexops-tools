global:
  nodeSelector:
    chatting-system: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: chatting-system

image:
  repository: hub.nexdev.net/base/rocketchat
  tag: 7.4.0

persistence:
  enabled: true
  storageClass: "local-path"
  size: "20Gi"

podAnnotations:
  prometheus.io/port: "9100"
  prometheus.io/path: "/metrics"
  prometheus.io/scrape: "true"

serviceMonitor:
  enabled: true

prometheusScraping:
  enabled: true

mongodb:
  global:
    storageClass: "local-path"
  image:
    registry: hub.nexdev.net
    repository: base/mongodb
    tag: 6.0.10-debian-11-r8
  clusterDomain: "starix.nexprod"
  auth:
    rootPassword: "rocketchat"
    passwords:
    - rocketchat
  persistence:
    enabled: true
  nodeSelector:
    chatting-system: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: chatting-system



host: rocketchat.nexdev.net
ingress:
  enabled: true
  ingressClassName: "haproxy" 
  hosts:
    - host: rocketchat.nexdev.net
      paths:
        - path: "/"
          pathType: Prefix

smtp:
  enabled: true
  username: ""
  password: ""
  host: smtp.nexdev.net
  port: 25
###
