---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-http-2xx
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - https://zabbix.nexdev.net
        - https://portainer.lumigame.com
        - https://dennis-2.nexdev.net
        - https://abc-2.nexdev.net
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-http-connect
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: http_connect
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - https://zabbix.nexdev.net
        - https://portainer.lumigame.com
        - https://dennis-2.nexdev.net
        - https://abc-2.nexdev.net
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-ssl-check
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: ssl_cert
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - zabbix.nexdev.net:443
        - portainer.lumigame.com:443
        - dennis-2.nexdev.net:443
        - abc-2.nexdev.net:443
