---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-http-2xx
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: prometheus-starix-local-ku-blackbox-exporter.monitoring.svc.starix.local:19115
  targets:
    staticConfig:
      static:
        - https://git3.nexdev.net
        - https://portainer.nexdev.net
        - https://dennis1.nexdev.net
        - https://abc-1.nexdev.net
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-http-connect
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: http_connect
  prober:
    url: prometheus-starix-local-ku-blackbox-exporter.monitoring.svc.starix.local:19115
  targets:
    staticConfig:
      static:
        - https://git3.nexdev.net
        - https://portainer.nexdev.net
        - https://dennis-1.nexdev.net
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-ssl-check
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: ssl_cert
  prober:
    url: prometheus-starix-local-ku-blackbox-exporter.monitoring.svc.starix.local:19115
  targets:
    staticConfig:
      static:
        - git3.nexdev.net:443
        - portainer.nexdev.net:443
        - dennis-1.nexdev.net:443
        - abc-1.nexdev.net:443
