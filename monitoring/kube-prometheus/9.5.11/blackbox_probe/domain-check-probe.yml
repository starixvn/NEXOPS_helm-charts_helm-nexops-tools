---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-http-2xx
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - https://hrm.nexdev.net
        - https://dennis-4.nexdev.net
        - https://abc-4.nexdev.net
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-http-connect
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: http_connect
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - https://hrm.nexdev.net
        - https://dennis-5.nexdev.net
        - https://abc-5.nexdev.net
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-ssl-check
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: ssl_cert
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - hrm.nexdev.net:443
        - dennis-5.nexdev.net:443
        - abc-5.nexdev.net:443
