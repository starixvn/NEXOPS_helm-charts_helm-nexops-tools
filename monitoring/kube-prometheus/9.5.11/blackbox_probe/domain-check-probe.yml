apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: multi-check-probe
  namespace: monitoring
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring:9115
  targets:
    staticConfig:
      static:
        - https://gitlab.nexdev.net
        - https://zabbix.nexdev.net