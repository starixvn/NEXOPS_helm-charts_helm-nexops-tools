---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-ssl-check
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: ssl_cert
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - nexdev.net:443
        - dennis-5.nexdev.net:443
        - abc-5.nexdev.net:443
