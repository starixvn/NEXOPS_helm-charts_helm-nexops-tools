---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-http-2xx
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - https://awx.nexdev.net
        - https://dennis-9.nexdev.net
        - https://abc-9.nexdev.net

---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-ssl-check
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: ssl_cert
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
        - awx.nexdev.net:443
        - dennis-9.nexdev.net:443
        - abc-9.nexdev.net:443
