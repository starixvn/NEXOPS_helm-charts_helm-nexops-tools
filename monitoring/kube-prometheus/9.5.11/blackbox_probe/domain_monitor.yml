---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-http-2xx
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
      {{- range .Values.staticDomains }}
        - https://{{ . }}
      {{- end }}


---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: domain-ssl-check
  namespace: monitoring
  labels:
    prometheus: main
spec:
  interval: 60s
  module: ssl_cert
  prober:
    url: prometheus-starix-nexprod-blackbox-exporter.monitoring.svc.starix.nexprod:19115
  targets:
    staticConfig:
      static:
      static:
      {{- range .Values.staticDomains }}
        - {{ . }}:443
      {{- end }}

---
staticDomains:
  - ansible.nexdev.net
  - dennis-10.nexdev.net
  - abc-10.nexdev.net
