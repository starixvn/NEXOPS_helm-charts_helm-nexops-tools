---
clusterDomain: starix.local

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 7d
  retentionSize: "30GB"

  persistence:
    enabled: true
    size: 30Gi


  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "none"

  additionalScrapeConfigs:
    enabled: false
    type: external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList: []
  ##
  additionalScrapeConfigsExternal:
    enabled: false
    name: ""
    key: ""

  #additionalPrometheusRules: []
  additionalPrometheusRules:
    - name: domain.rules
      groups:
        - name: domain.rules
          rules:
            - alert: SSLCertExpirySoon
              expr: |
                probe_ssl_earliest_cert_expiry{job="probe",instance=~"https?://.+"} - time() < 604800
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "SSL certificate for {{ $labels.instance }} will expire in less than 7 days."
                description: "SSL certificate for {{ $labels.instance }} expires soon."

            - alert: HTTPStatusNot200
              expr: |
                probe_success{job="probe",instance=~"https?://.+"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "HTTP probe failed for {{ $labels.instance }}"
                description: "Blackbox probe did not return status code 200 for {{ $labels.instance }}."

kube-state-metrics:
  resourcesPreset: "none"
  # nodeSelector:
  #   nexops-tools: "yes"

alertmanager:
  resourcesPreset: "none"
  enabled: true
  config:
    global:
      resolve_timeout: 15m

    route:
      receiver: 'default-receiver'
      routes:
      - receiver: 'null'
        match_re:
          namespace: "hrm"
      receiver: 'alerts-test'
      group_by: ['alertname', 'cluster', 'namespace', 'pod', 'description']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h

    receivers:
      - name: 'null'
      - name: 'alerts-test'
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: '#alerts-test'
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            text: |
              *Cluster:* `Kubernetes-SC-Local`
              *Summary:* `{{ .CommonLabels.alertname }}`
              *Description:* `{{ .CommonAnnotations.summary }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

      - name: default-receiver

blackboxExporter:
  configuration: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2"]
          valid_status_codes: [200]
          method: GET
          fail_if_ssl: false
          fail_if_not_ssl: false
          tls_config:
            insecure_skip_verify: true
