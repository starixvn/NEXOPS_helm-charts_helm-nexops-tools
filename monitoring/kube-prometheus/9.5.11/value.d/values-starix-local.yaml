---
clusterDomain: starix.local

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 7d
  retentionSize: "30GB"

  persistence:
    enabled: true
    size: 30Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "none"

  # additionalScrapeConfigs:
  #   enabled: false
  #   type: external
  #   external:
  #     # Name of the secret that Prometheus should use for the additional scrape configuration
  #     name: ""
  #     # Name of the key inside the secret to be used for the additional scrape configuration.
  #     key: ""
  #   internal:
  #     jobList: []
  # #
  # additionalScrapeConfigsExternal:
  #   enabled: false
  #   name: ""
  #   key: ""
  # additionalPrometheusRules: []
  additionalPrometheusRules:
    - name: kubernetes.rules
      groups:
        - name: kubernetes.rules
          rules:
            - alert: Node Not Ready
              expr: kube_node_status_condition{condition="Ready", status="false"} == 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Node Not Ready"
                description: "Node {{ $labels.node }} is not ready."

kube-state-metrics:
  resourcesPreset: "none"
  # nodeSelector:
  #   nexops-tools: "yes"

alertmanager:
  resourcesPreset: "none"
  enabled: true
  config:
    global:
      resolve_timeout: 15m

    route:
      receiver: "default-receiver"
      routes:
        - receiver: "null"
          match_re:
            namespace: "hrm"
        - receiver: "alerts-test"
          match_re:
            namespace: "monitoring"
      group_by: ["alertname", "cluster", "namespace", "pod", "description"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h

    receivers:
      - name: "null"
      - name: "alerts-test"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#alerts-test"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            text: |
              *Domain:* `{{ .CommonLabels.instance }}`
              *Alert:* `{{ .CommonLabels.alertname }}`
              *Status:* `{{ .Status | toUpper }}`
              *Summary:* `{{ .CommonAnnotations.summary }}`
              *Description:* `{{ .CommonAnnotations.description }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

      - name: default-receiver

blackboxExporter:
  configuration: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_http_versions: [ "HTTP/1.1", "HTTP/2" ]
          valid_status_codes: [200]
          fail_if_ssl: false
          fail_if_not_ssl: false
          preferred_ip_protocol: "ip4"

      http_connect:
        prober: http
        timeout: 5s
        http:
          method: GET

      ssl_cert:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: "ip4"
          tls: true
