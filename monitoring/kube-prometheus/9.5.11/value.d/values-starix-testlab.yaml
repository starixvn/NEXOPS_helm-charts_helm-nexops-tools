---
clusterDomain: testlab.local

operator:
  enabled: true

prometheus:
  service:
    nodePorts:
      http: "30062"

  retention: 3d
  retentionSize: "4GB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 5Gi

  additionalScrapeConfigs:
    enabled: false
    type: external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList: []
  ##

exporters:
  node-exporter:
    enabled: false
  kube-state-metrics:
    enabled: false

alertmanager:
  enabled: false