---
clusterDomain: starix.nexprod

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 7d
  retentionSize: "100GB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 100Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "2xlarge"

  additionalScrapeConfigs:
    # - job_name: 'gitlab-ci-pipelines-exporter'
    #   scrape_interval: 10s
    #   scrape_timeout: 5s
    #   static_configs:
    #     - targets: ['nexpe-gitlab-ci-pipelines-exporter-nexprod-service:8080']
    enabled: true
    type: internal #external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList:
        - job_name: "n8n_gcp_metrics"
          metrics_path: "/webhook/gcp-metrics"
          scrape_interval: 10s
          scrape_timeout: 5s
          scheme: "https"
          static_configs:
            - targets: ["n8n.nexdev.net"]
  ##

  #additionalPrometheusRules: []

node-exporter:
  extraVolumes:
    - hostPath:
        path: /var/lib
        type: ""
      name: mnt

  extraVolumeMounts:
    - mountPath: /host/root/var/lib
      mountPropagation: HostToContainer
      name: mnt
      readOnly: true

  extraArgs:
    path.rootfs: "/host/root"
    collector.filesystem.mount-points-exclude: "^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    collector.filesystem.fs-types-exclude: "^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs|squashfs|nsfs|tmpfs)$"

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 15m

    route:
      receiver: default-receiver
      routes:
        - receiver: "null"
          match_re:
            namespace: "gitlab-runner|defectdojo-starix|zabbix-proxy-nexprod|cert-manager|trivy-operator-starix|sample"
        - receiver: "null"
          match_re:
            pod: "scan-vulnerabilityreport-.*|c-.*|.*-rollover-.*|.*-cleaner-.*|.*-cleanup-.*|.*-nodesclean-.*|.*-snapshot-.*|.*-zabbix-server-.*|.*packagebuider.*"
        - receiver: "nexpe-services-alert"
          match_re:
            namespace: "nexpe|gosql|tw|nexops"
        - receiver: "kubernetes_nexprod_lumprod"
          match_re:
            service: "prometheus-starix-nexprod-kube-state-metrics|prometheus-starix-nexprod-node-exporter"
        - receiver: "longhorn_alerts"
          match:
            service: "Longhorn"
          group_by: ["alertname", "job", "pvc"]
        - receiver: "velero_alerts"
          match:
            service: ".*velero.*"
        - receiver: "alerts-test"
          match_re:
            namespace: "monitoring"
      group_by: ["alertname", "job", "pod", "description"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h

    receivers:
      - name: "null"
      - name: "longhorn_alerts"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#longhorn_alerts"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }}🔥 PROBLEM 🔥 {{ .CommonLabels.alertname }}{{ else }}✅ RESOLVED ✅ {{ .CommonLabels.alertname }}{{ end }}'
            text: |
              *Cluster:* `Kubernetes-NexProd`
              *Severity:* `{{ .CommonLabels.severity }}`{{ if .CommonLabels.pvc }}
              *PVC:* `{{ .CommonLabels.pvc }}`{{ end }}{{ if .CommonLabels.pvc_namespace }}
              *Namespace:* `{{ .CommonLabels.pvc_namespace }}`{{ end }}{{ if .CommonAnnotations.description }}
              *Description:* `{{ .CommonAnnotations.description }}`{{ end }}

      - name: "kubernetes_nexprod_lumprod"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#kubernetes_nexprod_lumprod"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            text: |
              *Cluster:* `Kubernetes-NexProd`
              *Summary:* `{{ .CommonLabels.alertname }}`
              *Description:* `{{ .CommonAnnotations.description }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

      - name: "nexpe-services-alert"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#nexpe-services-alert"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            text: |
              *Cluster:* `Kubernetes-NexProd`
              *Summary:* `{{ .CommonLabels.alertname }}`
              *Description:* `{{ .CommonAnnotations.description }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

      - name: "velero_alerts"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#velero_alerts"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }}🔥 PROBLEM 🔥 {{ .CommonLabels.alertname }}{{ else }}✅ RESOLVED ✅ {{ .CommonLabels.alertname }}{{ end }}'
            text: |
              *Cluster:* `Kubernetes-NexProd`
              🚨 *{{ .CommonLabels.alertname }}* ({{ .Status | toUpper }})
              🔁 Schedule: `{{ .CommonLabels.schedule }}`
              ❗ Severity: `{{ .CommonLabels.severity }}`
              📝 {{ .CommonAnnotations.description }}

      - name: "alerts-test"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#alerts-test"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            color: >-
              {{ if eq .Status "firing" }}
                {{ if eq .CommonLabels.severity "critical" }}#FF0000
                {{ else if eq .CommonLabels.severity "warning" }}#FFA500
                {{ else }}#FF4500{{ end }}
              {{ else }}#2ECC71{{ end }}
            text: >
              {{ range .Alerts }}
              *Domain:* `{{ .Labels.instance }}`
              *Alert:* `{{ .Labels.alertname }}`
              *Summary:* `{{ .Annotations.summary }}`
              *Description:* `{{ .Annotations.description }}`
              ---
              {{ end }}

      - name: default-receiver

blackboxExporter:
  configuration: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_http_versions: [ "HTTP/1.1", "HTTP/2" ]
          valid_status_codes: [200]
          fail_if_ssl: false
          fail_if_not_ssl: false
          preferred_ip_protocol: "ip4"

      http_connect:
        prober: http
        timeout: 5s
        http:
          method: GET

      ssl_cert:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: "ip4"
          tls: true
