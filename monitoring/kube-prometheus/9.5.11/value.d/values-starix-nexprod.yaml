---
clusterDomain: starix.nexprod

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 7d
  retentionSize: "100GB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 100Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "2xlarge"

  additionalScrapeConfigs:
    # - job_name: 'gitlab-ci-pipelines-exporter'
    #   scrape_interval: 10s
    #   scrape_timeout: 5s
    #   static_configs:
    #     - targets: ['nexpe-gitlab-ci-pipelines-exporter-nexprod-service:8080']
    enabled: true
    type: internal #external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList:
        - job_name: "gitlab-ci-pipelines-exporter"
          scrape_interval: 10s
          scrape_timeout: 5s
          static_configs:
            - targets:
                [
                  "nexpe-gitlab-ci-pipelines-exporter-nexprod-service.nexpe:8080",
                ]
