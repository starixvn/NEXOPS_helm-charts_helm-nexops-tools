---
clusterDomain: lumi.uat

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 7d
  retentionSize: "18GB"

  persistence:
    enabled: true
    size: 20Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "none"

  additionalScrapeConfigs:
    enabled: false
    type: external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList: []
  ##
  additionalScrapeConfigsExternal:
    enabled: false
    name: ""
    key: ""
  
  additionalPrometheusRules:
  - name: kubernetes.rules
    groups:
    - name: kubernetes.rules
      rules:
      #Node-Level Alerts
      - alert: Node Not Ready
        expr: kube_node_status_condition{condition="Ready", status="false"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Not Ready"
          description: "Node {{ $labels.node }} is not ready."
      
      - alert: High Node CPU Usage
        expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage on Node"
          description: "Node {{ $labels.instance }} is using more than {{ printf \"%.0f\" $value }}% CPU."
      
      - alert: High Node Memory Usage
        expr: (node_memory_Active_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage on Node"
          description: "Node {{ $labels.instance }} is using more than {{ printf \"%.0f\" $value }}% of its memory."

      - alert: High Node Disk Usage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Disk Usage on Node"
          description: "Node {{ $labels.instance }} has more than {{ printf \"%.0f\" $value }}% disk usage."

      - alert: Node Disk Pressure
        expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Disk Pressure"
          description: "Node {{ $labels.node }} is under disk pressure."

      - alert: Node Memory Pressure
        expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Memory Pressure"
          description: "Node {{ $labels.node }} is under memory pressure."

      #Pod-Level Alerts
      # - alert: Pod Crash LoopBackOff
      #   expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
      #   for: 2m
      #   labels:
      #     severity: critical
      #   annotations:
      #     summary: "Pod in CrashLoopBackOff"
      #     description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in CrashLoopBackOff state."

      - alert: Pod Not Running
        expr: kube_pod_status_phase{phase!="Running"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod Not Running"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not running."

      - alert: High Pod CPU Usage
        expr: sum(rate(container_cpu_usage_seconds_total{namespace="default"}[5m])) by (pod) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage in Pod"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using more than {{$value}}% CPU."

      - alert: High Pod Memory Usage
        expr: sum(container_memory_usage_bytes{namespace="default"}) by (pod) > 1e9 # 1GB
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage in Pod"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using more than 1GB of memory."

      - alert: Pod Restarting Frequently
        expr: increase(kube_pod_container_status_restarts_total[5m])  > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod Restarting Frequently"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted more than 3 times in the last 5 minutes."

      #Cluster-Level Alerts
      - alert: API Server Down
        expr: up{job="apiserver"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Server Down"
          description: "The Kubernetes API server is down."
      
      - alert: Etcd Unavailable
        expr: up{job="etcd"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Etcd Unavailable"
          description: "The etcd cluster is unavailable."

      # Resource Quota Alerts
      - alert: Namespace Resource Quota Exceeded
        expr: kube_resourcequota{type="used"} / kube_resourcequota{type="hard"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Namespace Resource Quota Exceeded"
          description: "Namespace {{ $labels.namespace }} is using more than {{$value}}% of its resource quota."

      - alert: ClusterPodsAlmostFull
        expr: (sum(count(kube_pod_info)) / sum(kube_node_status_allocatable_pods)) > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cluster is nearing Pod capacity"
          description: "The total number of Pods in the cluster has exceeded 50% of the maximum limit."

kube-state-metrics:
  resourcesPreset: "none"
  nodeSelector:
    nexops-tools: "yes"

alertmanager:
  resourcesPreset: "none"
  enabled: true
  config:
    global:
      resolve_timeout: 15m
      http_config:
        proxy_url: "http://lisasqd.nebula.prod:8801"

    route:
      receiver: 'kubernetes-alerts-test'
      group_by: ['alertname', 'cluster', 'namespace', 'pod', 'description']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h

    receivers:
      - name: 'kubernetes-alerts-test'
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: '#kubernetes-alerts-test'
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            text: |
              *Severity:* `{{ .CommonLabels.severity }}`
              *Summary:* `{{ .CommonLabels.alertname }}`
              *Cluster:* `Kubernetes-SC-UAT`
              *Description:* `{{ .CommonAnnotations.description }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

node-exporter:
  resourcesPreset: "medium"