---
clusterDomain: lumi.local

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 7d
  retentionSize: "30GB"

  persistence:
    enabled: true
    size: 30Gi


  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "none"

  additionalScrapeConfigs:
    enabled: false
    type: external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList: []
  ##
  additionalScrapeConfigsExternal:
    enabled: false
    name: ""
    key: ""

  additionalPrometheusRules:
    - name: test.rules
      groups:
        - name: test.rules
          rules:
            # Host transmit bandwidth is high (>90%)
            - alert: HostUnusualNetworkThroughputOut
              expr: ((rate(node_network_transmit_bytes_total{device!~"lo|veth.*|docker.*|cbr.*"}[5m]) / on(instance, device) node_network_speed_bytes) * 100)  > 90
              for: 5m
              labels:
                severity: Critical
              annotations:
                summary: Host unusual network throughput out (instance {{ $labels.instance }})
                description: "Host {{ $labels.instance }} interface {{ $labels.device }} transmit bandwidth is high (>90%)\n  Current: {{ $value | humanizePercentage }}\n  Interface: {{ $labels.device }}"
            # Host receive bandwidth is high (>90%)
            - alert: HostUnusualNetworkThroughputIn
              expr: ((rate(node_network_receive_bytes_total{device!~"lo|veth.*|docker.*|cbr.*"}[5m]) / on(instance, device) node_network_speed_bytes) * 100) > 90
              for: 5m
              labels:
                severity: Critical
              annotations:
                summary: Host unusual network throughput in (instance {{ $labels.instance }})
                description: "Host receive bandwidth is high (>90%).\n  VALUE = {{ $value }}%"
            #HAProxy High HTTP 5xx Error Rate
            - alert: HAProxyHighHttp5xxErrorRateWarning
              expr: |
                (
                  sum(rate(haproxy_frontend_http_responses_total{code=~"5.."}[5m])) by (frontend)
                  /
                  sum(rate(haproxy_frontend_http_responses_total[5m])) by (frontend)
                ) * 100 > 1
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "High 5xx error rate on HAProxy frontend {{$labels.frontend}}"
                description: |
                  The HAProxy frontend '{{$labels.frontend}}' is experiencing a high rate of 5xx errors on more than 1% of requests.
                  The current error rate is {{ printf "%.2f" $value}}% and has been sustained for over 15 minutes.	 

            #HAProxy Critical HTTP 5xx Error Rate
            - alert: HAProxyHighHttp5xxErrorRateCritical
              expr: |
                (
                  sum(rate(haproxy_frontend_http_responses_total{code=~"5.."}[5m])) by (frontend)
                  /
                  sum(rate(haproxy_frontend_http_responses_total[5m])) by (frontend)
                ) * 100 > 5
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "High 5xx error rate on HAProxy frontend {{$labels.frontend}}"
                description: |
                  The HAProxy frontend '{{$labels.frontend}}' is experiencing a high rate of 5xx errors on more than 5% of requests.
                  The current error rate is {{ printf "%.2f" $value}}% and has been sustained for over 15 minutes.

            # Disk latency is growing (read operations > 100ms)
            - alert: HostUnusualDiskReadLatencyCritical
              expr: (rate(node_disk_read_time_seconds_total[1m]) / rate(node_disk_reads_completed_total[1m]) > 0.1 and rate(node_disk_reads_completed_total[1m]) > 0)
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: Host unusual disk read latency (instance {{ $labels.instance }})
                description: "Disk latency is growing (read operations > 100ms)\n  VALUE = {{ $value }}"            
            # Disk latency is growing (read operations > 50ms)
            - alert: HostUnusualDiskReadLatencyWarning
              expr: (rate(node_disk_read_time_seconds_total[1m]) / rate(node_disk_reads_completed_total[1m]) > 0.05 and rate(node_disk_reads_completed_total[1m]) > 0)
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: Host unusual disk read latency (instance {{ $labels.instance }})
                description: "Disk latency is growing (read operations > 50ms)\n  VALUE = {{ $value }}"
            #Disk latency is growing (write operations > 100ms)
            - alert: HostUnusualDiskWriteLatencyWarning
              expr: (rate(node_disk_write_time_seconds_total[1m]) / rate(node_disk_writes_completed_total[1m]) > 0.1 and rate(node_disk_writes_completed_total[1m]) > 0)
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: Host unusual disk write latency (instance {{$labels.instance}})
                description: "Disk latency is growing (write operations > 100ms)\n  VALUE = {{$value}}\n  LABELS = {{$labels}}"
            #Disk latency is growing (write operations > 50ms)
            - alert: HostUnusualDiskWriteLatencyCritical
              expr: (rate(node_disk_write_time_seconds_total[1m]) / rate(node_disk_writes_completed_total[1m]) > 0.05 and rate(node_disk_writes_completed_total[1m]) > 0)
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: Host unusual disk write latency (instance {{$labels.instance}})
                description: "Disk latency is growing (write operations > 50ms)\n  VALUE = {{$value}}\n  LABELS = {{$labels}}"
            #Pod missing CPU/Memory limits:
            - alert: PodMissingResourceLimits
              expr: |
                (
                kube_pod_container_resource_limits{resource="cpu"} == 0
                or absent(kube_pod_container_resource_limits{resource="cpu"})
                )
                or
                (
                kube_pod_container_resource_limits{resource="memory"} == 0
                or absent(kube_pod_container_resource_limits{resource="memory"})
                )
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{$labels.pod}} is missing resource limits"
                description: "Container {{$labels.container}} in pod {{$labels.pod}} (namespace: {{$labels.namespace}}) is missing {{$labels.resource}} limits."

            # Warning alert - 75% threshold
            - alert: KubernetesContainerHighMemoryUsageWarning
              expr: |
                (
                  sum(container_memory_working_set_bytes{name!="", container!="POD"}) BY (namespace, pod, container, instance)
                  /
                  sum(container_spec_memory_limit_bytes{container!="POD"} > 0) BY (namespace, pod, container, instance)
                  * 100
                ) > 70
              for: 10m
              labels:
                severity: warning
                component: kubernetes
              annotations:
                summary: "High memory usage in Kubernetes container (Warning)"
                description: |
                  Container {{ $labels.container }} in pod {{ $labels.pod }}
                  (namespace: {{ $labels.namespace }}) on node {{ $labels.instance }}
                  is using {{ $value | printf "%.1f" }}% of its memory limit.
                  Current usage is above 75% threshold.
            # Critical alert - 90% threshold  
            - alert: KubernetesContainerHighMemoryUsageCritical
              expr: |
                (
                  sum(container_memory_working_set_bytes{name!="", container!="POD"}) BY (namespace, pod, container, instance)
                  /
                  sum(container_spec_memory_limit_bytes{container!="POD"} > 0) BY (namespace, pod, container, instance)
                  * 100
                ) > 90
              for: 5m
              labels:
                severity: critical
                component: kubernetes
              annotations:
                summary: "Critical memory usage in Kubernetes container"
                description: |
                  Container {{ $labels.container }} in pod {{ $labels.pod }}
                  (namespace: {{ $labels.namespace }}) on node {{ $labels.instance }}
                  is using {{ $value | printf "%.1f" }}% of its memory limit.
                  CRITICAL: Memory usage is above 90% - immediate action required!
            #CPU usage exceeds 75% of the limit
            - alert: KubernetesContainerHighCPUUsage
              expr: |
                (
                sum(rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m])) BY (namespace, pod, container, instance)
                /
                sum(container_spec_cpu_quota{container!="POD",container!=""} / container_spec_cpu_period{container!="POD",container!=""}) BY (namespace, pod, container, instance)
                * 100
                ) > 75
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Container {{$labels.container}} in pod {{$labels.pod}} has high CPU usage"
                description: "Container {{$labels.container}} in pod {{$labels.pod}} (namespace: {{$labels.namespace}}) on {{$labels.instance}} has been using {{$value | humanize}}% of its CPU limit for more than 10 minutes."
            # CPU usage exceeds 90% of the limit
            - alert: KubernetesContainerCriticalCPUUsage
              expr: |
                (
                sum(rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m])) BY (namespace, pod, container, instance)
                /
                sum(container_spec_cpu_quota{container!="POD",container!=""} / container_spec_cpu_period{container!="POD",container!=""}) BY (namespace, pod, container, instance)
                * 100
                ) > 90
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Container {{$labels.container}} in pod {{$labels.pod}} has high CPU usage"
                description: "Container {{$labels.container}} in pod {{$labels.pod}} (namespace: {{$labels.namespace}}) on {{$labels.instance}} has been using {{$value | humanize}}% of its CPU limit for more than 5 minutes."
            # Warning alert - 80% threshold
            - alert: HostHighDiskIOWait
              expr: |
                (rate(node_disk_io_time_seconds_total{device!~"dm-.*|loop.*|ram.*"}[5m])) > 0.8
              for: 5m
              labels:
                severity: warning
                component: system
              annotations:
                summary: "Host {{$labels.instance}} has high disk I/O wait time"
                description: "Disk {{$labels.device}} on {{$labels.instance}} has been busy for {{ $value | printf \"%.1f\" }}% of time for more than 5 minutes. Monitor closely.\n  VALUE = {{ $value }}"

            # Critical alert - 90% threshold
            - alert: HostCriticalDiskIOWait
              expr: |
                (rate(node_disk_io_time_seconds_total{device!~"dm-.*|loop.*|ram.*"}[5m])) > 0.9
              for: 5m
              labels:
                severity: critical
                component: system
              annotations:
                summary: "Host {{ $labels.instance }} has critical disk I/O wait time"
                description: "CRITICAL: Disk {{ $labels.device }} on {{ $labels.instance }} has been busy for {{ $value | printf \"%.1f\" }}% of time for more than 5 minutes. Immediate investigation required!\n  VALUE = {{ $value }}" 

    - name: kubernetes.rules
      groups:
        - name: kubernetes.rules
          rules:
            - alert: Node Not Ready
              expr: kube_node_status_condition{condition="Ready", status="false"} == 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Node Not Ready"
                description: "Node {{ $labels.node }} is not ready."

            - alert: High Node CPU Usage
              expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High CPU Usage on Node"
                description: 'Node {{ $labels.instance }} is using more than {{ printf "%.0f" $value }}% CPU.'

            - alert: High Node Memory Usage
              expr: (100 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) >= 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High Memory Usage on Node"
                description: 'Node {{ $labels.instance }} is using more than {{ printf "%.0f" $value }}% of its memory.'

            - alert: Node Disk Usage High > 80%
              expr: (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} - node_filesystem_free_bytes{fstype!~"tmpfs|overlay"}) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100 > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High Node Disk Usage"
                description: 'Node {{ $labels.instance }} has more than {{ printf "%.0f" $value }}% disk usage.'

            - alert: Node Disk Usage High > 90%
              expr: (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} - node_filesystem_free_bytes{fstype!~"tmpfs|overlay"}) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100 > 90
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "High Node Disk Usage"
                description: 'Node {{ $labels.instance }} has more than {{ printf "%.0f" $value }}% disk usage.'

            - alert: Node Disk Pressure
              expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Node Disk Pressure"
                description: "Node {{ $labels.node }} is under disk pressure."

            - alert: Pod Not Running
              expr: kube_pod_status_phase{phase!~"Running|Succeeded"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod Not Running"
                description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not running."

            - alert: Pod Restart Detected
              expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.pod }} restarted"
                description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} just restarted!"

            - alert: API Server Down
              expr: up{job="apiserver"} == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "API Server Down"
                description: "The Kubernetes API server is down."

            - alert: Cluster Pod Usage Above 80%
              expr: |
                (sum(kube_pod_info{node=~".*"}) / sum(kube_node_status_allocatable{resource="pods", node=~".*"})) * 100 > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod usage exceeds 80% of total allocatable pods in the cluster"
                description: 'Pod usage is currently {{ printf "%.0f" $value }}% of the total cluster pod capacity.'

    - name: longhorn.rules
      groups:
        - name: longhorn.rules
          rules:
            - alert: LonghornVolumeActualSpaceUsedWarning
              expr: ((longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90) or absent(longhorn_volume_actual_size_bytes)
              for: 5m
              labels:
                severity: warning
                service: Longhorn
              annotations:
                title: "Longhorn: Volume Actual Space Used Warning"
                summary: The actual used space of Longhorn volume is over 90% of the capacity.
                description: The actual space used by Longhorn volume {{$labels.volume}} on {{$labels.node}} is at {{$value | printf "%.2f"}}% capacity for more than 5 minutes.
                template: "automate"

            - alert: LonghornVolumeStatusCritical
              expr: longhorn_volume_robustness == 3
              for: 5m
              labels:
                severity: critical
                service: Longhorn
                issue: Longhorn volume {{$labels.volume}} is Fault.
              annotations:
                title: "Longhorn: Volume Status Critical"
                summary: Longhorn volume {{$labels.volume}} is Fault
                description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Fault for more than 2 minutes.
                template: "automate"

            - alert: LonghornVolumeStatusWarning
              expr: longhorn_volume_robustness == 2
              for: 5m
              labels:
                severity: warning
                service: Longhorn
                issue: Longhorn volume {{$labels.volume}} is Degraded.
              annotations:
                title: "Longhorn: Volume Status Warning"
                summary: Longhorn volume {{$labels.volume}} is Degraded
                description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Degraded for more than 5 minutes.
                template: "automate"

            - alert: LonghornNodeStorageWarning
              expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 80
              for: 5m
              labels:
                severity: warning
                service: Longhorn
                issue: The used storage of node {{$labels.node}} is high.
              annotations:
                title: "Longhorn: Node Storage Warning"
                summary: The used storage of node is over 80% of the capacity.
                description: The used storage of node {{$labels.node}} is at {{$value | printf "%.2f"}}% capacity for more than 5 minutes.
                template: "automate"

            - alert: LonghornDiskStorageWarning
              expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 80
              for: 5m
              labels:
                severity: warning
                service: Longhorn
                issue: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is high.
              annotations:
                title: "Longhorn: Disk Storage Warning"
                summary: The used storage of disk is over 80% of the capacity.
                description: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is at {{$value | printf "%.2f"}}% capacity for more than 5 minutes.
                template: "automate"

            - alert: LonghornNodeDown
              expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
              for: 5m
              labels:
                severity: critical
                service: Longhorn
                issue: There are {{$value}} Longhorn nodes are offline
              annotations:
                title: "Longhorn: Node Down"
                summary: Longhorn nodes is offline
                description: There are {{$value}} Longhorn nodes which have been offline for more than 5 minutes.
                template: "automate"

            - alert: LonghornInstanceManagerCPUUsageWarning
              expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
              for: 5m
              labels:
                severity: warning
                service: Longhorn
                issue: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} consumes 3 times the CPU request.
              annotations:
                title: "Longhorn: Instance Manager CPU Usage Warning"
                summary: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is over 300%.
                description: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is {{$value | printf "%.2f"}}% for more than 5 minutes.
                template: "automate"

            - alert: LonghornNodeCPUUsageWarning
              expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
              for: 5m
              labels:
                severity: warning
                service: Longhorn
                issue: Longhorn node {{$labels.node}} experiences high CPU pressure.
              annotations:
                title: "Longhorn: Node CPU Usage Warning"
                summary: Longhorn node {{$labels.node}} experiences high CPU pressure for more than 5m.
                description: Longhorn node {{$labels.node}} has CPU Usage / CPU capacity is {{$value | printf "%.2f"}}% for more than 5 minutes.
                template: "automate"

    - name: velero.rules
      groups:
        - name: velero.rules
          rules:
            - alert: VeleroBackupPartialFailures
              annotations:
                message: Velero backup {{ $labels.schedule }} has {{ $value | humanizePercentage }} partialy failed backups.
              expr: |-
                velero_backup_partial_failure_total{schedule!=""} / velero_backup_attempt_total{schedule!=""} > 0
              for: 15m
              labels:
                severity: warning
            - alert: VeleroBackupFailures
              annotations:
                message: Velero backup {{ $labels.schedule }} has {{ $value | humanizePercentage }} failed backups.
              expr: |-
                velero_backup_failure_total{schedule!=""} / velero_backup_attempt_total{schedule!=""} > 0
              for: 15m
              labels:
                severity: warning

    - name: runners.metrics
      groups:
        - name: runners.metrics
          rules:
            - expr: sum(gitlab_runner_jobs{job=~".*gitlab-runner.*"}) OR clamp_max(absent(notExists{job=~".*gitlab-runner.*"}),0)
              record: gitlab_runner_jobs_build_total
            - expr: gitlab_runner_jobs_build_total/sum(gitlab_runner_concurrent{job=~".*gitlab-runner.*"})
              record: gitlab_runner_build_total:concurrent_saturation
            - expr: gitlab_runner_jobs/ on(namespace, pod) gitlab_runner_concurrent
              record: gitlab_runner_jobs:concurrent_saturation

    - name: opensearch.rules
      groups:
        - name: opensearch.rules
          rules:
            # Opensearch disk out of space
            - alert: OpensearchDiskOutOfSpace
              expr: opensearch_fs_total_available_bytes / opensearch_fs_total_total_bytes * 100 < 10
              for: 0m
              labels:
                severity: CRITICAL
                service: OpenSearch
              annotations:
                investigate_link: "https://ops-fps.starixplay.com"
                title: "Opensearch: Disk running out of space"
                summary: Opensearch disk out of space (component {{ $labels.job }})
                description: "The disk usage is over 90%"
                template: "automate"

            #  Opensearch Node Offline
            - alert: OpensearchNodeOffline
              expr: max_over_time(opensearch_cluster_nodes_number[5m]) < max_over_time(opensearch_cluster_nodes_number[1d:5m])
              for: 0m
              labels:
                severity: CRITICAL
                service: OpenSearch
              annotations:
                title: "Opensearch: Nodes go Offline"
                summary: Opensearch node goes offline (component {{ $labels.job }})
                description: "Some node go offline!"
                template: "automate"

            # Opensearch Cluster Red
            - alert: OpensearchClusterRed
              expr: opensearch_cluster_status == 2
              for: 0m
              labels:
                severity: CRITICAL
                service: OpenSearch
              annotations:
                title: "Opensearch: Cluster in Red Health"
                summary: Opensearch Cluster Red (component {{ $labels.job }})
                description: "Opensearch Cluster Red status"
                template: "automate"

            # Opensearch Cluster Yellow
            - alert: OpensearchClusterYellow
              expr: opensearch_cluster_status == 1
              for: 0m
              labels:
                severity: WARNING
                service: OpenSearch
              annotations:
                title: "Opensearch: Cluster in Yellow Health"
                summary: Opensearch Cluster Yellow (component {{ $labels.job }})
                description: "Elastic Cluster Yellow status"
                template: "automate"

            #  Opensearch no new documents
            - alert: OpensearchNoNewDocuments
              expr: increase(opensearch_indices_indexing_index_count{job=~".*-hot|opensearch-cluster-master"}[10m]) < 1
              for: 0m
              labels:
                severity: WARNING
                service: OpenSearch
              annotations:
                title: "Opensearch: No new Docs been written"
                summary: Opensearch no new documents (component {{ $labels.job }})
                description: "No new documents for 10 min!"
                template: "automate"

    - name: domain.rules
      groups:
        - name: domain.rules
          rules:
            - alert: SSLCertificateExpiringSoon < 7 days
              expr: 3 <= round((last_over_time(probe_ssl_earliest_cert_expiry[10m]) - time()) / 86400, 0.1) < 7
              for: 24h
              labels:
                severity: warning
              annotations:
                summary: "SSL certificate is expiring soon"
                problem: "The SSL certificate will expire soon (instance {{ $labels.instance }})"
                status: 'Remaining {{ $value | printf "%.0f" }} days.'

            - alert: SSLCertificateExpiringSoon < 1 days
              expr: 0 <= round((last_over_time(probe_ssl_earliest_cert_expiry[10m]) - time()) / 86400, 0.1) < 3
              for: 24h
              labels:
                severity: critical
              annotations:
                summary: "SSL certificate is expiring soon"
                problem: "The SSL certificate will expire soon (instance {{ $labels.instance }})"
                status: 'Remaining {{ $value | printf "%.0f" }} days.'

            - alert: SSLCertificateExpired
              expr: round((last_over_time(probe_ssl_earliest_cert_expiry[10m]) - time()) / 86400, 0.1) < 0
              for: 24h
              labels:
                severity: critical
              annotations:
                summary: "SSL certificate has expired"
                problem: "The SSL certificate expired (instance {{ $labels.instance }})"
                status: 'Remaining {{ $value | printf "%.0f" }} days.'

            # - alert: DomainStatusNot200
            #   expr: (probe_http_status_code <= 199 and probe_http_status_code > 0)  OR (probe_http_status_code >= 400 and probe_http_status_code > 0)
            #   for: 2m
            #   labels:
            #     severity: critical
            #     instance: "{{ $labels.instance }}"
            #   annotations:
            #     summary: "Domain {{ $labels.instance }} is not returning HTTP 200"
            #     problem: "The domain is returning status code {{ $value }} instead of 200."
            #     status: "Code {{ $value }}"

            - alert: DomainHttpConnectFailed
              expr: probe_http_connect_success != 1
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "HTTP connect failed"
                description: "The domain {{ $labels.instance }} failed to establish HTTP connection."

          
kube-state-metrics:
  resourcesPreset: "none"
  nodeSelector:
    nexops-tools: "yes"

alertmanager:
  resourcesPreset: "none"
  enabled: true
  config:
    global:
      resolve_timeout: 15m

    route:
      receiver: default-receiver
      routes:
       - receiver: 'null'
         match_re:
           namespace: "l1|l2|gn|hd|sk|sp|tg|mg"
       - receiver: 'kubernetes_sc_local'
         match_re:
           service: "prometheus-lumi-local-kube-state-metrics|prometheus-lumi-local-node-exporter"
       - receiver: 'kubernetes_sc_local'
         match_re:
           alertname: ".*CPU.*" 
       - receiver: "velero_alerts"
         match:
           service: ".*velero.*"
      group_by: ['alertname', 'cluster', 'namespace', 'pod', 'description']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h

    receivers:
      - name: 'null'
      - name: 'kubernetes_sc_local'
        slack_configs:
