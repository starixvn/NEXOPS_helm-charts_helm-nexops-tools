---
clusterDomain: lumi.lumprod

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 7d
  retentionSize: "100GB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 100Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "2xlarge"

  additionalScrapeConfigs:
    enabled: false
    type: external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList: []
  ##

  additionalPrometheusRules:
  - name: runners.metrics
    rules:
    - expr: sum(gitlab_runner_jobs{job=~".*gitlab-runner.*"}) OR clamp_max(absent(notExists{job=~".*gitlab-runner.*"}),0)
      record: gitlab_runner_jobs_build_total
    - expr: gitlab_runner_jobs_build_total/sum(gitlab_runner_concurrent{job=~".*gitlab-runner.*"})
      record: gitlab_runner_build_total:concurrent_saturation
    - expr: gitlab_runner_jobs/ on(namespace, pod) gitlab_runner_concurrent
      record: gitlab_runner_jobs:concurrent_saturation
  - name: longhorn.rules
    rules:
    - alert: LonghornVolumeActualSpaceUsedWarning
      annotations:
        description: The actual space used by Longhorn volume {{$labels.volume}} on
          {{$labels.node}} is at {{$value}}% capacity for more than 5 minutes.
        summary: The actual used space of Longhorn volume is over 90% of the capacity.
      expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) *
        100 > 90
      for: 5m
      labels:
        issue: The actual used space of Longhorn volume {{$labels.volume}} on {{$labels.node}}
          is high.
        severity: warning
    - alert: LonghornVolumeStatusCritical
      annotations:
        description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Fault
          for more than 2 minutes.
        summary: Longhorn volume {{$labels.volume}} is Fault
      expr: longhorn_volume_robustness == 3
      for: 5m
      labels:
        issue: Longhorn volume {{$labels.volume}} is Fault.
        severity: critical
    - alert: LonghornVolumeStatusWarning
      annotations:
        description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Degraded
          for more than 5 minutes.
        summary: Longhorn volume {{$labels.volume}} is Degraded
      expr: longhorn_volume_robustness == 2
      for: 5m
      labels:
        issue: Longhorn volume {{$labels.volume}} is Degraded.
        severity: warning
    - alert: LonghornNodeStorageWarning
      annotations:
        description: The used storage of node {{$labels.node}} is at {{$value}}% capacity
          for more than 5 minutes.
        summary: The used storage of node is over 70% of the capacity.
      expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes)
        * 100 > 70
      for: 5m
      labels:
        issue: The used storage of node {{$labels.node}} is high.
        severity: warning
    - alert: LonghornDiskStorageWarning
      annotations:
        description: The used storage of disk {{$labels.disk}} on node {{$labels.node}}
          is at {{$value}}% capacity for more than 5 minutes.
        summary: The used storage of disk is over 70% of the capacity.
      expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
      for: 5m
      labels:
        issue: The used storage of disk {{$labels.disk}} on node {{$labels.node}}
          is high.
        severity: warning
    - alert: LonghornNodeDown
      annotations:
        description: There are {{$value}} Longhorn nodes which have been offline for
          more than 5 minutes.
        summary: Longhorn nodes is offline
      expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"}
        == 1) or on() vector(0)) > 0
      for: 5m
      labels:
        issue: There are {{$value}} Longhorn nodes are offline
        severity: critical
    - alert: LonghornInstanceManagerCPUUsageWarning
      annotations:
        description: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}}
          has CPU Usage / CPU request is {{$value}}% for more than 5 minutes.
        summary: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}}
          has CPU Usage / CPU request is over 300%.
      expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu)
        * 100 > 300
      for: 5m
      labels:
        issue: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}}
          consumes 3 times the CPU request.
        severity: warning
    - alert: LonghornNodeCPUUsageWarning
      annotations:
        description: Longhorn node {{$labels.node}} has CPU Usage / CPU capacity is
          {{$value}}% for more than 5 minutes.
        summary: Longhorn node {{$labels.node}} experiences high CPU pressure for
          more than 5m.
      expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu)
        * 100 > 90
      for: 5m
      labels:
        issue: Longhorn node {{$labels.node}} experiences high CPU pressure.
        severity: warning

  - name: kubernetes.rules
    groups:
    - name: kubernetes.rules
      rules:
      #Node-Level Alerts
      - alert: Node Not Ready
        expr: kube_node_status_condition{condition="Ready", status="false"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Not Ready"
          description: "Node {{ $labels.node }} is not ready."

      - alert: High Node CPU Usage
        expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage on Node"
          description: "Node {{ $labels.instance }} is using more than {{ printf \"%.0f\" $value }}% CPU."

      - alert: High Node Memory Usage
        expr: (node_memory_Active_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage on Node"
          description: "Node {{ $labels.instance }} is using more than {{ printf \"%.0f\" $value }}% of its memory."

      - alert: High Node Disk Usage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Disk Usage on Node"
          description: "Node {{ $labels.instance }} has more than {{ printf \"%.0f\" $value }}% disk usage."

      - alert: Node Disk Pressure
        expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Disk Pressure"
          description: "Node {{ $labels.node }} is under disk pressure."

      - alert: Node Memory Pressure
        expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Memory Pressure"
          description: "Node {{ $labels.node }} is under memory pressure."

      #Pod-Level Alerts
      - alert: Pod Not Running
        expr: kube_pod_status_phase{phase!="Running"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod Not Running"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not running."

      - alert: Pod Restart Detected
        expr: increase(kube_pod_container_status_restarts_total[1m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} restarted"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} just restarted!"

      - alert: High Pod CPU Usage
        expr: sum(rate(container_cpu_usage_seconds_total{namespace="default"}[5m])) by (pod) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage in Pod"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using more than {{$value}}% CPU."

      - alert: High Pod Memory Usage
        expr: sum(container_memory_usage_bytes{namespace="default"}) by (pod) > 1e9 # 1GB
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage in Pod"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using more than 1GB of memory."

      - alert: Pod Restarting Frequently
        expr: increase(kube_pod_container_status_restarts_total[5m])  > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod Restarting Frequently"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted more than 3 times in the last 5 minutes."

      #Cluster-Level Alerts
      - alert: API Server Down
        expr: up{job="apiserver"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Server Down"
          description: "The Kubernetes API server is down."

      - alert: Etcd Unavailable
        expr: up{job="etcd"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Etcd Unavailable"
          description: "The etcd cluster is unavailable."

      # Resource Quota Alerts
      - alert: Namespace Resource Quota Exceeded
        expr: kube_resourcequota{type="used"} / kube_resourcequota{type="hard"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Namespace Resource Quota Exceeded"
          description: "Namespace {{ $labels.namespace }} is using more than {{$value}}% of its resource quota."

      - alert: ClusterPodsAlmostFull
        expr: (sum(count(kube_pod_info)) / sum(kube_node_status_allocatable_pods)) > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cluster is nearing Pod capacity"
          description: "The total number of Pods in the cluster has exceeded 50% of the maximum limit."

node-exporter:
  extraVolumes:
  - hostPath:
      path: /var/lib
      type: ""
    name: mnt

  extraVolumeMounts:
  - mountPath: /host/root/var/lib
    mountPropagation: HostToContainer
    name: mnt
    readOnly: true

  extraArgs:
    path.rootfs: "/host/root"
    collector.filesystem.mount-points-exclude: "^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    collector.filesystem.fs-types-exclude: "^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs|squashfs|nsfs|tmpfs)$"

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 15m

    route:
      receiver: default-receiver
      routes:
      #- receiver: 'null'
      #  match_re:
      #    namespace: ""
      - receiver: kubernetes_nexprod_lumprod
        match_re:
          service: "prometheus-lumprod-kube-state-metrics|prometheus-lumprod-node-exporter"
      - receiver: longhorn_alerts
        match:
          service: "longhorn-backend"
        group_by: ['alertname', 'job', 'pvc']
      group_by: ['alertname','job','pod', 'description']
      group_wait: 30s
      group_interval: 9999h
      repeat_interval: 9999h

    receivers:
    #- name: 'null'
    - name: 'longhorn_alerts'
      slack_configs:
        - api_url: "https://hooks.slack.com/services/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"
          channel: '#longhorn_alerts'
          send_resolved: true
          icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
          title: '{{ if eq .Status "firing" }}🔥 PROBLEM 🔥 {{ .CommonLabels.alertname }}{{ else }}✅ RESOLVED ✅ {{ .CommonLabels.alertname }}{{ end }}'
          text: |
            *Severity:* `{{ .CommonLabels.severity }}`
            *Service:* `{{ .CommonLabels.service }}`
            *PVC:* `{{ .CommonLabels.pvc }}`
            *Namespace:* `{{ .CommonLabels.pvc_namespace }}`
            *Description:* `{{ .CommonAnnotations.description }}`

    - name: 'kubernetes-alerts-test'
      slack_configs:
        - api_url: "https://hooks.slack.com/services/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"
          channel: '#kubernetes-alerts-test'
          send_resolved: true
          icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
          title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
          text: |
            *Cluster:* `Kubernetes-LumProd`
            *Summary:* `{{ .CommonLabels.alertname }}`
            *Description:* `{{ .CommonAnnotations.description }}`
          color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

    - name: default-receiver