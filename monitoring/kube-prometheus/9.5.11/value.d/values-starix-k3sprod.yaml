---
clusterDomain: lumi.uat

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 14d
  retentionSize: "95GiB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 100Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "2xlarge"

  additionalScrapeConfigs:
    enabled: true
    type: internal
    internal:
      jobList:
      ###########################################################################
      ### Req from DBA: https://teams.microsoft.com/l/message/19:b042b9fae1704402b7582ace18f21fea@thread.v2/1728025357615?context=%7B%22contextType%22%3A%22chat%22%7D
      ###########################################################################
      - job_name: 's1-db-servers'
        scrape_interval: 5s
        # UAT MongoDB
        static_configs:
        - targets:
          - 'vn-s1-mongodb-uat.nebula.prod:8080'
          labels:
            environment: 'uat'
            db: 'mongodb'
            exporter: 'cadvisor'
        - targets:
          - 'vn-s1-mongodb-uat.nebula.prod:9216'
          labels:
            environment: 'uat'
            db: 'mongodb'
            exporter: 'mongodb_exporter'
        - targets:
          - 'vn-s1-mongodb-uat.nebula.prod:9100'
          labels:
            environment: 'uat'
            db: 'mongodb'
            exporter: 'node_exporter'
        # UAT Postgres
        - targets:
          - 'vn-s1-postgresql-uat.nebula.prod:8080'
          labels:
            environment: 'uat'
            db: 'postgres'
            exporter: 'cadvisor'
        - targets:
          - 'vn-s1-postgresql-uat.nebula.prod:9187'
          labels:
            environment: 'uat'
            db: 'postgres'
            exporter: 'postgres_exporter'
        - targets:
          - 'vn-s1-postgresql-uat.nebula.prod:9100'
          labels:
            environment: 'uat'
            db: 'postgres'
            exporter: 'node_exporter'
        # PROD MongoDB
        - targets:
          - 'vn-s1-mongodb-prod.nebula.prod:8080'
          labels:
            environment: 'production'
            db: 'mongodb'
            exporter: 'cadvisor'
        - targets:
          - 'vn-s1-mongodb-prod.nebula.prod:9216'
          labels:
            environment: 'production'
            db: 'mongodb'
            exporter: 'mongodb_exporter'
        - targets:
          - 'vn-s1-mongodb-prod.nebula.prod:9100'
          labels:
            environment: 'production'
            db: 'mongodb'
            exporter: 'node_exporter'
      ###########################################################################


  additionalPrometheusRules:
  - name: opensearch.rules
    groups:
    - name: opensearch.rules
      rules:
      # Opensearch disk out of space 
      - alert: OpensearchDiskOutOfSpace
        expr: opensearch_fs_total_available_bytes / opensearch_fs_total_total_bytes * 100 < 10
        for: 0m
        labels:
          severity: CRITICAL
          service: OpenSearch
        annotations:
          investigate_link: "https://ops-fps.starixplay.com"
          title: "Opensearch: Disk running out of space"
          summary: Opensearch disk out of space (component {{ $labels.job }})
          description: "The disk usage is over 90%"
          template: "automate"
        
      #  Opensearch Node Offline
      - alert: OpensearchNodeOffline
        expr: max_over_time(opensearch_cluster_nodes_number[5m]) < max_over_time(opensearch_cluster_nodes_number[1d:5m])
        for: 0m
        labels:
          severity: CRITICAL
          service: OpenSearch
        annotations:
          title: "Opensearch: Nodes go Offline"
          summary: Opensearch node goes offline (component {{ $labels.job }})
          description: "Some node go offline!"
          template: "automate"

      # Opensearch Cluster Red 
      - alert: OpensearchClusterRed
        expr: opensearch_cluster_status == 2
        for: 0m
        labels:
          severity: CRITICAL
          service: OpenSearch
        annotations:
          title: "Opensearch: Cluster in Read Health"
          summary: Opensearch Cluster Red (component {{ $labels.job }})
          description: "Opensearch Cluster Red status"
          template: "automate"

      # Opensearch Cluster Yellow 
      - alert: OpensearchClusterYellow
        expr: opensearch_cluster_status == 1
        for: 0m
        labels:
          severity: WARNING
          service: OpenSearch
        annotations:
          title: "Opensearch: Cluster in Yellow Health"
          summary: Opensearch Cluster Yellow (component {{ $labels.job }})
          description: "Elastic Cluster Yellow status"
          template: "automate"

      #  Opensearch no new documents 
      - alert: OpensearchNoNewDocuments
        expr: increase(opensearch_indices_indexing_index_count{job="ops-cluster-nodes-hot"}[10m]) < 1
        for: 0m
        labels:
          severity: WARNING
          service: OpenSearch
        annotations:
          title: "Opensearch: No new Docs been written"
          summary: Opensearch no new documents (component {{ $labels.job }})
          description: "No new documents for 10 min!"
          template: "automate"

  - name: longhorn.rules
    groups:
    - name: longhorn.rules
      rules:
      - alert: LonghornVolumeActualSpaceUsedWarning
        expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: Longhorn
        annotations:
          title: "Longhorn: Volume Actual Space Used Warning"
          summary: The actual used space of Longhorn volume is over 90% of the capacity.
          description: The actual space used by Longhorn volume {{$labels.volume}} on {{$labels.node}} is at {{$value}}% capacity for more than 5 minutes.
          template: "automate"

      - alert: LonghornVolumeStatusCritical
        expr: longhorn_volume_robustness == 3
        for: 5m
        labels:
          severity: critical
          service: Longhorn
          issue: Longhorn volume {{$labels.volume}} is Fault.
        annotations:
          title: "Longhorn: Volume Status Critical"
          summary: Longhorn volume {{$labels.volume}} is Fault
          description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Fault for more than 2 minutes.
          template: "automate"

      - alert: LonghornVolumeStatusWarning
        expr: longhorn_volume_robustness == 2
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: Longhorn volume {{$labels.volume}} is Degraded.
        annotations:
          title: "Longhorn: Volume Status Warning"
          summary: Longhorn volume {{$labels.volume}} is Degraded
          description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Degraded for more than 5 minutes.
          template: "automate"

      - alert: LonghornNodeStorageWarning
        expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 70
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: The used storage of node {{$labels.node}} is high.
        annotations:
          title: "Longhorn: Node Storage Warning"
          summary: The used storage of node is over 70% of the capacity.
          description: The used storage of node {{$labels.node}} is at {{$value}}% capacity for more than 5 minutes.
          template: "automate"

      - alert: LonghornDiskStorageWarning
        expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is high.
        annotations:
          title: "Longhorn: Disk Storage Warning"
          summary: The used storage of disk is over 70% of the capacity.
          description: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is at {{$value}}% capacity for more than 5 minutes.
          template: "automate"

      - alert: LonghornNodeDown
        expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
        for: 5m
        labels:
          severity: critical
          service: Longhorn
          issue: There are {{$value}} Longhorn nodes are offline
        annotations:
          title: "Longhorn: Node Down"
          summary: Longhorn nodes is offline
          description: There are {{$value}} Longhorn nodes which have been offline for more than 5 minutes.
          template: "automate"

      - alert: LonghornInstanceManagerCPUUsageWarning
        expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} consumes 3 times the CPU request.
        annotations:
          title: "Longhorn: Instance Manager CPU Usage Warning"
          summary: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is over 300%.
          description: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is {{$value}}% for more than 5 minutes.
          template: "automate"

      - alert: LonghornNodeCPUUsageWarning
        expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: Longhorn node {{$labels.node}} experiences high CPU pressure.
        annotations:
          title: "Longhorn: Node CPU Usage Warning"
          summary: Longhorn node {{$labels.node}} experiences high CPU pressure for more than 5m.
          description: Longhorn node {{$labels.node}} has CPU Usage / CPU capacity is {{$value}}% for more than 5 minutes.
          template: "automate"


node-exporter:
  extraVolumes:
  - hostPath:
      path: /var/lib
      type: ""
    name: mnt
    
  extraVolumeMounts:
  - mountPath: /host/root/var/lib
    mountPropagation: HostToContainer
    name: mnt
    readOnly: true

  extraArgs:
    path.rootfs: "/host/root"
    collector.filesystem.mount-points-exclude: "^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    collector.filesystem.fs-types-exclude: "^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs|squashfs|nsfs|tmpfs)$"


alertmanager:
  ## @param alertmanager.enabled Deploy Alertmanager to the cluster
  ##
  enabled: true

  config:
    global:
      resolve_timeout: 15m
    receivers:
    - name: devnull
    # - name: prometheus-msteams-warning
    #   webhook_configs:
    #   - send_resolved: true
    #     url: 'http://prometheus-msteams:2000/alertmanager-warning'
    # - name: prometheus-msteams-critical
    #   webhook_configs:
    #   - send_resolved: true
    #     url: 'http://prometheus-msteams:2000/alertmanager-critical' 
    - name: prometheus-msteams-opensearch
      webhook_configs:
      - send_resolved: true
        url: 'http://prometheus-msteams:2000/alertmanager-opensearch' 
    - name: prometheus-msteams-longhorn
      webhook_configs:
      - send_resolved: true
        url: 'http://prometheus-msteams:2000/alertmanager-longhorn' 
    route:
      group_by: ['alertname','job']
      group_interval: 1m
      group_wait: 1m
      repeat_interval: 1440m
      receiver: devnull
      routes:
      - receiver: prometheus-msteams-opensearch
        match:
          service: OpenSearch
      - receiver: prometheus-msteams-longhorn
        match:
          service: Longhorn
        group_by: ['alertname', 'job', 'pvc']
      # - receiver: prometheus-msteams-warning
      #   match:
      #     severity: warning
      # - receiver: prometheus-msteams-critical
      #   match:
      #     severity: critical