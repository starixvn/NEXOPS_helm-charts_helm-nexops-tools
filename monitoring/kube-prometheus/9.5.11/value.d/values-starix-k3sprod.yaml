---
clusterDomain: lumi.uat

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 14d
  retentionSize: "95GiB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 100Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "2xlarge"

  additionalScrapeConfigs:
    enabled: true
    type: internal
    internal:
      jobList: []

  #additionalPrometheusRules:

node-exporter:
  extraVolumes:
    - hostPath:
        path: /var/lib
        type: ""
      name: mnt

  extraVolumeMounts:
    - mountPath: /host/root/var/lib
      mountPropagation: HostToContainer
      name: mnt
      readOnly: true

  extraArgs:
    path.rootfs: "/host/root"
    collector.filesystem.mount-points-exclude: "^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    collector.filesystem.fs-types-exclude: "^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs|squashfs|nsfs|tmpfs)$"

alertmanager:
  resourcesPreset: "none"
  enabled: true

  config:
    global:
      resolve_timeout: 15m
      http_config:
        proxy_url: "http://lisasqd.nebula.prod:8801"

    route:
      receiver: "default-receiver"
      routes:
        - receiver: "null"
          match_re:
            namespace: "zabbix-proxy-devops|zabbix-server-devops"
        - receiver: "null"
          match_re:
            pod: "backup-.*|c-.*|.*-cleaner-.*|.*snapshot-.*|.*-cleanup-.*|.*-cron-.*|.*-update-.*|cpuad.*"
        - receiver: "nexpe-services-alert"
          match_re:
            namespace: "nexpe|gosql|tw|nexops|starix"
        - receiver: "kubernetes_devops_prod"
          match_re:
            alertname: "Kubernetes.*"
        - receiver: "longhorn_alerts"
          match:
            service: "Longhorn"
        - receiver: "velero_alerts"
          match:
            alertname: "Velero.*"
          group_by: ["alertname", "job", "pvc"]
        - receiver: dev-services
          match:
            service: "OpenSearch"
          group_by: ["alertname", "job"]
      group_by: ["alertname", "job", "pod", "description"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h

    receivers:
      - name: "null"
      - name: "longhorn_alerts"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#longhorn_alerts"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }}🔥PROBLEM🔥 {{ else }}✅RESOLVED✅ {{ end }}'
            text: |
              *Cluster:* `Kubernetes-DevOps-PROD`
              *Severity:* `{{ .CommonLabels.severity }}`{{ if .CommonLabels.pvc }}
              *PVC:* `{{ .CommonLabels.pvc }}`{{ end }}{{ if .CommonLabels.pvc_namespace }}
              *Namespace:* `{{ .CommonLabels.pvc_namespace }}`{{ end }}{{ if .CommonAnnotations.description }}
              *Description:* `{{ .CommonAnnotations.description }}`{{ end }}

      - name: "kubernetes_devops_prod"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#kubernetes_devops_prod"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            text: |
              *Cluster:* `Kubernetes-DevOps-PROD`
              *Summary:* `{{ .CommonLabels.alertname }}`
              *Description:* `{{ .CommonAnnotations.description }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

      - name: "nexpe-services-alert"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#nexpe-services-alert"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            text: |
              *Cluster:* `Kubernetes-DevOps-PROD`
              *Summary:* `{{ .CommonLabels.alertname }}`
              *Description:* `{{ .CommonAnnotations.description }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

      - name: "velero_alerts"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#alerts-test"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }}🔥 PROBLEM 🔥 {{ .CommonLabels.alertname }}{{ else }}✅ RESOLVED ✅ {{ .CommonLabels.alertname }}{{ end }}'
            text: |
              *Cluster:* `Kubernetes-NexProd`
              🚨 *{{ .CommonLabels.alertname }}* ({{ .Status | toUpper }})
              🔁 Schedule: `{{ .CommonLabels.schedule }}`
              ❗ Severity: `{{ .CommonLabels.severity }}`
              📝 {{ .CommonAnnotations.description }}

      - name: dev-services
        slack_configs:
          - channel: "#dev-services"
            color: '{{ template "sre.slack.color" . }}'
            fallback: '{{ template "sre.slack.fallback" . }}'
            icon_emoji: ":opensearch-ico:"
            send_resolved: true
            username: "FPS OpenSearch - PROD"
            title: '{{ template "sre.slack.title" . }}'
            text: '{{ template "sre.slack.body" . }}'

      - name: default-receiver

blackboxExporter:
  nodeSelector:
    directly-monitor: "yes"
  tolerations:
  - effect: NoSchedule
    key: cicd-tools
    value: "yes"    
  configuration: |
    modules:
      http_2xx_with_lisaqd:
        prober: http
        http:
          proxy_url: "http://lisasqd.nebula.prod:8801"
          skip_resolve_phase_with_proxy: true
      http_2xx_with_lisaqd_dev:
        prober: http
        http:
          proxy_url: "http://lisasqd.nebula.prod:8801"
          skip_resolve_phase_with_proxy: true
      tcp_connect:
        prober: tcp
        tcp:
          preferred_ip_protocol: "ip4"
      icmp_connect:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: "ip4"
          # source_ip_address: "127.0.0.1"
      

extraDeploy:
- |
  ### TCP Monitor
  kind: Probe
  apiVersion: monitoring.coreos.com/v1
  metadata:
    name: tcp-probe
    namespace: monitoring
  spec:
    interval: 5s
    module: tcp_connect
    prober:
      url: prometheus-starix-k3sprod-blackbox-exporter.monitoring.svc.starix.k3sprod:19115
    targets:
      staticConfig:
        static:
        - gitlab.starixsoft.com:443
        - 202.78.231.43:30882

- |
  ### ICMP
  kind: Probe
  apiVersion: monitoring.coreos.com/v1
  metadata:
    name: icmp-probe
    namespace: monitoring
  spec:
    interval: 5s
    module: icmp_connect
    prober:
      url: prometheus-starix-k3sprod-blackbox-exporter.monitoring.svc.starix.k3sprod:19115
    targets:
      staticConfig:
        static:
        - gitlab.starixsoft.com
        - 202.78.231.43

- |
  ### monitor via proxy lisaqd
  kind: Probe
  apiVersion: monitoring.coreos.com/v1
  metadata:
    name: lisaqd-probe
    namespace: monitoring
  spec:
    interval: 60s
    module: http_2xx_with_lisaqd
    prober:
      url: prometheus-starix-k3sprod-blackbox-exporter.monitoring.svc.starix.k3sprod:19115
    targets:
      staticConfig:
        static:
        - https://hub.nexdev.net
        - https://hub.lumigame.com
        - https://gitlab.starixsoft.com

- |
  ### monitor via proxy lisaqd-dev
  kind: Probe
  apiVersion: monitoring.coreos.com/v1
  metadata:
    name: lisaqd-dev-probe
    namespace: monitoring
  spec:
    interval: 60s
    module: http_2xx_with_lisaqd_dev
    prober:
      url: prometheus-starix-k3sprod-blackbox-exporter.monitoring.svc.starix.k3sprod:19115
    targets:
      staticConfig:
        static:
        - https://hub.nexdev.net
        - https://hub.lumigame.com
        - https://gitlab.starixsoft.com

