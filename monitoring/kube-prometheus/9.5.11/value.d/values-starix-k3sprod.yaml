---
clusterDomain: lumi.uat

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 14d
  retentionSize: "95GiB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 100Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "2xlarge"

  additionalScrapeConfigs:
    enabled: true
    type: internal
    internal:
      jobList:
      ###########################################################################
      ### Req from DBA: https://teams.microsoft.com/l/message/19:b042b9fae1704402b7582ace18f21fea@thread.v2/1728025357615?context=%7B%22contextType%22%3A%22chat%22%7D
      ###########################################################################
      - job_name: 's1-db-servers'
        scrape_interval: 5s
        # UAT MongoDB
        static_configs:
        - targets:
          - 'vn-s1-mongodb-uat.nebula.prod:8080'
          labels:
            environment: 'uat'
            db: 'mongodb'
            exporter: 'cadvisor'
        - targets:
          - 'vn-s1-mongodb-uat.nebula.prod:9216'
          labels:
            environment: 'uat'
            db: 'mongodb'
            exporter: 'mongodb_exporter'
        - targets:
          - 'vn-s1-mongodb-uat.nebula.prod:9100'
          labels:
            environment: 'uat'
            db: 'mongodb'
            exporter: 'node_exporter'
        # UAT Postgres
        - targets:
          - 'vn-s1-postgresql-uat.nebula.prod:8080'
          labels:
            environment: 'uat'
            db: 'postgres'
            exporter: 'cadvisor'
        - targets:
          - 'vn-s1-postgresql-uat.nebula.prod:9187'
          labels:
            environment: 'uat'
            db: 'postgres'
            exporter: 'postgres_exporter'
        - targets:
          - 'vn-s1-postgresql-uat.nebula.prod:9100'
          labels:
            environment: 'uat'
            db: 'postgres'
            exporter: 'node_exporter'
        # PROD MongoDB
        - targets:
          - 'vn-s1-mongodb-prod.nebula.prod:8080'
          labels:
            environment: 'production'
            db: 'mongodb'
            exporter: 'cadvisor'
        - targets:
          - 'vn-s1-mongodb-prod.nebula.prod:9216'
          labels:
            environment: 'production'
            db: 'mongodb'
            exporter: 'mongodb_exporter'
        - targets:
          - 'vn-s1-mongodb-prod.nebula.prod:9100'
          labels:
            environment: 'production'
            db: 'mongodb'
            exporter: 'node_exporter'
      ###########################################################################


  additionalPrometheusRules:
  - name: opensearch.rules
    groups:
    - name: opensearch.rules
      rules:

      # Opensearch disk out of space 
      - alert: OpensearchDiskOutOfSpace
        expr: opensearch_fs_total_available_bytes / opensearch_fs_total_total_bytes * 100 < 10
        for: 0m
        labels:
          severity: critical
        annotations:
        summary: Opensearch disk out of space (instance {{ $labels.pod }})
        description: "The disk usage is over 90%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        
      #  Opensearch Node Offline
      - alert: OpensearchNodeOffline
        expr: max_over_time(opensearch_cluster_nodes_number[5m]) < max_over_time(opensearch_cluster_nodes_number[1d:5m])
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Opensearch node goes offline (instance {{ $labels.pod }})
          description: "Some node go offline!\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # Opensearch Cluster Red 
      - alert: OpensearchClusterRed
        expr: opensearch_cluster_status == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Opensearch Cluster Red (instance {{ $labels.pod }})
          description: "Opensearch Cluster Red status\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # Opensearch Cluster Yellow 
      - alert: OpensearchClusterYellow
        expr: opensearch_cluster_status == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Opensearch Cluster Yellow (instance {{ $labels.pod }})
          description: "Elastic Cluster Yellow status\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      #  Opensearch no new documents 
      - alert: OpensearchNoNewDocuments
        expr: increase(opensearch_indices_indexing_index_count{job="ops-cluster-nodes-hot"}[10m]) < 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Opensearch no new documents (instance {{ $labels.pod }})
          description: "No new documents for 10 min!\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"



node-exporter:
  extraVolumes:
  - hostPath:
      path: /var/lib
      type: ""
    name: mnt
    
  extraVolumeMounts:
  - mountPath: /host/root/var/lib
    mountPropagation: HostToContainer
    name: mnt
    readOnly: true

  extraArgs:
    path.rootfs: "/host/root"
    collector.filesystem.mount-points-exclude: "^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    collector.filesystem.fs-types-exclude: "^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs|squashfs|nsfs|tmpfs)$"


alertmanager:
  ## @param alertmanager.enabled Deploy Alertmanager to the cluster
  ##
  enabled: true
  alertmanagerSpec:
    useExistingSecret: true
    secrets:
      - alertmanager-prometheus-server-kube-pro-alertmanager