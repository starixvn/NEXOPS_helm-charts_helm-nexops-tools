---
clusterDomain: lumi.uat

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 14d
  retentionSize: "95GiB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 100Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "2xlarge"

  additionalScrapeConfigs:
    enabled: true
    type: internal
    internal:
      jobList: []


  additionalPrometheusRules:
  - name: kubernetes.rules
    groups:
    - name: kubernetes.rules
      rules:
      - alert: Node Not Ready
        expr: kube_node_status_condition{condition="Ready", status="false"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Not Ready"
          description: "Node {{ $labels.node }} is not ready."

      - alert: High Node CPU Usage
        expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage on Node"
          description: "Node {{ $labels.instance }} is using more than {{ printf \"%.0f\" $value }}% CPU."

      - alert: High Node Memory Usage
        expr: (node_memory_Active_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage on Node"
          description: "Node {{ $labels.instance }} is using more than {{ printf \"%.0f\" $value }}% of its memory."

      - alert: High Node Disk Usage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Disk Usage on Node"
          description: "Node {{ $labels.instance }} has more than {{ printf \"%.0f\" $value }}% disk usage."

      - alert: Node Disk Pressure
        expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Disk Pressure"
          description: "Node {{ $labels.node }} is under disk pressure."

      - alert: Node Memory Pressure
        expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Memory Pressure"
          description: "Node {{ $labels.node }} is under memory pressure."

      - alert: Pod Not Running
        expr: kube_pod_status_phase{phase!="Running"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod Not Running"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not running."

      - alert: Pod Restart Detected
        expr: increase(kube_pod_container_status_restarts_total[1m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} restarted"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} just restarted!"

      - alert: Pod Restarting Frequently
        expr: increase(kube_pod_container_status_restarts_total[5m])  > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod Restarting Frequently"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted more than 3 times in the last 5 minutes."

      - alert: API Server Down
        expr: up{job="apiserver"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Server Down"
          description: "The Kubernetes API server is down."

      - alert: Cluster Pod Usage Above 50%
        expr: |
          (sum(kube_pod_info{node=~".*"}) / sum(kube_node_status_allocatable{resource="pods", node=~".*"})) * 100 > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod usage exceeds 50% of total allocatable pods in the cluster"
          description: "Pod usage is currently {{ printf \"%.0f\" $value }}% of the total cluster pod capacity."

  - name: opensearch.rules
    groups:
    - name: opensearch.rules
      rules:
      # Opensearch disk out of space 
      - alert: OpensearchDiskOutOfSpace
        expr: opensearch_fs_total_available_bytes / opensearch_fs_total_total_bytes * 100 < 10
        for: 0m
        labels:
          severity: CRITICAL
          service: OpenSearch
        annotations:
          investigate_link: "https://ops-fps.starixplay.com"
          title: "Opensearch: Disk running out of space"
          summary: Opensearch disk out of space (component {{ $labels.job }})
          description: "The disk usage is over 90%"
          template: "automate"
        
      #  Opensearch Node Offline
      - alert: OpensearchNodeOffline
        expr: max_over_time(opensearch_cluster_nodes_number[5m]) < max_over_time(opensearch_cluster_nodes_number[1d:5m])
        for: 0m
        labels:
          severity: CRITICAL
          service: OpenSearch
        annotations:
          title: "Opensearch: Nodes go Offline"
          summary: Opensearch node goes offline (component {{ $labels.job }})
          description: "Some node go offline!"
          template: "automate"

      # Opensearch Cluster Red 
      - alert: OpensearchClusterRed
        expr: opensearch_cluster_status == 0
        for: 0m
        labels:
          severity: CRITICAL
          service: OpenSearch
        annotations:
          title: "Opensearch: Cluster in Red Health"
          summary: Opensearch Cluster Red (component {{ $labels.job }})
          description: "Opensearch Cluster Red status"
          template: "automate"

      # Opensearch Cluster Yellow 
      - alert: OpensearchClusterYellow
        expr: opensearch_cluster_status == 1
        for: 0m
        labels:
          severity: WARNING
          service: OpenSearch
        annotations:
          title: "Opensearch: Cluster in Yellow Health"
          summary: Opensearch Cluster Yellow (component {{ $labels.job }})
          description: "Elastic Cluster Yellow status"
          template: "automate"

      #  Opensearch no new documents 
      - alert: OpensearchNoNewDocuments
        expr: increase(opensearch_indices_indexing_index_count{job="ops-cluster-nodes-hot"}[10m]) < 1
        for: 0m
        labels:
          severity: WARNING
          service: OpenSearch
        annotations:
          title: "Opensearch: No new Docs been written"
          summary: Opensearch no new documents (component {{ $labels.job }})
          description: "No new documents for 10 min!"
          template: "automate"

  - name: longhorn.rules
    groups:
    - name: longhorn.rules
      rules:
      - alert: LonghornVolumeActualSpaceUsedWarning
        expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: Longhorn
        annotations:
          title: "Longhorn: Volume Actual Space Used Warning"
          summary: The actual used space of Longhorn volume is over 80% of the capacity.
          description: The actual space used by Longhorn volume {{$labels.volume}} on {{$labels.node}} is at {{$value | printf "%.2f"}}% capacity for more than 5 minutes.
          template: "automate"

      - alert: LonghornVolumeStatusCritical
        expr: longhorn_volume_robustness == 3
        for: 5m
        labels:
          severity: critical
          service: Longhorn
          issue: Longhorn volume {{$labels.volume}} is Fault.
        annotations:
          title: "Longhorn: Volume Status Critical"
          summary: Longhorn volume {{$labels.volume}} is Fault
          description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Fault for more than 2 minutes.
          template: "automate"

      - alert: LonghornVolumeStatusWarning
        expr: longhorn_volume_robustness == 2
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: Longhorn volume {{$labels.volume}} is Degraded.
        annotations:
          title: "Longhorn: Volume Status Warning"
          summary: Longhorn volume {{$labels.volume}} is Degraded
          description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Degraded for more than 5 minutes.
          template: "automate"

      - alert: LonghornNodeStorageWarning
        expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 70
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: The used storage of node {{$labels.node}} is high.
        annotations:
          title: "Longhorn: Node Storage Warning"
          summary: The used storage of node is over 70% of the capacity.
          description: The used storage of node {{$labels.node}} is at {{$value | printf "%.2f"}}% capacity for more than 5 minutes.
          template: "automate"

      - alert: LonghornDiskStorageWarning
        expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is high.
        annotations:
          title: "Longhorn: Disk Storage Warning"
          summary: The used storage of disk is over 70% of the capacity.
          description: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is at {{$value | printf "%.2f"}}% capacity for more than 5 minutes.
          template: "automate"

      - alert: LonghornNodeDown
        expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
        for: 5m
        labels:
          severity: critical
          service: Longhorn
          issue: There are {{$value}} Longhorn nodes are offline
        annotations:
          title: "Longhorn: Node Down"
          summary: Longhorn nodes is offline
          description: There are {{$value}} Longhorn nodes which have been offline for more than 5 minutes.
          template: "automate"

      - alert: LonghornInstanceManagerCPUUsageWarning
        expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} consumes 3 times the CPU request.
        annotations:
          title: "Longhorn: Instance Manager CPU Usage Warning"
          summary: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is over 300%.
          description: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is {{$value | printf "%.2f"}}% for more than 5 minutes.
          template: "automate"

      - alert: LonghornNodeCPUUsageWarning
        expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: Longhorn
          issue: Longhorn node {{$labels.node}} experiences high CPU pressure.
        annotations:
          title: "Longhorn: Node CPU Usage Warning"
          summary: Longhorn node {{$labels.node}} experiences high CPU pressure for more than 5m.
          description: Longhorn node {{$labels.node}} has CPU Usage / CPU capacity is {{$value | printf "%.2f"}}% for more than 5 minutes.
          template: "automate"


node-exporter:
  extraVolumes:
  - hostPath:
      path: /var/lib
      type: ""
    name: mnt
    
  extraVolumeMounts:
  - mountPath: /host/root/var/lib
    mountPropagation: HostToContainer
    name: mnt
    readOnly: true

  extraArgs:
    path.rootfs: "/host/root"
    collector.filesystem.mount-points-exclude: "^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    collector.filesystem.fs-types-exclude: "^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs|squashfs|nsfs|tmpfs)$"


alertmanager:
  resourcesPreset: "none"
  enabled: true

  config:
    global:
      resolve_timeout: 15m
      http_config:
        proxy_url: "http://lisasqd.nebula.prod:8801"

    route:
      receiver: default-receiver
      routes:
      - receiver: 'null'
        match_re:
          namespace: "zabbix-proxy-devops|zabbix-server-devops|nexpe"
      - receiver: 'null'
        match_re:
          pod: "backup-.*|c-.*|.*-cleaner-.*|.*snapshot-.*|.*-cleanup-.*|.*-cron-.*"
      - receiver: kubernetes_devops_prod
        match_re:
          service: "prometheus-starix-k3sprod-kube-state-metrics|prometheus-starix-k3sprod-node-exporter"
      - receiver: slack-fps-opensearch
        match:
          service: "OpenSearch"
        group_by: ['alertname', 'job']
      - receiver: longhorn_alerts
        match:
          service: "longhorn-backend"
        group_by: ['alertname', 'job', 'pvc']
      group_by: ['alertname','job','pod', 'description']
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 24h

    receivers:
    - name: 'null'

    - name: slack-fps-opensearch
      slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: "#dev-services"
        send_resolved: true
        icon_emoji: ":opensearch-ico:"
        username: "FPS OpenSearch - PROD"
        title: >-
          {{ if eq .Status "firing" }}
            {{ if eq (toUpper .CommonLabels.severity) "CRITICAL") }}
              :pepe-rage:{{ .CommonAnnotations.title }} [{{ .Status | title }}, {{ .CommonLabels.severity | upper }}] x {{ len .Alerts }}:pepe-rage:
            {{ if eq (toUpper .CommonLabels.severity) "WARNING") }}
              ⚠️{{ .CommonAnnotations.title }} [{{ .Status | title }}, {{ .CommonLabels.severity | upper }}] x {{ len .Alerts }}⚠️
            {{ else }} 
              ❓{{ .CommonAnnotations.title }} [{{ .Status | title }}, {{ .CommonLabels.severity | upper }}] x {{ len .Alerts }}❓
          {{ else }}
            :pepe-yay:{{ .CommonAnnotations.title }} [{{ .Status | title }}, {{ .CommonLabels.severity | upper }}] x {{ len .Alerts }}:pepe-yay: 
          {{ end }}
        text: >-
          *Description:* `{{ .CommonAnnotations.description }}`
          *Details:*
            {{ range .Labels.SortedPairs }}
              {{ if or (or (eq $key "cluster") (eq $key "alertname") }} • *{{ .Name }}:* `{{ .Value }}`
              }
            {{ end }}
          *AlertName:* `{{ .CommonLabels.alertname }}`
          *Cluster:* `{{ .CommonLabels.cluster }}`
        color: >-
          {{ if eq .Status "firing" }}
            {{ if eq .CommonLabels.severity "critical" }}
              #8C1A1A
            {{ else if eq .CommonLabels.severity "warning" }}
              #FFA500
          {{ else }}
            #2ECC71
          {{ end }}

    - name: 'longhorn_alerts'
      slack_configs:
        - api_url: "https://hooks.slack.com/services/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"
          channel: '#longhorn_alerts'
          send_resolved: true
          icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
          title: '{{ if eq .Status "firing" }}🔥PROBLEM🔥 {{ else }}✅RESOLVED✅ {{ end }}'
          text: |
            *Severity:* `{{ .CommonLabels.severity }}`
            *Service:* `{{ .CommonLabels.service }}`
            *PVC:* `{{ .CommonLabels.pvc }}`
            *Namespace:* `{{ .CommonLabels.pvc_namespace }}`
            *Description:* `{{ .CommonAnnotations.description }}`

    - name: 'kubernetes_devops_prod'
      slack_configs:
        - api_url: "https://hooks.slack.com/services/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"
          channel: '#kubernetes_devops_prod'
          send_resolved: true
          icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
          title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
          text: |
            *Cluster:* `Kubernetes-DevOps-PROD`
            *Summary:* `{{ .CommonLabels.alertname }}`
            *Description:* `{{ .CommonAnnotations.description }}`
          color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'
        
    - name: default-receiver

blackboxExporter:
  configuration: |
    modules:
      http_2xx_with_lisaqd:
        prober: http
        http:
          proxy_url: "http://lisasqd.nebula.prod:8801"
          skip_resolve_phase_with_proxy: true
      http_2xx_with_lisaqd_dev:
        prober: http
        http:
          proxy_url: "http://lisasqd.nebula.prod:8801"
          skip_resolve_phase_with_proxy: true

