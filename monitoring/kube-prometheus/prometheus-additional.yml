- job_name: vault-cluster
  metrics_path: /v1/sys/metrics
  params:
    format: ['prometheus']
  scheme: http
  static_configs:
  - targets: ['vault-cluster.vault:8200']

- job_name: l1-streaming-server-local-service
  scrape_interval: 5s
  static_configs:
    - targets: ['l1-streaming-server-local-service.l1:5000']
      labels:
        env: local

