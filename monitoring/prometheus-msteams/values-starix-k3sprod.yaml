---
connectors:
  - alertmanager-longhorn: https://starixwork.webhook.office.com/webhookb2/4df879b9-cc79-4a14-a1d9-1de16c7c5e9e@276cca21-d2fd-4d7d-b68a-6e40e91f55cf/IncomingWebhook/94e5b76eb0144df2857f401eb329312f/8d33e434-f6ac-4fb9-a4c8-f2679f86ebc9/V2S4ThKY3yjWRgj_fyF783GTdYBtHaBN-mWke4EQX48BE1
  - alertmanager-opensearch: https://starixwork.webhook.office.com/webhookb2/4df879b9-cc79-4a14-a1d9-1de16c7c5e9e@276cca21-d2fd-4d7d-b68a-6e40e91f55cf/IncomingWebhook/49420f17ab9b4141a6481aaef746ff05/e21029dd-93ed-4c2e-bad6-39449033826b/V2MQyH7g2E9xMuJ-qhIUQkq6g5hBoumFLlDLIjWH-7IYk1
extraEnvs:
  HTTP_PROXY: http://lisasqd.nebula.prod:8801
  HTTPS_PROXY: http://lisasqd.nebula.prod:8801

customCardTemplate: |
  {{ define "teams.card" }}

    {{/* Should add url on activity title? */}}
    {{ $should_embed_activity_title_url := false }}

    {{/* Should 'http:' in the generator url be replaced with 'https:'? */}}
    {{ $should_enforce_https := true }}

    {{/* Should certain common labels be filtered? */}}
    {{ $should_filter_labels := true }}

    {{/* Should certain common annotations be filtered? */}}
    {{ $should_filter_annotations := true }}

    {{/* Should the potential actions field be included? */}}
    {{ $should_have_potential_actions := false }}

    {{/* For example 'https://www.google.com/alertkarma/?'. Ignored if empty. */}}
    {{ $alertkarma_prefix := ""}}

    {{ $templateEmoji := "" }}
    {{- if eq .Status "resolved" -}} 
      {{- $templateEmoji = "✅" -}}
    {{- else if eq .Status "firing" -}}
      {{- if or (eq .CommonLabels.severity "CRITICAL") (eq .CommonLabels.severity "critical") -}} 
        {{- $templateEmoji = "🚨" -}}
      {{- else if or (eq .CommonLabels.severity "WARNING") (eq .CommonLabels.severity "warning") -}}
        {{- $templateEmoji = "⚠️" -}}
      {{- else -}}
        {{- $templateEmoji = "❓" -}}
      {{- end -}}
    {{- else -}}
      {{- $templateEmoji = "❓" -}}
    {{- end -}}

    {
      "@type": "MessageCard",
      "@context": "http://schema.org/extensions",
      "themeColor": "
        {{- if eq .Status "resolved" -}}
          2DC72D
        {{- else if eq .Status "firing" -}}
          {{- if or (eq .CommonLabels.severity "CRITICAL") (eq .CommonLabels.severity "critical") -}}
            8C1A1A
          {{- else if or (eq .CommonLabels.severity "WARNING") (eq .CommonLabels.severity "warning") -}}
            FFA500
          {{- else -}}
            808080
          {{- end -}}
        {{- else -}}
          808080
        {{- end -}}",

      {{/*====================================================================*/}}

      {{ if eq .CommonAnnotations.template "automate" }}
        "title": "{{ $templateEmoji }} {{ .CommonAnnotations.title }} [{{ .Status | title }}, {{ .CommonLabels.severity | upper }}] x {{ len .Alerts }}",
        "summary": "{{ .CommonAnnotations.title }} [{{ .Status | title }}, {{ .CommonLabels.severity | title }}] x {{ len .Alerts }}",
        "sections": [
          {{/* FIRST SECTION: Common annotations and labels */}}
          {
            "markdown": true,
            {{ if not $should_embed_activity_title_url }}
              "activityTitle": "{{ .CommonAnnotations.summary }}",
            {{ else if gt (len .CommonAnnotations.generator_url_override) 0}}
              "activityTitle": "[{{ .CommonAnnotations.summary }}]({{ .CommonAnnotations.enerator_url_override }})",
            {{ else if $should_enforce_https }}
              "activityTitle": "[{{ .CommonAnnotations.summary }}]({{ (index .Alerts 0).GeneratorURL | replace "http:" "https:" }})",
            {{ else }}
              "activityTitle": "[{{ .CommonAnnotations.summary }}]({{ (index .Alerts 0).GeneratorURL }})",
            {{ end }}
            "text": "{{ .CommonAnnotations.description }}",
            "facts": [
              {{/* Common Annotations (filtered) */}}
              {{ $foundannotation := false }}
              {{ $first := true }}
              {{ range $key, $value := .CommonAnnotations }}
                {{ if and $should_filter_annotations (ne $key "title") (ne $key "summary") (ne $key "description") (ne $key "key") (ne $key "value") (ne $key "generator_url_override") (ne $key "investigate_link") (ne $key "template") }}
                  {{ if $first }}
                    {{ $first = false }}
                    {{ $foundannotation = true }}
                  {{ else }}
                    ,
                  {{ end }}
                  { 
                    "name": "{{ $key | title }}:", 
                    "value": "{{ $value }}"
                  }
                {{ end }}
              {{ end }}
              {{ if $foundannotation }},{{ end }}
              {{/* Common Labels (filtered) */}}
              {{$first := true}}
              {{ range $key, $value := .CommonLabels }}
                {{ if and $should_filter_labels (or (eq $key "cluster") (eq $key "alertname") (eq $key "pvc") (eq $key "namespace") (eq $key "node")) }}
                  {{ if $first }}{{ $first = false }}{{ else }},{{ end }}
                  {
                    "name": "{{ $key | title }}:", 
                    "value": "{{ $value }}" 
                  }
                {{ end }}
              {{ end }}
            ]
          },
          {{/* SECOND SECTION: key and value specific annotations */}}
          {
            "markdown": true,
            "facts": [
              {{ $first := true }}
              {{ range $index, $alert := .Alerts }}
                {{ if gt (add (len $alert.Annotations.key) (len $alert.Annotations.value)) 0 }}
                {{/* Only proceed if key-value found */}}
                  {{ if $first }}{{ $first = false }}{{ else }},{{ end }}
                  {
                    "name": "{{ $alert.Annotations.value }}", 
                    "value": "{{ $alert.Annotations.key }}" 
                  }
                {{ end }}
              {{ end }}
            ]
          }
        ]
        {{ if $should_have_potential_actions }}
          ,
          "potentialAction": [
            {
              "@type": "OpenUri",
              "name": "View in Alertmanager",
              "targets": [
                {
                  "os": "default", 
                  "uri": "{{ .ExternalURL }}/#?alerts/silenced=true&inhibited=true&active=true&filter=%7B{{$c := counter}}{{ range $key, $value := .CommonLabels }}{{if call $c}}%22%2C%20{{ end }}{{ $key }}%3D%22{{ $value }}{{- end }}%22%7D"
                }
              ]
            }
            {{ if gt (len $alertkarma_prefix) 0 }}
              ,
              {
                "@type": "OpenUri",
                "name": "View in Alertkarma",
                "targets": [
                  { 
                    "os": "default", 
                    "uri": "{{ $alertkarma_prefix }}q=alertname%3D{{ .CommonLabels.alertname }}"
                  }
                ]
              }
            {{ end }}
            {{ if gt (len .CommonAnnotations.investigate_link) 0 }}
              ,
              {
                "@type": "OpenUri",
                "name": "Investigate",
                "targets": [
                  { 
                    "os": "default", 
                    "uri": "{{- .CommonAnnotations.investigate_link | trim -}}"
                  }
                ]
              }
            {{ end }}
          ]
        {{ end }}


      {{ else }}
        "summary": "{{- if eq .CommonAnnotations.summary "" -}}
                        {{- if eq .CommonAnnotations.message "" -}}
                          {{- if eq .CommonLabels.alertname "" -}}
                            Longhorn Alert
                          {{- else -}}
                            {{- .CommonLabels.alertname -}}
                          {{- end -}}
                        {{- else -}}
                          {{- .CommonAnnotations.message -}}
                        {{- end -}}
                    {{- else -}}
                        {{- .CommonAnnotations.summary -}}
                    {{- end -}}",
        "title": "{{ $templateEmoji }} Longhorn Alert ({{ .Status | title }})",
        "sections": [ {{$externalUrl := .ExternalURL}}
        {{- range $index, $alert := .Alerts }}{{- if $index }},{{- end }}
          {
            "facts": [
             {
                "name": "Space Used",
                "value": "{{ $value | printf "%.2f" }}"
              },
              {
                "name": "PVC",
                "value": "{{ $alert.Labels.pvc }}"
              },
              {
                "name": "Namespace",
                "value": "{{ $alert.Labels.pvc_namespace }}"
              },
              {
                "name": "Node",
                "value": "{{ $alert.Labels.node }}"
              }
            ],
            "markdown": true
          }
          {{- end }}
        ]
      {{ end }}
    }
  {{ end }}
