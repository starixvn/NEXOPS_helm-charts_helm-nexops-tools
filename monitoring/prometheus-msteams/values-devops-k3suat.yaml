---
replicaCount: 1

image:
  repository: quay.io/prometheusmsteams/prometheus-msteams
  tag: v1.5.2
  pullPolicy: Always

imagePullSecrets: []

extraEnvs: {}

container:
  port: 2000
  additionalArgs: []

resources: {}
#  limits:
#    cpu: 10m
#    memory: 32Mi
#  requests:
#    cpu: 1m
#    memory: 8Mi

service:
  type: ClusterIP
  port: 2000

nodeSelector: {}

tolerations: []

affinity: {}

containerSecurityContext: {}

podSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true

priorityClassName: ""

# Custom labels for pod assignment
podLabels: {}

metrics:
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    scrapeInterval: 30s

## Specify the custom message card template for MS teams
customCardTemplate: ""
# customCardTemplate: |
#   {{ define "teams.card" }}
#   {...}
#   {{ end }}

templateFile: /etc/template/card.tmpl

extraConfigmapMounts: []
# extraConfigmapMounts:
#   - name: customConfigMap
#     configMap:
#       name: customConfigMapName

## Additional Volume mounts
extraVolumeMounts: []
# extraVolumeMounts:
#   - name: volume-name
#     mountPath: /etc/custom_path

connectors:
  - alertmanager-warning: https://starixwork.webhook.office.com/webhookb2/4df879b9-cc79-4a14-a1d9-1de16c7c5e9e@276cca21-d2fd-4d7d-b68a-6e40e91f55cf/IncomingWebhook/94e5b76eb0144df2857f401eb329312f/8d33e434-f6ac-4fb9-a4c8-f2679f86ebc9/V2S4ThKY3yjWRgj_fyF783GTdYBtHaBN-mWke4EQX48BE1
  - alertmanager-critical: https://starixwork.webhook.office.com/webhookb2/4df879b9-cc79-4a14-a1d9-1de16c7c5e9e@276cca21-d2fd-4d7d-b68a-6e40e91f55cf/IncomingWebhook/94e5b76eb0144df2857f401eb329312f/8d33e434-f6ac-4fb9-a4c8-f2679f86ebc9/V2S4ThKY3yjWRgj_fyF783GTdYBtHaBN-mWke4EQX48BE1
extraEnvs:
  HTTP_PROXY: http://lisasqd.nebula.prod:8801
  HTTPS_PROXY: http://lisasqd.nebula.prod:8801
# ref: https://github.com/prometheus-msteams/prometheus-msteams#customise-messages-per-ms-teams-channel
connectorsWithCustomTemplates:
  - request_path: /alert2
    template_file: |
      {{ define "msteams.default.summary" }}{{ template "__subject" . }}{{ end }}
      {{ define "msteams.default.title" }}{{ template "__subject" . }}{{ end }}
      {{ define "msteams.default.text" }}
      {{ if gt (len .Alerts.Firing) 0 }}
      # Alerts Firing:
      {{ template "__text_alert_list_markdown" .Alerts.Firing }}
      {{ end }}
      {{ if gt (len .Alerts.Resolved) 0 }}
      # Alerts Resolved:
      {{ template "__text_alert_list_markdown" .Alerts.Resolved }}
      {{ end }}
      {{ end }}
   webhook_url: https://starixwork.webhook.office.com/webhookb2/4df879b9-cc79-4a14-a1d9-1de16c7c5e9e@276cca21-d2fd-4d7d-b68a-6e40e91f55cf/IncomingWebhook/94e5b76eb0144df2857f401eb329312f/8d33e434-f6ac-4fb9-a4c8-f2679f86ebc9/V2S4ThKY3yjWRgj_fyF783GTdYBtHaBN-mWke4EQX48BE1
   escape_underscores: true
# - request_path: /alert2
#   template_file: |
#     {{ define "teams.card" }}
#     {...}
#     {{ end }}
#   webhook_url: <webhook>
#   escape_underscores: true

# Env from existing secrets or configmaps (in same namespace), will passed through to contains 'envFrom'
envFrom: {}
# envFrom:
#   - secretRef:
#       name: my-prometheus-msteams-env-secret
#   - configMapRef:
#       name: my-prometheus-msteams-env-cm
