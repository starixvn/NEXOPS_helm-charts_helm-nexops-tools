
- job_name: vault
  metrics_path: /v1/sys/metrics
  params:
    format: ['prometheus']
  scheme: http
  static_configs:
  - targets: ['vault.nexops:8200']


- job_name: vault-cluster
  metrics_path: /v1/sys/metrics
  params:
    format: ['prometheus']
  scheme: http
  static_configs:
  - targets: ['vault-cluster.vault:8200']