- job_name: resource-usage-prod
  scrape_interval: 5s
  metrics_path: /metrics
  scheme: http
  static_configs:
    - targets: ['10.88.55.100:9100', '10.88.56.100:9100', '10.88.55.108:9100', '10.88.55.107:9100']
      labels:
        type: resource
        env: prod
  relabel_configs:
    - source_labels: [__address__]
      regex: (.*):(9100)
      target_label: instance
      replacement: '${1}'
