image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "1.117.0"

nodeSelector:    
  n8n: "yes"

redis:
  image:
    registry: hub.lumigame.com
    repository: base/bitnami/redis
    pullPolicy: IfNotPresent
    tag: "6.2.7-debian-11-r11"
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi
    nodeSelector:
      n8n: "yes"
  replica:
    replicaCount: 1
    persistence:
      size: 1Gi
    nodeSelector:
      n8n: "yes"

# values for N8N
n8n:
  encryptionKey: d9d8f70c3165f6393b7df462b09f73e2
  log_level: "debug"
  timezone: "Asia/Ho_Chi_Minh"
  webhookUrl: https://n8n.lumigame.com/
  auth:
    enabled: true
    username: "n8n"
    password: "N8nPassW0r$"
  data:
    prune:
      enabled: true
      # prune old executions data after X hours
      max_age: "72"
  nodeSelector:
    n8n: "yes"

  extraVolumes:
    - name: n8n-license
      configMap:
        name: n8n-license-cm
    - name: n8n-node-modules
      persistentVolumeClaim:
        claimName: n8n-node-modules-pvc

  extraVolumeMounts:
    - name: n8n-license
      mountPath: /usr/local/lib/node_modules/n8n/dist/license.js
      subPath: license.js
    - name: n8n-node-modules
      mountPath: /home/node/.n8n

# values for PostgreSql helm chart
postgresql:
  image:
    registry: hub.lumigame.com
    repository: base/bitnami/postgresql
    pullPolicy: IfNotPresent
    tag: "15.4.0-debian-11-r45"
  enabled: true
  auth:
    database: "n8n"
    username: "n8n"
    password: "N8nPassW0r$"
  persistence:
    enabled: true
    type: pvc
    storageClass: longhorn
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  nodeSelector:
    n8n: "yes"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "400m"
    memory: "2Gi"

ingress:
  enabled: true
  className: "haproxy"
  host: "n8n.lumigame.com"
  annotations: {}
