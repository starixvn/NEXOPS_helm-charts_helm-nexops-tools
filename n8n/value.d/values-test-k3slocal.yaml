image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "1.95.3"

redis:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi
  replica:
    replicaCount: 1
    persistence:
      size: 1Gi

## values for N8N
n8n:
  encryptionKey: d9d8f70c3165f6393b7df462b09f73e2
  log_level: "debug"
  timezone: ""
  webhookUrl: http://10.18.200.193:30080/
  auth:
    enabled: true
    username: "n8n"
    password: "N8nPassW0r$"
  data:
    prune:
      enabled: true
      # prune old executions data after X hours
      max_age: "72"

# values for PostgreSql helm chart
postgresql:
  enabled: true
  auth:
    database: "n8n"
    username: "n8n"
    password: "N8nPassW0r$"
  persistence:
    enabled: true
    type: pvc
    storageClass: longhorn
    accessModes:
      - ReadWriteOnce
    size: 2Gi

service:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

ingress:
  enabled: true
  className: "haproxy"
  host: "n8n-test.nexdev.net"
  annotations: {}
