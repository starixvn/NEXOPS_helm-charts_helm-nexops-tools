image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "1.115.3"

redis:
  image:
    registry: hub.nexdev.net
    repository: base/bitnamilegacy/redis
    pullPolicy: IfNotPresent
    tag: "6.2.7-debian-11-r11"
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi
  replica:
    replicaCount: 1
    persistence:
      size: 1Gi

## values for N8N
n8n:
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false

  persistence:
    enabled: true
    existingClaim: n8n-node-modules-pvc
    mountPath: /home/node/.n8n
    
  encryptionKey: d9d8f70c3165f6393b7df462b09f73e2
  log_level: "debug"
  timezone: "Asia/Ho_Chi_Minh"
  webhookUrl: http://10.18.200.193:30080/
  auth:
    enabled: true
    username: "n8n"
    password: "N8nPassW0r$"
  data:
    prune:
      enabled: true
      # prune old executions data after X hours
      max_age: "72"

  # extraVolumes:
  #   - name: n8n-license
  #     configMap:
  #       name: n8n-license-cm
  #   - name: n8n-node-modules
  #     persistentVolumeClaim:
  #       claimName: n8n-node-modules-pvc

  extraVolumeMounts:
    - name: n8n-license
      mountPath: /usr/local/lib/node_modules/n8n/dist/license.js
      subPath: license.js
    - name: n8n-node-modules
      mountPath: /home/node/.n8n

# values for PostgreSql helm chart
postgresql:
  image:
    registry: hub.nexdev.net
    repository: base/bitnami/postgresql
    pullPolicy: IfNotPresent
    tag: "15.4.0-debian-11-r45"
  enabled: true
  auth:
    database: "n8n"
    username: "n8n"
    password: "N8nPassW0r$"
  persistence:
    enabled: true
    type: pvc
    storageClass: longhorn
    accessModes:
      - ReadWriteOnce
    size: 2Gi

service:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

ingress:
  enabled: true
  className: "haproxy"
  host: "n8n-test.nexdev.net"
  annotations: {}

