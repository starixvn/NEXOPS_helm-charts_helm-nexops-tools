image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "1.107.4"

redis:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi
  replica:
    replicaCount: 1
    persistence:
      size: 1Gi

## values for N8N
n8n:
  encryptionKey: d9d8f70c3165f6393b7df462b09f73e2
  log_level: "debug"
  timezone: ""
  webhookUrl: http://10.18.200.193:30080/
  auth:
    enabled: true
    username: "n8n"
    password: "N8nPassW0r$"
  data:
    prune:
      enabled: true
      # prune old executions data after X hours
      max_age: "72"

  extraVolumes:
    - name: n8n-license
      configMap:
        name: n8n-license-cm

  extraVolumeMounts:
    - name: n8n-license
      mountPath: /usr/local/lib/node_modules/n8n/dist/license.js
      subPath: license.js
  
  # extraVolumes:
  #   - name: n8n-node-modules
  #     persistentVolumeClaim:
  #       claimName: n8n-node-modules-pvc

  # extraVolumeMounts:
  #   - name: n8n-node-modules
  #     mountPath: /home/node/.n8n
  #     #subPath: data

# values for PostgreSql helm chart
postgresql:
  enabled: true
  auth:
    database: "n8n"
    username: "n8n"
    password: "N8nPassW0r$"
  persistence:
    enabled: true
    type: pvc
    storageClass: longhorn
    accessModes:
      - ReadWriteOnce
    size: 2Gi

service:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

ingress:
  enabled: true
  className: "haproxy"
  host: "n8n-test.nexdev.net"
  annotations: {}

