image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "1.118.0"

nodeSelector:    
  n8n-wasa: "yes"

redis:
  image:
    registry: hub.nexdev.net
    repository: base/bitnamilegacy/redis
    pullPolicy: IfNotPresent
    tag: "6.2.7-debian-11-r11"
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi
    nodeSelector:
      n8n-wasa: "yes"
  replica:
    replicaCount: 1
    persistence:
      size: 1Gi
    nodeSelector:
      n8n-wasa: "yes"

# values for N8N
n8n:
  persistence:
    enabled: true
    existingClaim: n8n-node-modules-pvc
    mountPath: /home/node

  progressDeadlineSeconds: 1800
  encryptionKey: d9d8f70c3165f6393b7df462b09f73e2
  log_level: "debug"
  timezone: "Asia/Ho_Chi_Minh"
  webhookUrl: https://n8n-wasa.nexdev.net/
  auth:
    enabled: true
    username: "n8n"
    password: "N8nWasa$"
  data:
    prune:
      enabled: true
      # prune old executions data after X hours
      max_age: "72"
  nodeSelector:
    n8n-wasa: "yes"

  extraVolumes:
    - name: n8n-node-modules
      persistentVolumeClaim:
        claimName: n8n-node-modules-pvc

  extraVolumeMounts:
    - name: n8n-node-modules
      mountPath: /home/node

# values for PostgreSql helm chart
postgresql:
  image:
    registry: hub.nexdev.net
    repository: base/bitnami/postgresql
    pullPolicy: IfNotPresent
    tag: "15.4.0-debian-11-r45"
  enabled: true
  auth:
    database: "n8n"
    username: "n8n"
    password: "N8nWasa$"
  persistence:
    enabled: true
    type: pvc
    storageClass: longhorn
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    nodeModules:
      enabled: true
      size: "5Gi"
      storageClass: "longhorn"
  nodeSelector:
    n8n-wasa: "yes"

ingress:
  enabled: true
  className: "haproxy"
  host: "n8n-wasa.nexdev.net"
  annotations: {}

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

persistence:
  enabled: true
  nodeModules:
    enabled: true
    size: "5Gi"
    storageClass: "longhorn"
    mountPath: "/usr/local/lib/node_modules"
#Admin Login: admin@starixsoft.com/N8nWasa$
