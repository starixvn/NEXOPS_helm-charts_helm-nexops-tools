apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "n8n.fullname" . }}-node-modules
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.nodeModules.size | default "2Gi" }}
  storageClassName: {{ .Values.persistence.nodeModules.storageClass | default "longhorn" }}