clusterDomain: lumi.lumprod
image:
  tag: latest
persistence:
  storageClass: longhorn
ingress:
  enabled: true
  className: haproxy
  tls:
    - secretName: "haproxy-ingress/nexent-cert"
      hosts:
        - baget.nexentgame.com    
  hosts:
    - host: baget.nexentgame.com
      paths:
        - path: "/"
          pathType: Prefix