replicaCount: 1

image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server-vulkan-b4762
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 11434
  nodePort: 31434

# resources:
#   requests:
#     cpu: "4"
#     memory: "6Gi"
#   limits:
#     cpu: "8"
#     memory: "8Gi"

env:
  #- name: MODEL_PATH
  #  value: "/models/llama-3-8b.Q4_K_M.gguf"
  #- name: THREADS
  #  value: "8"
  - name: LLAMA_BACKEND
    value: "cpu"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 30Gi
  storageClass: "local-path"
  #mountPath: /models

ingress:
  enabled: true
  className: "haproxy"
  hosts:
    - host: llama3.lumigame.com
      paths:
        - path: /
          pathType: Prefix

nodeSelector:
  ollama: "yes"
tolerations:
- effect: NoSchedule
  key: ollama
  value: "yes"