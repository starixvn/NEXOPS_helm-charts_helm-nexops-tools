global:
  defaultStorageClass: "longhorn-effort"
clusterDomain: starix.nexprod




primary:
  extendedConfiguration: |-
    log_line_prefix = '%m [%p] %q%u@%d '
    logging_collector = 'on'
    log_rotation_size = '102400'
    log_truncate_on_rotation = 'on'
    log_duration = 'on'
    log_statement = 'none'
    log_min_duration_statement = 0
    log_checkpoints = 'on'
    log_connections = 'on'
    log_disconnections = 'on'
    log_lock_waits = 'on'
  resourcesPreset: "none"
  persistence:
    enabled: true
    size: 10Gi
