global:
  defaultStorageClass: "longhorn-best-effort"
clusterDomain: lumi.lumprod


image:
  registry: hub.lumigame.com
  repository: base/postgres
  tag: 16.3.0-debian-12-r19-pgvector


primary:
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 2048Mi
  persistence:
    enabled: true
    size: 10Gi
