apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config-pg
  namespace: "postgres-db"
data:
  filebeat.yml: |
    #filebeat.inputs:
      # - type: log
      #   paths:
      #     - "${PG_LOG_PATH}/*.log"
      #   tags: ["${PG_ENV}", "postgresql", "non-module" ]
    # Enable the PostgreSQL module
    filebeat.modules:
      - module: postgresql
        log:
          enabled: true
          var.paths: ["${PG_LOG_PATH}/*.log"]
          # var.paths: ["/bitnami/postgresql/data/log/*.log"]
          tags: ["postgresql", "${PG_ENV}", "module"]
        metric:
          enabled: false

    output:
      logstash:
        hosts: ["10.10.50.121:30500"]

    filebeat.config.modules:
      # Glob pattern for configuration loading
      path: ${path.config}/modules.d/*.yml
      # Set to true to enable config reloading
      reload.enabled: false
    logging:
      ### Filebeat log
      level: info