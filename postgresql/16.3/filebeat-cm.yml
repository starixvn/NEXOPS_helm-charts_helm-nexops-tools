apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config-pg
  namespace: "postgres-db"
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: log
        paths:
          - "${PG_LOG_PATH}/*.log*"
        tags: ["${PG_ENV}", "postgresql" ]
    # Enable the PostgreSQL module
    filebeat.modules:
      - module: postgres
        log:
          enabled: true
          var.paths: ["${PG_LOG_PATH}/*.log*"]
          tags: ["postgresql", "${PG_ENV}"]
        metric:
          enabled: false

    output:
      logstash:
        hosts: ["${LOGSTASH_HOST}:${LOGSTASH_PORT}"]

    filebeat.config.modules:
      # Glob pattern for configuration loading
      path: ${path.config}/modules.d/*.yml
      # Set to true to enable config reloading
      reload.enabled: false
    logging:
      ### Filebeat log
      level: info