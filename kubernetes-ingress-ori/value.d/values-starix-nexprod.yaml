---
controller:
  extraArgs:
  - --configmap-tcp-services=haproxy-ingress/tcp-configmap
  service:
    type: LoadBalancer
    tcpPorts:
    - name: logstash
      port: 5044
      targetPort: 5044
      protocol: TCP


# Add-on component
extraResources:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: tcp-configmap
      namespace: haproxy-ingress
    data:
      5044:
        logging/logstash-nexprod-logstash:5044