---
controller:
  extraArgs:
  - --configmap-tcp-services=haproxy-ingress/tcp-configmap
  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    tcpPorts:
    - name: logstash
      port: 5044
      targetPort: 5044
      protocol: TCP

  logging:
    level: info
    traffic:
      address: "logstash-nexprod-logstash.logging.svc"
      port: "5045"
      format: "rfc3164"
      facility: "local1"


# Add-on component
extraResources:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: tcp-configmap
      namespace: haproxy-ingress
    data:
      5044:
        logging/logstash-nexprod-logstash:5044