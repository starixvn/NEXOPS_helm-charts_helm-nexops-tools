---
controller:
  config:
    ssl-certificate: "haproxy-ingress/nexent-cert"
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules


  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"

  logging:
    level: info
    traffic:
      address: "10.10.50.121"
      port: "30505"
      format: "rfc3164"
      facility: "local3"

  nodeSelector:
    node-role.kubernetes.io/master: "true"
    node-role.kubernetes.io/control-plane: "true"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 10s

defaultBackend:
  image: "hub.nexdev.net/base/nexops-tools/default-backend-ingress"

extraResources:
##############################
## WILDCARD SSL - NEXDEV.NET
##############################
- |
  apiVersion: v1
  kind: Secret
  type: kubernetes.io/tls
  metadata:
    name: nexdev-crt
    namespace: haproxy-ingress
  data:
    tls.crt: 
    tls.key: 
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: dummy-load-nexdev-cert
    namespace: haproxy-ingress
  spec:
    ingressClassName: haproxy
    tls:
    - hosts:
      - "*.nexdev.net"
      secretName: nexdev-crt
    rules:
    - host: "*.nexdev.net"

##############################
## STAT INGRESS
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: stat-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
    annotations:
      haproxy.org/ssl-redirect: "true"
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    rules:
    - host: ing-stat.nexdev.net
      http:
        paths:
        - backend:
            service:
              name: {{ include "kubernetes-ingress.fullname" . }}
              port:
                number: 1024
          path: /
          pathType: Prefix

##############################
## DEFAULT BACKEND CONF
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    defaultBackend:
      service:
        name: be-default-{{ .Release.Name }}
        port:
          number: 80
- |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: nexops
    template:
      metadata:
        labels:
          app: nexops
      spec:
        containers:
        - name: nexops
          image: {{ .Values.defaultBackend.image }}
          imagePullPolicy: Always
          ports:
          - containerPort: 8080
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    selector:
      app: nexops
