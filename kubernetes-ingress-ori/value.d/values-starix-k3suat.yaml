---
controller:
  config:
    ssl-certificate: "haproxy-ingress/nebula-prod-cert"
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules

  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"

  logging:
    level: info
    traffic:
      address: "logstash-starix-k3suat-logstash.logging.svc"
      port: "5045"
      format: "rfc3164"
      facility: "local1"

  nodeSelector:
    node-role.kubernetes.io/master: "true"
    node-role.kubernetes.io/control-plane: "true"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s