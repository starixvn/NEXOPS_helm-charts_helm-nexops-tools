---
controller:
  config:
    ssl-certificate: "haproxy-ingress/nebula-prod-cert"
    stats-config-snippet: |
      stats auth s1:s1@Nova888
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"

  logging:
    level: info
    traffic:
      address: "vn-st-ing-prod.nebula.prod"
      port: "30045"
      format: "rfc3164"
      facility: "local5"

  nodeSelector:
    node-role.kubernetes.io/master: ""
    node-role.kubernetes.io/control-plane: ""

  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

defaultBackend:
  image: "nexhub.nebula.prod/kbt/base/nexops-tools/default-backend-ingress"

extraResources:
##############################
## DEFAULT BACKEND CONF
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    defaultBackend:
      service:
        name: be-default-{{ .Release.Name }}
        port:
          number: 80
- |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: nexops
    template:
      metadata:
        labels:
          app: nexops
      spec:
        containers:
        - name: nexops
          image: {{ .Values.defaultBackend.image }}
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    selector:
      app: nexops
