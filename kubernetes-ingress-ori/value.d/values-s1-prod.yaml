---
controller:
  config:
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
  service:
    type: LoadBalancer

  nodeSelector:
    node-role.kubernetes.io/master: ""
    node-role.kubernetes.io/control-plane: ""

  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane