---
controller:
  extraArgs:
  - --configmap-tcp-services=haproxy-ingress/tcp-configmap
  service:
    type: LoadBalancer
    tcpPorts:
    - name: logstash
      port: 15044
      targetPort: 15044
      protocol: TCP

  externalTrafficPolicy: "Local"
  logging:
    level: info
    traffic:
      address: "stdout"
      format: "raw"
      facility: "daemon"


# Add-on component
extraResources:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: tcp-configmap
      namespace: haproxy-ingress
    data:
      15044:
        logging/logstash-testlab-logstash:5044