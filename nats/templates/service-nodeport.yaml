apiVersion: v1
kind: Service
metadata:
  {{- include "nats.metadataNamespace" $ | nindent 2 }}
  name: "{{ .Values.service.name }}-nodeport"
  labels:
    {{- include "nats.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "nats.selectorLabels" $ | nindent 4 }}
  ports:
    - appProtocol: tcp
      name: nats
      port: 4222
      protocol: TCP
      targetPort: nats
      nodePort: {{ .Values.config.nats.nodePort }}
  type: NodePort