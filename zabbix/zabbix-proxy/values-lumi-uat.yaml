
nameOverride: ""
fullnameOverride: ""
kube-state-metrics:
  enabled: true
rbac:
  create: true
  additionalRulesForClusterRole: []
serviceAccount:
  create: true
  name: zabbix-service-account


zabbixProxy:
  enabled: true
  containerSecurityContext: {}
  resources: {}
  image:
    repository: nexhub.nebula.prod/kbt/base/zabbix/zabbix-proxy-sqlite3
    tag: alpine-7.0.0
    pullPolicy: IfNotPresent
    pullSecrets: []
  resources:
    limits:
      memory: 2048Mi
    requests:
      memory: 1024Mi

  env:
    ## The variable allows to switch Zabbix proxy mode. By default, value is 0 - active proxy. Allowed values are 0 and 1.
    - name: ZBX_PROXYMODE
      value: 1
    - name: ZBX_HOSTNAME
      value: zabbix-proxy-lumi-uat
    - name: ZBX_SERVER_HOST
      value: '0.0.0.0/0'
    - name: ZBX_DEBUGLEVEL
      value: 3
    - name: ZBX_CACHESIZE
      value: 128M
    - name: ZBX_JAVAGATEWAY_ENABLE
      value: false
    - name: ZBX_PROXYCONFIGFREQUENCY
      value: 10

  service:
    annotations: {}
    labels: {}
    type: NodePort
    port: 10051
    targetPort: 10051
    externalIPs: []
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

  nodeSelector: {}
  tolerations: {}
  affinity: {}

  persistentVolume:
    enabled: false
    accessModes:
      - ReadWriteOnce
    annotations: {}
    existingClaim: ""
    mountPath: /data
    size: 2Gi
    storageClass: "-"
    volumeBindingMode: ""
    subPath: ""

zabbixAgent:
  enabled: true
  resources: {}
  securityContext: {}

  containerSecurityContext: {}
  hostNetwork: true
  dnsConfig: {}
  hostPID: true
  hostRootFsMount: true
  extraHostVolumeMounts: []
  image:
    repository: nexhub.nebula.prod/kbt/base/zabbix/zabbix-agent2
    tag: ubuntu-7.0.0-v1
    pullPolicy: IfNotPresent
    pullSecrets: []
  env:
    - name: ZBX_SERVER_HOST
      value: 0.0.0.0/0
    - name: ZBX_SERVER_PORT
      value: 10051
    - name: ZBX_PASSIVE_ALLOW
      value: true
    - name: ZBX_ACTIVE_ALLOW
      value: false
    - name: ZBX_DEBUGLEVEL
      value: 3
    - name: ZBX_TIMEOUT
      value: 4

  nodeSelector:
    kubernetes.io/os: linux

  tolerations:
    - operator: Exists

  affinity: {}
  serviceAccount:
    create: true
    name: zabbix-agent-service-account
    annotations: {}
    imagePullSecrets: []
    automountServiceAccountToken: false

  service:
    type: ClusterIP
    port: 10069
    targetPort: 10069
    nodePort: 31069
    portName: zabbix-agent
    listenOnAllInterfaces: true
    annotations:
      agent.zabbix/monitor: "true"

  rbac:
    create: true
    pspEnabled: false
    pspAnnotations: {}