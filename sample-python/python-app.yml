---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-python-app
  labels:
    app: sample-python-app
  namespace: nexops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
      - name: sample-python-app
        image: hub.lumigame.com/base/sample-python-app:v1
        resources:
          limits:
            memory: "100Mi"
            cpu: "100m"

---
kind: Service
apiVersion: v1
metadata:
  labels:
    app: sample-python-app
  name: sample-python-app
  namespace: nexops
spec:
  selector:
    app: sample-python-app
  type:  ClusterIP
  ports:
  - name:  sample-python-app
    port:  5001
    targetPort:  5001

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    ingress.class: haproxy
  name: sample-python-app
  namespace: nexops
spec:
  ingressClassName: haproxy
  rules:
  - host: python-sp.lumigame.com
    http:
      paths:
      - backend:
          service:
            name: sample-python-app
            port:
              number: 5001
        path: /
        pathType: Prefix
