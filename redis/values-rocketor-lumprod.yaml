clusterDomain: "lumi.lumprod"

global:
  storageClass: "longhorn-best-effort"
  imageRegistry: "hub.lumigame.com"

image:
  repository: base/redis
  tag: 7.2.4-debian-12-r9


metrics:
  enabled: true
  image:
    repository: base/redis-exporter
    tag: 1.58.0-debian-12-r3
  serviceMonitor:
    enabled: true
  podMonitor:
    enabled: true

architecture: standalone

auth:
  password: "foo1@bared"

commonConfiguration: |-
  save 900 1
  save 300 10
  save 60 10000
  appendonly yes
  appendfilename "appendonly.aof"
  appendfsync everysec

volumePermissions:
  enabled: true
  image:
    repository: base/os-shell
    tag: 12-debian-12-r16


master:
  persistence:
    size: 10Gi

replica:
  replicaCount: 3
  persistence:
    size: 10Gi

sentinel:
  enabled: false 