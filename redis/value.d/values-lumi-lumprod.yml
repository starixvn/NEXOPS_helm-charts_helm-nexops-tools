clusterDomain: "lumi.lumprod"
useHostnames: false
commonLabels:
  redis-system: rocketor


global:
  storageClass: "longhorn-best-effort"
  imageRegistry: hub.nexdev.net

image:
  repository: base/redis
  tag: 7.2.4-debian-12-r9


metrics:
  image:
    repository: base/redis-exporter
    tag: 1.58.0-debian-12-r3
  enabled: true
  serviceMonitor:
    enabled: true
  podMonitor:
    enabled: true


auth:
  password: "qdT2!aC-DZc3"


commonConfiguration: |-
  save 900 1
  save 300 10
  save 60 10000
  appendonly yes
  appendfilename "appendonly.aof"
  appendfsync everysec


volumePermissions:
  enabled: true
  image:
    repository: base/os-shell
    tag: 12-debian-12-r16

master:
  persistence:
    size: 10Gi

sentinel:
  enabled: true
  persistence:
    size: 1Gi
  image:
    registry: 
    repository: base/redis-sentinel
    tag: 7.2.4-debian-12-r7


replica:
  replicaCount: 3
  persistence:
    size: 10Gi
  resourcesPreset: "medium"
