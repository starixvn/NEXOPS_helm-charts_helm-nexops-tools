clusterDomain: "starix.nexprod"



global:
  storageClass: "longhorn-effort"
  imageRegistry: "hub.nexdev.net"

image:
  repository: base/redis
  tag: 7.2.4-debian-12-r9



auth:
  password: "foo1@bared"

commonConfiguration: |-
  save 900 1
  save 300 10
  save 60 10000
  appendonly yes
  appendfilename "appendonly.aof"
  appendfsync everysec


volumePermissions:
  enabled: true

master:
  persistence:
    size: 10Gi

sentinel:
  enabled: true
  image:
    registry: 
    repository: base/redis-sentinel
    tag: 7.2.4-debian-12-r7
  persistence:
    size: 1Gi    

replica:
  replicaCount: 3
  persistence:
    size: 10Gi
