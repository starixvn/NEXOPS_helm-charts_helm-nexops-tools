ingress:
  hostname: "sentry-s1.nexentgame.com"

filestore:
  filesystem:
    persistence:
      storageClass: "local-path"


# sentry:
#   workerEvents:
#     enabled: "true"
#   workerTransactions:
#     enabled: "true"

sentry:
  worker:
    replicas: 2
  cleanup:
    days: 1

symbolicator:
  enabled: true

clickhouse:
  clusterDomain: starix.k3slocal
  nodeSelector:
    sentry: "yes"
  clickhouse:
    ## The instance number of Clickhouse
    replicas: "1"
    persistentVolumeClaim:
      dataPersistentVolume:
        storageClassName: "local-path"
    nodeSelector:
      sentry: "yes"
kafka:
  global:
    storageClass: "local-path"
  extraConfig: |
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    
    log.retention.hours=72
    log.retention.bytes=3221225472
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=60000
    log.segment.delete.delay.ms=1000
  controller:
    nodeSelector:
      sentry: "yes"
  clusterDomain: starix.k3slocal
  zookeeper:
    clusterDomain: starix.k3slocal
memcached:
  clusterDomain: starix.k3slocal
nginx:
  clusterDomain: starix.k3slocal
  nodeSelector:
    sentry: "yes"
postgresql:
  global:
    storageClass: "local-path"
  clusterDomain: starix.k3slocal
  auth:
    database: sentry
    enablePostgresUser: true
    existingSecret: ""
    password: "passwdpostgres"
    postgresPassword: "passwdpostgres"
    replicationPassword: "passwdpostgres"
    replicationUsername: repl_user
    secretKeys:
      adminPasswordKey: postgres-password
      replicationPasswordKey: replication-password
      userPasswordKey: password
    usePasswordFiles: false
    username: "postgres"
  common:
    exampleValue: common-chart
    global:
      imagePullSecrets: []
      imageRegistry: ""
      postgresql:
        auth:
          database: "sentry"
          existingSecret: ""
          password: "passwdpostgres"
          postgresPassword: "passwdpostgres"
          secretKeys:
            adminPasswordKey: "postgres-password"
            replicationPasswordKey: "replication-password"
            userPasswordKey: "password"
          username: "postgres"
  primary:
    nodeSelector:
      sentry: "yes"
rabbitmq:
  clusterDomain: starix.k3slocal
  global:
    storageClass: "local-path"
  nodeSelector:
    sentry: "yes"
redis:
  clusterDomain: starix.k3slocal
  global:
    storageClass: "local-path"
  master:
    nodeSelector:
      sentry: "yes"
  replica:
    nodeSelector:
      sentry: "yes"  
  commonConfiguration: |-
    # Enable AOF https://redis.io/topics/persistence#append-only-file
    appendonly yes
    # Disable RDB persistence, AOF persistence already enabled.
    save ""
    maxmemory 6000M
    maxmemory-policy volatile-ttl
zookeeper:
  clusterDomain: starix.k3slocal
  global:
    storageClass: "local-path"
  nodeSelector:
    sentry: "yes"
