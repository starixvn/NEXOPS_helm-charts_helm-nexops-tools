ingress:
  hostname: "sentry-s1.nexentgame.com"

# filestore:
#   filesystem:
#     persistence:
#       storageClass: "local-path"


sentry:
  workerEvents:
    enabled: "true"
  workerTransactions:
    enabled: "true"

clickhouse:
  clusterDomain: lumi.local
kafka:
  extraConfig: |
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
  clusterDomain: lumi.local
  zookeeper:
    clusterDomain: lumi.local
memcached:
  clusterDomain: lumi.local
nginx:
  clusterDomain: lumi.local
postgresql:
  clusterDomain: lumi.local
  auth:
    database: sentry
    enablePostgresUser: true
    existingSecret: ""
    password: "passwdpostgres"
    postgresPassword: "passwdpostgres"
    replicationPassword: "passwdpostgres"
    replicationUsername: repl_user
    secretKeys:
      adminPasswordKey: postgres-password
      replicationPasswordKey: replication-password
      userPasswordKey: password
    usePasswordFiles: false
    username: "postgres"
  common:
    exampleValue: common-chart
    global:
      imagePullSecrets: []
      imageRegistry: ""
      postgresql:
        auth:
          database: "sentry"
          existingSecret: ""
          password: "passwdpostgres"
          postgresPassword: "passwdpostgres"
          secretKeys:
            adminPasswordKey: "postgres-password"
            replicationPasswordKey: "replication-password"
            userPasswordKey: "password"
          username: "postgres"
rabbitmq:
  clusterDomain: lumi.local
redis:
  clusterDomain: lumi.local
zookeeper:
  clusterDomain: lumi.local
