sentry:
  cleanup:
    days: 3
#   workerEvents:
#     enabled: "true"
#   workerTransactions:
#     enabled: "true"

# symbolicator:
#   enabled: true

clickhouse:
  clusterDomain: lumi.local
kafka:
  extraConfig: |
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1

    log.retention.hours=72
    log.retention.bytes=3221225472
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=60000
    log.segment.delete.delay.ms=1000
  clusterDomain: lumi.local
  zookeeper:
    clusterDomain: lumi.local
memcached:
  clusterDomain: lumi.local
nginx:
  clusterDomain: lumi.local
postgresql:
  clusterDomain: lumi.local
  auth:
    database: sentry
    enablePostgresUser: true
    existingSecret: ""
    password: "passwdpostgres"
    postgresPassword: "passwdpostgres"
    replicationPassword: "passwdpostgres"
    replicationUsername: repl_user
    secretKeys:
      adminPasswordKey: postgres-password
      replicationPasswordKey: replication-password
      userPasswordKey: password
    usePasswordFiles: false
    username: "postgres"
  common:
    exampleValue: common-chart
    global:
      imagePullSecrets: []
      imageRegistry: ""
      postgresql:
        auth:
          database: "sentry"
          existingSecret: ""
          password: "passwdpostgres"
          postgresPassword: "passwdpostgres"
          secretKeys:
            adminPasswordKey: "postgres-password"
            replicationPasswordKey: "replication-password"
            userPasswordKey: "password"
          username: "postgres"
rabbitmq:
  clusterDomain: lumi.local
redis:
  clusterDomain: lumi.local
zookeeper:
  clusterDomain: lumi.local
