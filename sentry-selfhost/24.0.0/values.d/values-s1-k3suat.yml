ingress:
  hostname: "sentry-s1.vgamesuat.com"
  additionalHostNames:
  - "vn-s1-sentry-uat.nebula.prod"

filestore:
  filesystem:
    persistence:
      storageClass: "longhorn-s1"

# filestore:
#   filesystem:
#     persistence:
#       storageClass: "local-path"


# sentry:
#   workerEvents:
#     enabled: "true"
#   workerTransactions:
#     enabled: "true"

symbolicator:
  enabled: true

clickhouse:
  clusterDomain: starix.k3suat
  nodeSelector:
    sentry: "yes"
  clickhouse:
    ## The instance number of Clickhouse
    # replicas: "1"
    persistentVolumeClaim:
      dataPersistentVolume:
        storageClassName: "longhorn-s1"
    nodeSelector:
      sentry: "yes"
kafka:
  global:
    storageClass: "longhorn-s1"
  extraConfig: |
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    log.retention.hours=72
    log.retention.bytes=3221225472
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=60000
    log.segment.delete.delay.ms=1000

  clusterDomain: starix.k3suat
  zookeeper:
    clusterDomain: starix.k3suat
memcached:
  clusterDomain: starix.k3suat
nginx:
  clusterDomain: starix.k3suat
postgresql:
  global:
    storageClass: "longhorn-s1"
  clusterDomain: starix.k3suat
  auth:
    database: sentry
    enablePostgresUser: true
    existingSecret: ""
    password: "passwdpostgres"
    postgresPassword: "passwdpostgres"
    replicationPassword: "passwdpostgres"
    replicationUsername: repl_user
    secretKeys:
      adminPasswordKey: postgres-password
      replicationPasswordKey: replication-password
      userPasswordKey: password
    usePasswordFiles: false
    username: "postgres"
  common:
    exampleValue: common-chart
    global:
      imagePullSecrets: []
      imageRegistry: ""
      postgresql:
        auth:
          database: "sentry"
          existingSecret: ""
          password: "passwdpostgres"
          postgresPassword: "passwdpostgres"
          secretKeys:
            adminPasswordKey: "postgres-password"
            replicationPasswordKey: "replication-password"
            userPasswordKey: "password"
          username: "postgres"
rabbitmq:
  global:
    storageClass: "longhorn-s1"
  nodeSelector:
    sentry: "yes"
  clusterDomain: starix.k3suat
redis:
  clusterDomain: starix.k3suat
  global:
    storageClass: "longhorn-s1"
  master:
    nodeSelector:
      sentry: "yes"
  replica:
    nodeSelector:
      sentry: "yes"      
zookeeper:
  clusterDomain: starix.k3suat
  global:
    storageClass: "longhorn-s1"
  nodeSelector:
    sentry: "yes"   
