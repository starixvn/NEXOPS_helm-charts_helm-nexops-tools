ipv6: false
user:
  create: true
  email: admin@sentry.local
  password: "?nxhrJ3kfAsK"

config:
  relay: |
    cache:
      envelope_buffer_size: 500000

images:
  sentry:
    repository: nexhub.nebula.prod/kbt/base/getsentry/sentry
    tag: 24.9.0
  snuba:
    repository: nexhub.nebula.prod/kbt/base/getsentry/snuba
