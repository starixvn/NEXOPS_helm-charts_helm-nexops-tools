postgresql:
  image:
    registry: nexhub.nebula.prod
    repository: kbt/base/bitnami/postgresql
    tag: 15.3.0-debian-11-r0   
  clusterDomain: starix.k3suat
  global:
    postgresql:
      username: "postgres"
      password: "passwdpostgres"
      database: "sentry"
  auth:
    database: sentry
    enablePostgresUser: true
    existingSecret: ""
    password: "passwdpostgres"
    postgresPassword: "passwdpostgres"
    replicationPassword: "passwdpostgres"
    replicationUsername: repl_user
    secretKeys:
      adminPasswordKey: postgres-password
      replicationPasswordKey: replication-password
      userPasswordKey: password
    usePasswordFiles: false
    username: "postgres"
  primary:
    persistence:
      enabled: true
      storageClass: "local-path"
      size: "20Gi"
    nodeSelector:
      st-sentry: "yes"
    tolerations:
    - effect: NoSchedule
      key: st-sentry
      value: "yes"
    extendedConfiguration: |
      max_connections = 1000

