kafka:
  image:
    registry: nexhub.nebula.prod
    repository: kbt/base/bitnami/kafka
    tag: 3.7.0-debian-12-r7
  global:
    storageClass: "local-path"
  controller:
    # heapOpts: -Xmx4g -Xms2g
    replicaCount: 3
    nodeSelector:
      st-sentry: "yes"
    tolerations:
    - effect: NoSchedule
      key: st-sentry
      value: "yes"
    persistence:
      enabled: true
      size: 30Gi
      storageClass: "local-path"
    resourcesPreset: "2xlarge"
  # broker: 
  #   heapOpts: -Xmx4g -Xms2g
  clusterDomain: starix.k3suat


