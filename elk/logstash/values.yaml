  ports:
    - name: beats
      port: 5000
      protocol: TCP
      targetPort: 5000
    - name: httplog
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: http
      port: 9600
      protocol: TCP
      targetPort: 9600

ingress:
  enabled: false
  annotations:
    {}
