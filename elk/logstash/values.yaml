---
replicas: 1

# Allows you to add any config files in /usr/share/logstash/config/
# such as logstash.yml and log4j2.properties
#
# Note that when overriding logstash.yml, `http.host: 0.0.0.0` should always be included
# to make default probes work.
logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"
#  log4j2.properties: |
#    key = value

# Allows you to add any pipeline files in /usr/share/logstash/pipeline/
### ***warn*** there is a hardcoded logstash.conf in the image, override it first
logstashPipeline:
  logstash.conf: |
    input

    {
      # CloudTrail AWS LOCAL
      s3 {
        access_key_id => "AKIAYP7ZS6XE5FNUWD6C"
        secret_access_key => "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"
        bucket => "aws-cloudtrail-logs-nex-aws-management-events"
        type => "cloudtrail"
        codec => "cloudtrail"
        region => "ap-east-1"
        tags => ["awslocal"]
      }

      # tf.nexops Account
      # CloudTrail AWS KBT
      s3 {
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        bucket => "vnteam-aws-cloudtrail-logs-management-events"
        type => "cloudtrail"
        codec => "cloudtrail"
        region => "ap-northeast-1"
        tags => ["awskbt"]      
      }

      ###### AWS LOCAL
      # CloudWatch Control Plane Logs AWS LOCAL
      cloudwatch_logs {
        log_group => ["/aws/eks/lumi-local-eks/cluster"]
        region => "ap-east-1"
        access_key_id => "AKIAYP7ZS6XE5FNUWD6C"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-controlplane", "ekslocal", "awslocal"]
      }

      # CloudWatch Data Plane Logs AWS LOCAL
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-local-eks/dataplane"]
        region => "ap-east-1"
        access_key_id => "AKIAYP7ZS6XE5FNUWD6C"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-dataplane", "ekslocal", "awslocal"]
      }

      # CloudWatch Container Logs AWS LOCAL
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-local-eks/application"]
        region => "ap-east-1"
        access_key_id => "AKIAYP7ZS6XE5FNUWD6C"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-containers", "ekslocal", "awslocal"]
      }      

      # CloudWatch WorkerNodes Logs AWS LOCAL
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-local-eks/host"]
        region => "ap-east-1"
        access_key_id => "AKIAYP7ZS6XE5FNUWD6C"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-workernode", "ekslocal", "awslocal"]
      }      


      ###### AWS UAT
      # CloudWatch Control Plane Logs AWS UAT
      cloudwatch_logs {
        log_group => ["/aws/eks/lumi-uat-eks/cluster"]
        region => "ap-northeast-1"
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-controlplane", "eksuat", "awskbt"]
      }

      # CloudWatch Data Plane Logs AWS UAT
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-uat-eks/dataplane"]
        region => "ap-northeast-1"
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-dataplane", "eksuat", "awskbt"]
      }

      # CloudWatch Container Logs AWS UAT
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-uat-eks/application"]
        region => "ap-northeast-1"
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-containers", "eksuat", "awskbt"]
      }      

      # CloudWatch WorkerNodes Logs AWS UAT
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-uat-eks/host"]
        region => "ap-northeast-1"
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-workernode", "eksuat", "awskbt"]
      }  


      ###### AWS PROD
      # CloudWatch Control Plane Logs AWS PROD
      cloudwatch_logs {
        log_group => ["/aws/eks/lumi-prod-eks/cluster"]
        region => "ap-northeast-1"
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-controlplane", "eksprod", "awskbt"]
      }

      # CloudWatch Data Plane Logs AWS PROD
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-prod-eks/dataplane"]
        region => "ap-northeast-1"
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-dataplane", "eksprod", "awskbt"]
      }

      # CloudWatch Container Logs AWS PROD
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-prod-eks/application"]
        region => "ap-northeast-1"
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-containers", "eksprod", "awskbt"]
      }      

      # CloudWatch WorkerNodes Logs AWS PROD
      cloudwatch_logs {
        log_group => ["/aws/containerinsights/lumi-prod-eks/host"]
        region => "ap-northeast-1"
        access_key_id => "AKIAQG7QGZI4UIDXBN73"
        secret_access_key => "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"
        type => "cloudwatch"
        tags => ["eks-workernode", "eksprod", "awskbt"]
      } 


      http {
        port => 8080
        add_field => { "[@metadata][input-http]" => "" }
      }

      beats {
        port => 5000
      }

      tcp {
        port => 5044
      }
    }

    filter {

        # filter CloudTrail
        if [type] == "cloudtrail" {
          if [eventName] == "UpdateInstanceInformation" {
            drop {}
          }
          else if [eventName] == "PutObject" {
            if [sourceIPAddress] == "cloudtrail.amazonaws.com" and [requestParameters][bucketName] == "aws-cloudtrail-logs-nex-aws-management-events" {
              drop {}
            }
            else if [sourceIPAddress] == "cloudtrail.amazonaws.com" and [requestParameters][bucketName] == "vnteam-aws-cloudtrail-logs-management-events" {
              drop {}
            }
          }
          if [requestParameters][bucketName] == "nexdr" or [requestParameters][bucketName] == "nexec2" or [requestParameters][bucketName] =~ /spnk.*/ {
            drop {}
          }
          mutate {
            convert => {
              "[responseElements][networkInterface][tagSet][items][value]" => "string"
            }
          }


        }

        # Filter CloudWatch
        else if [type] == "cloudwatch" {

          # Filter EKS Logging
          if "eks-controlplane" in [tags] {
            if [cloudwatch_logs][log_stream] =~ /cloud-controller-manager.*/ {
              mutate {
                add_tag => ["cloud-controller-manager"]
              }
            }
            else if [cloudwatch_logs][log_stream] =~ /kube-controller-manager.*/ {
              mutate {
                add_tag => ["kube-controller-manager"]
              }          
            }
            else if [cloudwatch_logs][log_stream] =~ /kube-scheduler.*/ {
              mutate {
                add_tag => ["kube-scheduler"]
              }           
            }
          }
          else if "eks-dataplane" in [tags]  {
            json {
              source => "message"
            }
          }

          else if "eks-containers" in [tags] {
            json {
              source => "message"
            }            
          }

          else if "eks-workernode" in [tags] {
            json {
              source => "message"
            }            
          }

        }
        if "haproxy_access" in [tags] {
          grok {
            match => ["message","%{HAPROXYHTTP}","message","%{HAPROXYTCP}"]
          }

          grok {
            match => ["message", "%{HAPROXYDATE:accept_date}"]
          }

          grok {
            match => {"captured_request_headers" => "%{DATA:referrer}\|%{GREEDYDATA:user-agent}\|(%{GREEDYDATA:XForwardedFor}|%{IP:TrueClientIP})"}
          }
          mutate {
            remove_field => ["captured_response_cookie","haproxy_time","haproxy_month","haproxy_hour","srvconn","backend_queue","retries","termination_state"]
            remove_field => ["haproxy_monthday","time_backend_connect","pid","srv_queue","beat","beconn","client_port","haproxy_milliseconds","@version"]
            remove_field => ["haproxy_minute","offset","haproxy_second","actconn","source","program","haproxy_year","feconn","http_version"]
            remove_field => ["prospector","time_duration","time_queue","syslog_timestamp","captured_request_cookie","prospector"]
            
            convert => {
              "http_status_code" => "integer"
              "time_backend_response" => "integer"
            }

            rename => {"syslog_server" => "SyslogSrv"}
          }

          date {
            match => ["accept_date", "dd/MMM/yyyy:HH:mm:ss.SSS"]
          }

          geoip {
              source => "TrueClientIP"
          }

          if [captured_request_headers] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|grafana|whoami|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ {
            drop {}
          }

          if [message] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|health|whoami|healthz|grafana|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ {
            drop {}
          }

          if [http_status_code] == 400 or [http_status_code] == 404 or [http_status_code] == 403 or [http_status_code] == 201 or [http_status_code] == 204 or [http_status_code] == 101 or [http_status_code] == 301 or [http_status_code] == 405 or [http_status_code] == 302 or [http_status_code] == 304 {
            drop {}
          }


          if [http_status_code] == 200 and  [time_backend_response] < 5000 {
            drop {}
          }
        }
    }


    output {

      # Cloudtrail
      if [type] == "cloudtrail" {

        # CloudTrail AWS LOCAL
        if "awslocal" in [tags] {
          elasticsearch {
            hosts => "elasticsearch-master:9200"
            user => "logstash"
            password => "logstash"
            index => "logstash-cloudtrail-awslocal-%{+YYYY.MM.dd}"
          }
        }

        # CloudTrail AWS KBT
        else if "awskbt" in [tags] {
          elasticsearch {
            hosts => "elasticsearch-master:9200"
            user => "logstash"
            password => "logstash"
            index => "logstash-cloudtrail-awskbt-%{+YYYY.MM.dd}"
          }          
        }
      }
      # CloudWatch
      else if [type] == "cloudwatch" {

        # Output logs for EKSLOCAL
        if "ekslocal" in [tags] {

          # EKS Control Plane logging
          if "cloud-controller-manager" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-cloud-controller-manager-ekslocal-%{+YYYY.MM.dd}"
            }
          }
          else if "kube-controller-manager" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-kube-controller-manager-ekslocal-%{+YYYY.MM.dd}"
            }
          }
          else if "kube-scheduler" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-kube-scheduler-ekslocal-%{+YYYY.MM.dd}"
            }
          }

          # EKS Data Plane logging
          else if "eks-dataplane" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-dataplane-ekslocal-%{+YYYY.MM.dd}"
            } 
          }

          else if "eks-containers" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-container-logs-ekslocal-%{+YYYY.MM.dd}"
            }             
          }
          else if "eks-workernode" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-worker-node-logs-ekslocal-%{+YYYY.MM.dd}"
            }             
          }
        }

        # Output logs for EKSUAT
        else if "eksuat" in [tags] {
        
          if "cloud-controller-manager" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-cloud-controller-manager-eksuat-%{+YYYY.MM.dd}"
            }
          }
          else if "kube-controller-manager" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-kube-controller-manager-eksuat-%{+YYYY.MM.dd}"
            }
          }
          else if "kube-scheduler" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-kube-scheduler-eksuat-%{+YYYY.MM.dd}"
            }
          }

          # EKS Data Plane logging
          else if "eks-dataplane" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-dataplane-eksuat-%{+YYYY.MM.dd}"
            } 
          }

          else if "eks-containers" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-container-logs-eksuat-%{+YYYY.MM.dd}"
            }             
          }
          else if "eks-workernode" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-worker-node-logs-eksuat-%{+YYYY.MM.dd}"
            }             
          }
          else {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-unknown-eksuat-%{+YYYY.MM.dd}"
            }             
          }        
        }

        # Output logs for EKSPROD
        else if "eksprod" in [tags] {
          if "cloud-controller-manager" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-cloud-controller-manager-eksprod-%{+YYYY.MM.dd}"
            }
          }
          else if "kube-controller-manager" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-kube-controller-manager-eksprod-%{+YYYY.MM.dd}"
            }
          }
          else if "kube-scheduler" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-eks-kube-scheduler-eksprod-%{+YYYY.MM.dd}"
            }
          }

          # EKS Data Plane logging
          else if "eks-dataplane" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-dataplane-eksprod-%{+YYYY.MM.dd}"
            } 
          }

          else if "eks-containers" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-container-logs-eksprod-%{+YYYY.MM.dd}"
            }             
          }
          else if "eks-workernode" in [tags] {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-worker-node-logs-eksprod-%{+YYYY.MM.dd}"
            }             
          }
          else {
            elasticsearch {
              hosts => "elasticsearch-master:9200"
              user => "logstash"
              password => "logstash"
              index => "logstash-unknown-eksprod-%{+YYYY.MM.dd}"
            }             
          }          
        }
      }

      if "nexcel_haproxy_local" in [tags] {
        elasticsearch {
          hosts => "elasticsearch-master:9200"
          user => "logstash"
          password => "logstash"
          index => "%{[@metadata][beat]}-haproxy-gw-%{+YYYY.MM.dd}"
        }      
      }
      

      else {
        elasticsearch {
          hosts => "elasticsearch-master:9200"
          user => "logstash"
          password => "logstash"
          index => "logstash-unknown-%{+YYYY.MM.dd}"
          }        
        }
    }

# Allows you to add any pattern files in your custom pattern dir
logstashPatternDir: "/usr/share/logstash/patterns/"
logstashPattern: {}
#    pattern.conf: |
#      DPKG_VERSION [-+~<>\.0-9a-zA-Z]+

# Extra environment variables to append to this nodeGroup
# This will be appended to the current 'env:' key. You can use any of the kubernetes env
# syntax here
extraEnvs: []
#  - name: MY_ENVIRONMENT_VAR
#    value: the_value_goes_here

# Allows you to load environment variables from kubernetes secret or config map
envFrom: []
# - secretRef:
#     name: env-secret
# - configMapRef:
#     name: config-map

# Add sensitive data to k8s secrets
secrets: []
#  - name: "env"
#    value:
#      ELASTICSEARCH_PASSWORD: "LS1CRUdJTiBgUFJJVkFURSB"
#      api_key: ui2CsdUadTiBasRJRkl9tvNnw
#  - name: "tls"
#    value:
#      ca.crt: |
#        LS0tLS1CRUdJT0K
#        LS0tLS1CRUdJT0K
#        LS0tLS1CRUdJT0K
#        LS0tLS1CRUdJT0K
#      cert.crt: "LS0tLS1CRUdJTiBlRJRklDQVRFLS0tLS0K"
#      cert.key.filepath: "secrets.crt" # The path to file should be relative to the `values.yaml` file.

# A list of secrets and their paths to mount inside the pod
secretMounts: []

hostAliases: []
#- ip: "127.0.0.1"
#  hostnames:
#  - "foo.local"
#  - "bar.local"

image: "hub.lumigame.com/base/elk/logstash"
imageTag: "7.17.6"
imagePullPolicy: "Always"
imagePullSecrets: []

podAnnotations: {}

# additionals labels
labels: {}

logstashJavaOpts: "-Xmx2g -Xms2g"

resources:
  requests:
    # cpu: "100m"
    memory: "1536Mi"
  limits:
    cpu: "1000m"
    memory: "2048Mi"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

rbac:
  create: false
  serviceAccountAnnotations: {}
  serviceAccountName: ""
  annotations:
    {}
    #annotation1: "value1"
    #annotation2: "value2"
    #annotation3: "value3"

podSecurityPolicy:
  create: false
  name: ""
  spec:
    privileged: false
    fsGroup:
      rule: RunAsAny
    runAsUser:
      rule: RunAsAny
    seLinux:
      rule: RunAsAny
    supplementalGroups:
      rule: RunAsAny
    volumes:
      - secret
      - configMap
      - persistentVolumeClaim

persistence:
  enabled: true
  annotations: {}

extraVolumes:
  []
  # - name: extras
  #   emptyDir: {}

extraVolumeMounts:
  []
  # - name: extras
  #   mountPath: /usr/share/extras
  #   readOnly: true

extraContainers:
  []
  # - name: do-something
  #   image: busybox
  #   command: ['do', 'something']

extraInitContainers:
  []
  # - name: do-something
  #   image: busybox
  #   command: ['do', 'something']

# This is the PriorityClass settings as defined in
# https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass
priorityClassName: ""

# By default this will make sure two pods don't end up on the same node
# Changing this to a region would allow you to spread pods across regions
antiAffinityTopologyKey: "kubernetes.io/hostname"

# Hard means that by default pods will only be scheduled if there are enough nodes for them
# and that they will never end up on the same node. Setting this to soft will do this "best effort"
antiAffinity: "hard"

# This is the node affinity settings as defined in
# https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
nodeAffinity: {}

# This is inter-pod affinity settings as defined in
# https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
podAffinity: {}

# The default is to deploy all pods serially. By setting this to parallel all pods are started at
# the same time when bootstrapping the cluster
podManagementPolicy: "Parallel"

httpPort: 9600

# Custom ports to add to logstash
extraPorts:
  - name: httplog
    containerPort: 8080
  - name: beats
    containerPort: 5000

updateStrategy: RollingUpdate

# This is the max unavailable setting for the pod disruption budget
# The default value of 1 will make sure that kubernetes won't allow more than 1
# of your pods to be unavailable during maintenance
maxUnavailable: 1

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# How long to wait for logstash to stop gracefully
terminationGracePeriod: 120

# Probes
# Default probes are using `httpGet` which requires that `http.host: 0.0.0.0` is part of
# `logstash.yml`. If needed probes can be disabled or overridden using the following syntaxes:
#
# disable livenessProbe
# livenessProbe: null
#
# replace httpGet default readinessProbe by some exec probe
# readinessProbe:
#   httpGet: null
#   exec:
#     command:
#       - curl
#      - localhost:9600

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 3

