# replicas: 1
# minimumMasterNodes: 1
image: hub.nexdev.net/base/elasticsearch/elasticsearch
imageTag: "8.5.1"
resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

ingress:
  enabled: true
  className: "haproxy"
  pathtype: ImplementationSpecific
  hosts:
    - host: "elsearch.nexdev.net"
      paths:
        - path: "/"


volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

networkPolicy:
  http:
    enabled: true
  transport:
    enabled: true

protocol: http
antiAffinity: "soft"
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.http.ssl:
      enabled: false

    xpack.security.authc:
      anonymous:
        username: anonymous_user
        roles: superuser
        authz_exception: true

replicas: 1
minimumMasterNodes: 1