{{- if .Values.rabbitCluster.service.headless.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-cluster-headless
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: rabbitmq
    app.kubernetes.io/name: rabbitmq-cluster
    app.kubernetes.io/part-of: {{ include "common.names.name" . }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq-cluster
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
    - name: manager
      port: 15672
      targetPort: 15672
      protocol: TCP
    - name: prometheus
      port: 15692
      targetPort: 15692
      protocol: TCP
  publishNotReadyAddresses: true
{{- end }}
