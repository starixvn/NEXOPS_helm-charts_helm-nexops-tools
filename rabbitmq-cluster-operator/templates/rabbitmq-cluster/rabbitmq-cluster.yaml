apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq-cluster
  namespace: {{ include "common.names.namespace" . | quote }}
spec:
  replicas: 3
  terminationGracePeriodSeconds: 30
  rabbitmq:
    additionalConfig: |
      default_user = {{ .Values.rabbitCluster.user }}
      default_pass = {{ .Values.rabbitCluster.password }}
      vm_memory_high_watermark.absolute = {{ .Values.rabbitCluster.resources.maxMemory }}
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: {{ .Values.rabbitCluster.resources.maxMemory }}
  override:
    service:
      spec:
        ports:
          - appProtocol: amqp
            name: amqp
            port: 5672
            protocol: TCP
            targetPort: 5672
            nodePort: {{ .Values.rabbitCluster.service.amqp.nodePort }}
          - appProtocol: http
            name: manager
            port: 15672
            protocol: TCP
            targetPort: 15672
            nodePort: {{ .Values.rabbitCluster.service.manager.nodePort }}
        type: NodePort
  persistence:
    storageClassName: {{ .Values.global.storageClass }}
    storage: {{ .Values.global.storageSize }}