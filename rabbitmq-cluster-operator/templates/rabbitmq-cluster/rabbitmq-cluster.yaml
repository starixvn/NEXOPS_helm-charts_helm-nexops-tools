apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq-cluster
  namespace: {{ include "common.names.namespace" . | quote }}
spec:
  replicas: 3
  rabbitmq:
    additionalConfig: |
      default_user={{ .Values.rabbitCluster.user }}
      default_pass={{ .Values.rabbitCluster.password }}
      cluster_partition_handling = autoheal
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: {{ .Values.rabbitCluster.resources.maxMemory }}
  override:
    service:
      spec:
        ports:
          - appProtocol: amqp
            name: amqp
            port: 5672
            protocol: TCP
            targetPort: 5672
            nodePort: 30672
          - appProtocol: http
            name: manager
            port: 15672
            protocol: TCP
            targetPort: 15672
            nodePort: 31672
        type: NodePort
  persistence:
    storageClass: "longhorn"
    size: 10Gi
