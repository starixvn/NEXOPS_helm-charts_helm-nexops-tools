ingress:
  enabled: true
  className: "haproxy"
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: tolgee-alpha.nexdev.net
      paths:
        - path: /
          pathType: Prefix

service:
  type: NodePort
  port: 8080

postgresql:
  enabled: true
  image:
    repository: bitnami/postgresql
    tag: 13.18.0
  architecture: "standalone"
  auth:
    postgresPassword: 1qaz@WSX
    database: tolgee
    username: tolgee
    password: tolgee
  primary:
    persistence:
      enabled: true
      type: pvc
      size: 1Gi
      storageClass: longhorn

tolgee:
  env:
    TOLGEE_SMTP_FROM: Tolgee <tolgee@starixsoft.com>
    TOLGEE_SMTP_HOST: smtp.nexdev.net
    TOLGEE_SMTP_PORT: 25
    TOLGEE_MACHINE_TRANSLATION_AWS: "true"
  persistence:
    type: pvc
    enabled: true
    storageClass: longhorn
    size: 1Gi
