ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: tolgee-sc.sabagame.com
      paths:
        - path: /
          pathType: Prefix
        
service:
  type: NodePort #ClusterIP
  port: 8080

tolgee:
  env: {}
  persistence:
    type: pvc
    enabled: true
    storageClass: longhorn
    size: 1Gi