ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: tolgee-k3s.sabagame.com
      paths:
        - path: /
          pathType: Prefix

service:
  type: NodePort #ClusterIP
  port: 8080

postgresql:
  enabled: true
  architecture: "standalone"
  auth:
    postgresPassword: 1qaz@WSX
    database: tolgee
    username: tolgee
    password: tolgee_password
  primary:
    persistence: 
      enabled: true
      type: pvc
      size: 1Gi
      storageClass: longhorn

tolgee:
  env: {}
  persistence:
    type: pvc
    enabled: true
    storageClass: longhorn
    size: 1Gi