kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: rsyslog-data-pvc
  namespace: "logging"
spec:
  # storageClassName: longhorn-rwx
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-hap-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Grace                     30
        Log_Level                 info
        Daemon                    off
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2023
        storage.path              /var/fluent-bit/state/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 5M

    @INCLUDE hap-ing.conf
    @INCLUDE hap-gw.conf

  hap-ing.conf: |

    [INPUT]
        Name                tail
        Tag                 hap-ing.*
        Path                /logs/hap-ing.log
        Mem_Buf_Limit       50MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Rotate_Wait         30
        storage.type        filesystem
        Read_from_Head      True

    [OUTPUT]
        Name                cloudwatch_logs
        Match               hap-ing.*
        region              ap-northeast-1
        log_group_name      /aws/uat/haproxy-ing






---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsyslog-deployment
  namespace: logging
  labels:
    app: rsyslog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsyslog
  template:
    metadata:
      labels:
        app: rsyslog
    spec:
      nodeSelector:
        nexops: "yes"
      containers:
      - name: rsyslog-server
        image: hub.lumigame.com/base/rsyslog-server:v1.5
        ports:
        - containerPort: 514
        resources:
          limits:
            cpu: 1
        volumeMounts:
          - name: rsyslog-data
            mountPath: "/logs"
      - name: fluentbit-sidecar
        image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
        volumeMounts:
          - name: rsyslog-data
            mountPath: "/logs"
          - name: fluent-bit-hap-config
            mountPath: /fluent-bit/etc/
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rsyslog-data
          persistentVolumeClaim:
            claimName: rsyslog-data-pvc
        - name: fluent-bit-hap-config
          configMap:
            name: fluent-bit-hap-config
---
apiVersion: v1
kind: Service
metadata:
  name: "rsyslog-service"
  namespace: "logging"
spec:
  ports:
    - port: 514
      targetPort: 514
      protocol: UDP
      nodePort: 30161
  type: NodePort
  selector:
    app: "rsyslog"

