expose:
  tls:
    enabled: false
  ingress:
    className: "haproxy"
    hosts:
      core: hub-backup.nexdev.net
externalURL: https://hub-backup.nexdev.net

persistence:
  persistentVolumeClaim:
    registry:
      storageClass: "local-path"
      size: 500Gi
    jobservice:
      jobLog:
        storageClass: "local-path"
        size: 5Gi
    database:
      storageClass: "local-path"
      size: 10Gi
    redis:
      storageClass: "local-path"
      size: 30Gi
    trivy:
      storageClass: "local-path"
      size: 5Gi

cache:
  enabled: true
  expireHours: 24

metrics:
  enabled: true
  serviceMonitor:
    enabled: true


portal:
  nodeSelector:
    hub-backup: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: hub-backup
core:
  nodeSelector:
    hub-backup: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: hub-backup
jobservice:
  nodeSelector:
    hub-backup: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: hub-backup
registry:
  nodeSelector:
    hub-backup: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: hub-backup
trivy:
  image:
    repository: goharbor/trivy-adapter-photon
    tag: v2.12.1
  nodeSelector:
    hub-backup: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: hub-backup
  skipUpdate: false
  skipJavaDBUpdate: false
  offlineScan: false
database:
  internal:
    nodeSelector:
      hub-backup: "yes"
    tolerations:
    - effect: NoSchedule
      key: cattle.io/os
      value: hub-backup
redis:
  internal:
    nodeSelector:
      hub-backup: "yes"
    tolerations:
    - effect: NoSchedule
      key: cattle.io/os
      value: hub-backup
exporter:
  nodeSelector:
    hub-backup: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: hub-backup

