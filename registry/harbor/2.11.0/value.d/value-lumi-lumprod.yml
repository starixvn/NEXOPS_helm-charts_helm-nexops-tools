expose:
  tls:
    enabled: false
  ingress:
    className: "haproxy"
    hosts:
      core: hub-bk.lumigame.com
externalURL: https://hub-bk.lumigame.com

persistence:
  persistentVolumeClaim:
    registry:
      storageClass: "local-path"
      size: 120Gi
    jobservice:
      jobLog:
        storageClass: "local-path"
        size: 5Gi
    database:
      storageClass: "local-path"
      size: 10Gi
    redis:
      storageClass: "local-path"
      size: 20Gi
    trivy:
      storageClass: "local-path"
      size: 10Gi

cache:
  enabled: true
  expireHours: 8


metrics:
  enabled: true
  serviceMonitor:
    enabled: true


portal:
  nodeSelector:
    harbor-workload: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: harbor
core:
  nodeSelector:
    harbor-workload: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: harbor
jobservice:
  nodeSelector:
    harbor-workload: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: harbor
registry:
  nodeSelector:
    harbor-workload: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: harbor
trivy:
  nodeSelector:
    harbor-workload: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: harbor
  skipUpdate: true
  skipJavaDBUpdate: true
  offlineScan: true
database:
  internal:
    nodeSelector:
      harbor-workload: "yes"
    tolerations:
    - effect: NoSchedule
      key: cattle.io/os
      value: harbor
redis:
  internal:
    nodeSelector:
      harbor-workload: "yes"
    tolerations:
    - effect: NoSchedule
      key: cattle.io/os
      value: harbor
exporter:
  nodeSelector:
    harbor-workload: "yes"
  tolerations:
  - effect: NoSchedule
    key: cattle.io/os
    value: harbor

