---
deployment:
  image:
    # -- Image that is deployed (change e.g. for private registry-proxy)
    repo: hub.lumigame.com/base/minio/vault-raft-snapshot-agent


config:
  # -- Url to the vault-API on the *leader* of your vault-cluster, e.g. `https?://vault-active.<vault-namespace>.svc.cluster.local:<vault-server service-port>`
  vault:
    url: http://vault-internal.vault.svc:8200
    auth:
      kubernetes:
        role: vault-raft-snapshot-agent
  snapshots:
    frequency: 6h
    retain: 4
    storages:
      local:
        enabled: false
      aws:
        bucket: "vault-lumprod-backup"
        accessKeyId: "backupper"
        accessKey: "FEWL7QMsGFnVQkUyJcVv"
        endpoint: "https://minio-lumprod-api.lumigame.com"