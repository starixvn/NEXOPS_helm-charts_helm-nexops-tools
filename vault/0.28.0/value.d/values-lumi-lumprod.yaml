server:
  resources: {}
    # limits:
    #   memory: 4Gi

  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: "/vault/data"
    storageClass: longhorn-stricted

  auditStorage:
    enabled: false

  ingress:
    enabled: true
    hosts: 
    - host: "vault.lumigame.com"
      paths: []
    annotations:
      ingress.kubernetes.io/ssl-redirect: "true"

  # Run Vault in "HA" mode.
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true
        cluster_name = "vault-integrated-storage"
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
          # Enable unauthenticated metrics access (necessary for Prometheus Operator)
          telemetry {
            unauthenticated_metrics_access = "true"
          }
          # tls_cert_file = "/vault/userconfig/tls-server/fullchain.pem"
          # tls_key_file = "/vault/userconfig/tls-server/server.key"
          # tls_client_ca_file = "/vault/userconfig/tls-server/client-auth-ca.pem"
        }

        seal "awskms" {
          region     = "ap-east-1"
          kms_key_id = "7ba20a15-eac9-4f9d-9319-471a377ac8ca"
        }

        telemetry {
          prometheus_retention_time = "24h",
          disable_hostname = true
        }

        storage "raft" {
          path = "/vault/data"
            retry_join {
            leader_api_addr = "http://vault-cluster-0.vault-cluster-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-cluster-1.vault-cluster-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-cluster-2.vault-cluster-internal:8200"
          }
        }

        # storage "raft" {
