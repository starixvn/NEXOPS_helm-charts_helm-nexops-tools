---
server:
  resources:
    limits:
      memory: 1Gi

  dataStorage:
    enabled: true
    size: 5Gi
    mountPath: "/vault/data"
    storageClass: longhorn-stricted

  auditStorage:
    enabled: false

  ingress:
    enabled: true
    hosts: 
    - host: "vault.starixuat.com"
      paths: []
    annotations:
      ingress.kubernetes.io/ssl-redirect: "true"

  # Run Vault in "HA" mode.
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true
        cluster_name = "vault-integrated-storage"
        # default_max_request_duration = "7200s"
        
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
          # Enable unauthenticated metrics access (necessary for Prometheus Operator)
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        seal "awskms" {
          region     = "ap-east-1"
          kms_key_id = "0ff7b39a-cc1a-4bb1-96c2-6e52a4245371"
        }

        telemetry {
          prometheus_retention_time = "24h",
          disable_hostname = true
        }

        storage "raft" {
          path = "/vault/data"
            retry_join {
            leader_api_addr = "http://vault-nexprod-0.vault-nexprod-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-nexprod-1.vault-nexprod-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-nexprod-2.vault-nexprod-internal:8200"
          }
        }