---
server:
  # resources:
  #   limits:
  #     memory: 2Gi

  dataStorage:
    enabled: true
    size: 5Gi
    mountPath: "/vault/data"
    storageClass: longhorn-stricted

  auditStorage:
    enabled: false

  ingress:
    activeService: false
    ingressClassName: "haproxy"
    enabled: true
    hosts: 
    - host: "vault.starixuat.com"
      paths: []

  # Run Vault in "HA" mode.
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true
        cluster_name = "vault-integrated-storage"
        # default_max_request_duration = "7200s"
        
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
          # Enable unauthenticated metrics access (necessary for Prometheus Operator)
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        # seal "awskms" {
        #   region     = "ap-east-1"
        #   kms_key_id = "0ff7b39a-cc1a-4bb1-96c2-6e52a4245371"
        # }

        telemetry {
          prometheus_retention_time = "24h",
          disable_hostname = true
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "http://vault-k3suat-0.vault-k3suat-internal:8200"
          }
          # retry_join {
          #   leader_api_addr = "http://vault-k3suat-1.vault-k3suat-internal:8200"
          # }
          # retry_join {
          #   leader_api_addr = "http://vault-k3suat-2.vault-k3suat-internal:8200"
          # }
        }

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 180

  updateStrategyType: "RollingUpdate"

  # extraSecretEnvironmentVars:
  # - envName: AWS_ACCESS_KEY_ID
  #   secretName: eks-creds
  #   secretKey: AWS_ACCESS_KEY_ID
  # - envName: AWS_SECRET_ACCESS_KEY
  #   secretName: eks-creds
  #   secretKey: AWS_SECRET_ACCESS_KEY

  standalone:
    enabled: false

  # tolerations:
  # - effect: NoSchedule
  #   key: cattle.io/os
  #   operator: Equal
  #   value: linux
  nodeSelector:
    vault-workload: "yes"

# injector:
#   tolerations:
#   - effect: NoSchedule
#     key: cattle.io/os
#     operator: Equal
#     value: linux

ui:
  enabled: true
  externalPort: 8200
  targetPort: 8200
  activeVaultPodOnly: false
  serviceType: "ClusterIP"