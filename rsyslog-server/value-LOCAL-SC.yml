kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: rsyslog-data-pvc
  namespace: "logging"
spec:
  storageClassName: longhorn-rwx
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: "logging"
  labels:
    app: filebeat
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: log
      paths:
        - /logs/haproxy/hap-gw.log
      exclude_lines: [".png", ".css", ".gif", ".jpg", ".js", ".ico", ".json", ".mp3", ".ttf"]
      tags: ["lumi_haproxy_local", "haproxy_access", "local", "hap-gw"]
    - type: log
      paths:
        - /logs/haproxy/hap-ing.log
      exclude_lines: [".png", ".css", ".gif", ".jpg", ".js", ".ico", ".json", ".mp3", ".ttf"]
      tags: ["lumi_haproxy_local", "haproxy_access", "local", "hap-ing"]
    output:
      logstash:
        hosts: ["10.10.50.121:30500"]

    filebeat.config.modules:
      # Glob pattern for configuration loading
      path: ${path.config}/modules.d/*.yml
      # Set to true to enable config reloading
      reload.enabled: false
    logging:
      ### Filebeat log
      level: info


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsyslog-deployment
  namespace: logging
  labels:
    app: rsyslog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsyslog
  template:
    metadata:
      labels:
        app: rsyslog
    spec:
      nodeSelector:
        nexops-tools: "yes"
      containers:
      - name: rsyslog-server
        image: hub.lumigame.com/base/rsyslog-server:v1.5
        ports:
        - containerPort: 514
        resources:
          limits:
            cpu: 1
        volumeMounts:
          - name: rsyslog-data
            mountPath: "/logs"
      - name: filebeat-sidecar
        image: hub.lumigame.com/base/filebeat:8.8.2 
        volumeMounts:
          - name: rsyslog-data
            mountPath: "/logs"
          - name: filebeat-config
            mountPath: /usr/share/filebeat/filebeat.yml
            subPath: filebeat.yml
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rsyslog-data
          persistentVolumeClaim:
            claimName: rsyslog-data-pvc
        - name: filebeat-config
          configMap:
            name: filebeat-config
---
apiVersion: v1
kind: Service
metadata:
  name: "rsyslog-service"
  namespace: "logging"
spec:
  ports:
    - port: 514
      targetPort: 514
      protocol: UDP
      nodePort: 30161
  type: NodePort
  selector:
    app: "rsyslog"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: logrotate-config
  namespace: logging
data:
  my_logs.conf: |
    /logs/*/*.log {
        size 1G
        missingok
        rotate 3
        compress
        copytruncate
        dateformat -%Y%m%d_%H%M%S
        su root root
    }


---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: logrotate-cj
  namespace: logging
spec:
  schedule: "0 * * * *"
  timeZone: "Asia/Bangkok"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cronjob-logrotate
            image: hub.lumigame.com/base/logrotate:latest
            imagePullPolicy: IfNotPresent
            volumeMounts:
            - name: logrotate-conf
              mountPath: /etc/logrotate.d
            - name: app-logs
              mountPath: /logs
          volumes:
          - name: logrotate-conf
            configMap:
              name: logrotate-config
          - name: app-logs
            persistentVolumeClaim:
              claimName: rsyslog-data-pvc
          restartPolicy: OnFailure




